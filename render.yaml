services:
  - type: web
    name: neo-marketing-system
    runtime: python
    region: oregon
    autoDeploy: true
    buildCommand: pip install --force-reinstall --no-cache-dir -r xiangchuan/marketing_system/requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/.cache/ms-playwright python3 -m playwright install --with-deps chromium
    startCommand: PYTHONPATH=xiangchuan:$PYTHONPATH python3 -m uvicorn marketing_system.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TELEGRAM_NOTIFY_CHAT_ID
        value: "626453598"
      - key: LINE_NOTIFY_TOKEN
        sync: false
      - key: RENDER
        value: "true"
      - key: BASE_URL
        value: "https://lewislunora.onrender.com"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/opt/render/.cache/ms-playwright"
    plan: free
