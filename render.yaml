services:
  - type: web
    name: neo-marketing-system
    runtime: python
    region: oregon
    buildCommand: pip install -r xiangchuan/marketing_system/requirements.txt
    startCommand: cd xiangchuan/marketing_system && bash start.sh
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RENDER
        value: "true"
    plan: free
