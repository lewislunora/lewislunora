    \n                 alt=\"AI Assistant\" \n                 class=\"beauty-photo\"\n
    \                onerror=\"this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22
    viewBox=%220 0 400 600%22><rect fill=%22%23f4c2a1%22 width=%22400%22 height=%22600%22/><circle
