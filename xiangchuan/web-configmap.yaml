    cy=%22230%22 r=%228%22 fill=%22%234a90e2%22/><circle cx=%22230%22 cy=%22230%22
    r=%228%22 fill=%22%234a90e2%22/><path d=%22M 180 280 Q 200 295 220 280%22 stroke=%22%23d4736a%22
    stroke-width=%223%22 fill=%22none%22/></svg>'\">\n            <div class=\"face-overlay\">\n
    \               <div class=\"face-eyes\">\n                    <div style=\"position:relative;width:24px;height:16px;background:rgba(255,255,255,0.3);border-radius:50%;\">\n
    \                       <div class=\"face-eye-lid\"></div>\n                    </div>\n
    \                   <div style=\"position:relative;width:24px;height:16px;background:rgba(255,255,255,0.3);border-radius:50%;\">\n
    \                       <div class=\"face-eye-lid\"></div>\n                    </div>\n
    \               </div>\n                <div class=\"face-mouth-area\">\n                    <div
    class=\"face-mouth\" id=\"beautyMouth\"></div>\n                </div>\n            </div>\n
    \           <div class=\"video-overlay\"></div>\n        </div>\n    </div>\n\n
    \   <div class=\"main-container\">\n        <div class=\"chat-section\">\n            <div
