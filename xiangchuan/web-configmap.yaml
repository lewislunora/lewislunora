    0 0 50% 50%;\n            transition: all 0.3s;\n        }\n\n        .speaking
    .beauty-mouth {\n            animation: beauty-speak 0.5s infinite;\n        }\n\n
    \       @keyframes beauty-speak {\n            0%, 100% { width: 30px; height:
