  index.html: "<!DOCTYPE html>\n<html lang=\"zh-TW\">\n<head>\n    <meta charset=\"UTF-8\">\n
    \   <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n
    \   <title>AI 虛擬助手 - 2026</title>\n    <style>\n        * { margin: 0; padding:
