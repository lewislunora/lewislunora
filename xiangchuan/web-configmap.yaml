    \       .beauty-nose {\n            position: absolute;\n            top: 80px;\n
    \           left: 50%;\n            transform: translateX(-50%);\n            width:
    8px;\n            height: 12px;\n            border-left: 2px solid #e8a89a;\n
    \           border-right: 2px solid #e8a89a;\n            border-bottom: 2px solid
    #e8a89a;\n            border-radius: 0 0 50% 50%;\n        }\n\n        .beauty-mouth
    {\n            position: absolute;\n            bottom: 40px;\n            left:
    50%;\n            transform: translateX(-50%);\n            width: 30px;\n            height:
