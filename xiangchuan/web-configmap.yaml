    \       }\n\n        .quick-actions {\n            display: flex;\n            gap:
    0.5rem;\n            padding: 0.5rem 1.5rem;\n            flex-wrap: wrap;\n        }\n\n
    \       .quick-btn {\n            padding: 0.5rem 1rem;\n            background:
    rgba(255,255,255,0.1);\n            border: 1px solid rgba(255,255,255,0.2);\n
