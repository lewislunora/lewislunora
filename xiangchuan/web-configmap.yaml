    \               </div>\n                <div class=\"message ai\">\n                    <div>我可以協助您：</div>\n
    \                   <div class=\"message-time\">現在</div>\n                </div>\n
    \               <div class=\"message ai\">\n                    <div>\U0001F4C8
    制定行銷策略<br>✍️ 撰寫推廣文案<br>\U0001F3AF 分析目標客群<br>\U0001F4CA 優化轉換率<br>\U0001F680 社群媒體推廣</div>\n
    \                   <div class=\"message-time\">現在</div>\n                </div>\n
    \           </div>\n\n            <div class=\"quick-actions\">\n                <button
    class=\"quick-btn\" onclick=\"quickMessage('分析我的產品')\">\U0001F4CA 產品分析</button>\n
    \               <button class=\"quick-btn\" onclick=\"quickMessage('寫一篇推廣文案')\">✍️
    推廣文案</button>\n                <button class=\"quick-btn\" onclick=\"quickMessage('制定行銷策略')\">\U0001F3AF
    行銷策略</button>\n                <button class=\"quick-btn\" onclick=\"quickMessage('社群媒體規劃')\">\U0001F4F1
    社群規劃</button>\n            </div>\n\n            <div class=\"typing-indicator\"
    id=\"typingIndicator\">\n                <span class=\"typing-dot\"></span>\n
    \               <span class=\"typing-dot\"></span>\n                <span class=\"typing-dot\"></span>\n
    \           </div>\n\n            <div class=\"input-area\">\n                <input
    type=\"text\" id=\"userInput\" placeholder=\"輸入訊息...\" onkeydown=\"if(event.key==='Enter')
    sendMessage()\">\n                <button onclick=\"sendMessage()\">發送</button>\n
    \           </div>\n        </div>\n    </div>\n\n    <script>\n        const
    aiResponses = {\n            '你好': '您好！我是您的 AI 虛擬推廣行銷助手 \U0001F680 很高興為您服務！有什麼行銷需求嗎？',\n
    \           '請介紹你自己': '我是 2026 最新版的 AI 虛擬推廣行銷助手！\\n\\n\U0001F3AF 專精數位行銷策略\\n\U0001F4AC
    支援自然語言互動\\n\U0001F680 即時生成推廣文案\\n\U0001F4CA 分析市場與競品\\n✨ 優化轉換率\\n\\n隨時告訴我您的推廣需求！',\n
    \           '分析我的產品': '太好了！請告訴我：\\n\\n\U0001F4E6 產品名稱：？\\n\U0001F3AF 目標客群：？\\n\U0001F4B0
    價格區間：？\\n✨ 產品特色：？\\n\\n我會為您生成完整的產品分析與行銷建議！',\n            '寫一篇推廣文案': '沒問題！請告訴我：\\n\\n1️⃣
    產品/服務類型\\n2️⃣ 目標受眾\\n3️⃣ 想強調的賣點\\n4️⃣ 文案風格（溫馨/專業/活潑）\\n\\n我會為您量身打造吸引人的推廣文案！',\n
    \           '制定行銷策略': '為您制定行銷策略！請提供：\\n\\n\U0001F3AF 行銷目標（品牌曝光/銷售/引流）\\n\U0001F4B0
    預算範圍\\n⏰ 推廣時程\\n\U0001F4F1 推廣渠道偏好\\n\\n我會為您規劃完整的行銷藍圖！',\n            '社群媒體規劃':
    '社群媒體推廣方案：\\n\\n\U0001F4F1 Facebook：長文+精美圖片\\n\U0001F4F8 Instagram：限時動態+Reels短片\\n\U0001F426
    Twitter：熱門話題+互動\\n\U0001F4FA YouTube：教學/開箱影片\\n\U0001F4BC LinkedIn：專業內容分享\\n\\n需要我針對特定平台深入規劃嗎？'\n
    \       };\n\n        const generalResponses = [\n            '這是很好的行銷問題！讓我為您分析...\\n\\n\U0001F3AF
