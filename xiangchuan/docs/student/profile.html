<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>個人檔案 — 學生賺分平台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
  background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
  color: #e0e0e0;
  min-height: 100vh;
  padding-bottom: 80px;
}
.container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.header h1 { font-size: 1.1rem; font-weight: 700; color: #ccccee; display: flex; align-items: center; gap: 8px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.points-badge {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1a1a2e;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 4px;
}

.profile-header {
  text-align: center;
  padding: 28px 20px;
  margin: 20px 0;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
}
.avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  font-weight: 700;
  color: #1a1a2e;
  margin: 0 auto 12px;
}
.profile-header h2 { font-size: 1.3rem; font-weight: 700; }
.profile-header p { color: #8888aa; font-size: 0.85rem; margin-top: 4px; }

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}
.card-title { font-size: 0.85rem; font-weight: 600; color: #8888aa; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.info-row:last-child { border-bottom: none; }
.info-row .label { font-size: 0.85rem; color: #8888aa; }
.info-row .value { font-size: 0.9rem; font-weight: 500; text-align: right; }

.points-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.points-summary .ps-item {
  text-align: center;
  padding: 12px 8px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
}
.points-summary .ps-item .ps-value { font-size: 1.2rem; font-weight: 700; }
.points-summary .ps-item .ps-value.earned { color: #4ade80; }
.points-summary .ps-item .ps-value.spent { color: #f87171; }
.points-summary .ps-item .ps-value.balance { background: linear-gradient(135deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.points-summary .ps-item .ps-label { font-size: 0.7rem; color: #8888aa; margin-top: 2px; }

.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  text-align: center;
  display: block;
}
.btn-primary {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1a1a2e;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(247,151,30,0.3); }
.btn-danger {
  background: rgba(248,113,113,0.1);
  border: 1px solid rgba(248,113,113,0.2);
  color: #f87171;
}
.btn-danger:hover { background: rgba(248,113,113,0.2); }
.btn-secondary {
  background: rgba(255,255,255,0.06);
  color: #aaaacc;
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-secondary:hover { background: rgba(255,255,255,0.1); }

.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 400px;
  width: 100%;
}
.modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; text-align: center; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.85rem; color: #aaaacc; margin-bottom: 6px; font-weight: 500; }
.form-group input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: #e0e0e0;
  font-size: 0.95rem;
  outline: none;
}
.form-group input:focus { border-color: #f7971e; }

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(15,15,26,0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  justify-content: space-around;
  padding: 8px 0;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  z-index: 200;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 12px;
  text-decoration: none;
  color: #6666aa;
  font-size: 0.7rem;
  transition: all 0.3s;
  -webkit-tap-highlight-color: transparent;
}
.nav-item .nav-icon { font-size: 1.3rem; }
.nav-item.active { color: #f7971e; }
</style>
</head>
<body>
<div class="header">
  <h1>👤 個人檔案</h1>
  <div class="header-right">
    <div class="points-badge">⭐ <span id="headerPoints">0</span></div>
  </div>
</div>

<div class="container">
  <div class="profile-header">
    <div class="avatar" id="avatarInitials">學</div>
    <h2 id="profileName">載入中</h2>
    <p id="profileEmail">-</p>
  </div>

  <div class="card">
    <div class="card-title">📋 基本資料</div>
    <div class="info-row"><span class="label">姓名</span><span class="value" id="infoName">-</span></div>
    <div class="info-row"><span class="label">電子郵件</span><span class="value" id="infoEmail">-</span></div>
    <div class="info-row"><span class="label">年齡</span><span class="value" id="infoAge">-</span></div>
  </div>

  <div class="card">
    <div class="card-title">👨‍👩‍👧 家長資訊</div>
    <div class="info-row"><span class="label">家長姓名</span><span class="value" id="infoParentName">-</span></div>
    <div class="info-row"><span class="label">家長電子郵件</span><span class="value" id="infoParentEmail">-</span></div>
    <div class="info-row"><span class="label">同意狀態</span><span class="value" id="infoConsent">-</span></div>
  </div>

  <div class="card">
    <div class="card-title">⭐ 點數統計</div>
    <div class="points-summary">
      <div class="ps-item"><div class="ps-value balance" id="psBalance">0</div><div class="ps-label">可用</div></div>
      <div class="ps-item"><div class="ps-value earned" id="psEarned">0</div><div class="ps-label">總獲得</div></div>
      <div class="ps-item"><div class="ps-value spent" id="psSpent">0</div><div class="ps-label">總花費</div></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px">
    <button class="btn btn-secondary" onclick="openPasswordModal()">🔑 修改密碼</button>
    <button class="btn btn-danger" onclick="handleLogout()">🚪 登出</button>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>首頁</a>
  <a href="tasks.html" class="nav-item"><span class="nav-icon">✅</span>任務</a>
  <a href="rewards.html" class="nav-item"><span class="nav-icon">🎁</span>兌換</a>
  <a href="history.html" class="nav-item"><span class="nav-icon">📊</span>記錄</a>
  <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span>個人</a>
</nav>

<div class="modal-overlay" id="passwordModal">
  <div class="modal">
    <h2>🔑 修改密碼</h2>
    <form id="passwordForm" onsubmit="handlePasswordChange(event)">
      <div class="form-group">
        <label>目前密碼</label>
        <input type="password" id="currentPw" required>
      </div>
      <div class="form-group">
        <label>新密碼 (至少6碼)</label>
        <input type="password" id="newPw" required minlength="6">
      </div>
      <div class="form-group">
        <label>確認新密碼</label>
        <input type="password" id="confirmPw" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" id="pwBtn">確認修改</button>
      <button type="button" class="btn btn-secondary" onclick="closePasswordModal()" style="margin-top:8px">取消</button>
    </form>
  </div>
</div>

<script>
const API = '/api/student';

function getToken() { return localStorage.getItem('student_token'); }
function getUser() { try { return JSON.parse(localStorage.getItem('student_user')); } catch(e) { return null; } }

function authHeaders() {
  const t = getToken();
  if (!t) { window.location.href = 'index.html'; return {}; }
  return { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' };
}

function handleLogout() {
  if (confirm('確定要登出嗎？')) {
    localStorage.removeItem('student_token');
    localStorage.removeItem('student_user');
    window.location.href = 'index.html';
  }
}

function openPasswordModal() {
  document.getElementById('passwordModal').classList.add('open');
  document.getElementById('passwordForm').reset();
}

function closePasswordModal() {
  document.getElementById('passwordModal').classList.remove('open');
}

function showToast(msg, type = 'success') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  Object.assign(t.style, {
    position: 'fixed', top: '20px', left: '50%', transform: 'translateX(-50%)',
    padding: '12px 20px', borderRadius: '12px', fontSize: '0.85rem', fontWeight: '500',
    zIndex: '500', animation: 'toastIn 0.3s ease', maxWidth: '420px',
    width: 'calc(100% - 40px)', textAlign: 'center'
  });
  if (type === 'success') {
    t.style.background = 'rgba(74,222,128,0.15)';
    t.style.border = '1px solid rgba(74,222,128,0.3)';
    t.style.color = '#4ade80';
  } else {
    t.style.background = 'rgba(248,113,113,0.15)';
    t.style.border = '1px solid rgba(248,113,113,0.3)';
    t.style.color = '#f87171';
  }
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
}

async function handlePasswordChange(e) {
  e.preventDefault();
  const btn = document.getElementById('pwBtn');
  const current = document.getElementById('currentPw').value;
  const newPw = document.getElementById('newPw').value;
  const confirm = document.getElementById('confirmPw').value;
  if (!current) { showToast('請輸入目前密碼', 'error'); return; }
  if (newPw.length < 6) { showToast('新密碼至少6碼', 'error'); return; }
  if (newPw !== confirm) { showToast('兩次密碼不一致', 'error'); return; }
  btn.disabled = true;
  btn.textContent = '處理中...';
  try {
    const res = await fetch(`${API}/auth/change-password`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ current_password: current, new_password: newPw })
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || '修改失敗', 'error'); btn.disabled = false; btn.textContent = '確認修改'; return; }
    showToast('密碼修改成功！');
    closePasswordModal();
  } catch(e) {
    showToast('網路錯誤', 'error');
  }
  btn.disabled = false;
  btn.textContent = '確認修改';
}

async function loadProfile() {
  const user = getUser();
  if (user) {
    document.getElementById('profileName').textContent = user.name || '學生';
    document.getElementById('profileEmail').textContent = user.email || '';
    document.getElementById('infoName').textContent = user.name || '-';
    document.getElementById('infoEmail').textContent = user.email || '-';
    const initial = (user.name || '學').charAt(0);
    document.getElementById('avatarInitials').textContent = initial;
  }
  try {
    const [meRes, pointsRes] = await Promise.all([
      fetch(`${API}/auth/me`, { headers: authHeaders() }),
      fetch(`${API}/points`, { headers: authHeaders() })
    ]);
    if (meRes.status === 401 || pointsRes.status === 401) { handleLogout(); return; }
    const me = await meRes.json();
    const points = await pointsRes.json();
    const student = me.student || me;
    document.getElementById('profileName').textContent = student.name || '學生';
    document.getElementById('profileEmail').textContent = student.email || '';
    document.getElementById('infoName').textContent = student.name || '-';
    document.getElementById('infoEmail').textContent = student.email || '-';
    document.getElementById('infoAge').textContent = student.age || '-';
    document.getElementById('infoParentName').textContent = student.parent_name || '-';
    document.getElementById('infoParentEmail').textContent = student.parent_email || '-';
    const consentStatus = student.parent_consent ? '✅ 已同意' : '⏳ 待同意';
    document.getElementById('infoConsent').textContent = consentStatus;
    const initial = (student.name || '學').charAt(0);
    document.getElementById('avatarInitials').textContent = initial;
    document.getElementById('psBalance').textContent = points.balance || 0;
    document.getElementById('psEarned').textContent = points.total_earned || 0;
    document.getElementById('psSpent').textContent = points.total_spent || 0;
    document.getElementById('headerPoints').textContent = points.balance || 0;
    window.studentEmail = student.email;
  } catch(e) {
    console.error(e);
  }
}

(function init() {
  if (!getToken()) { window.location.href = 'index.html'; return; }
  loadProfile();
})();
</script>
</body>
</html>
