<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .game-wrapper {
    position: relative;
    width: 100%;
    max-width: 500px;
    aspect-ratio: 3 / 4;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    cursor: pointer;
    touch-action: none;
  }

  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    padding: 16px 0 24px;
    background: linear-gradient(transparent, rgba(0,0,0,0.3));
  }

  .footer a {
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 1px;
    transition: color 0.2s;
    padding: 8px 20px;
    display: inline-block;
  }

  .footer a:hover { color: rgba(255,255,255,0.95); }
  .footer a::before { content: "← "; }
</style>
</head>
<body>

<div class="game-wrapper">
  <canvas id="game"></canvas>
</div>

<div class="footer"><a href="../games/">返回遊戲大廳</a></div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const BASE_W = 360;
  const BASE_H = 480;
  let scale = 1;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = rect.width;
    const h = rect.height;
    canvas.width = BASE_W * dpr;
    canvas.height = BASE_H * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    scale = dpr;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }

  window.addEventListener('resize', resize);
  resize();

  const GROUND_H = 70;
  const PIPE_W = 48;
  const PIPE_GAP = 130;
  const PIPE_SPEED = 2;
  const GRAVITY = 0.45;
  const FLAP_VEL = -6.8;
  const BIRD_RADIUS = 14;
  const BIRD_X = 80;

  let state = 'ready';
  let score = 0;
  let bestScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
  let frame = 0;

  let bird = {};
  let pipes = [];
  let groundOffset = 0;

  let flapSound = null;
  let hitSound = null;
  let scoreSound = null;
  let audioCtx = null;

  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      flapSound = createTone(520, 0.08, 'sine', 0.3);
      hitSound = createTone(180, 0.2, 'sawtooth', 0.35);
      scoreSound = createTone(780, 0.1, 'sine', 0.3);
    } catch(e) {}
  }

  function createTone(freq, dur, type, vol) {
    return function() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    };
  }

  function reset() {
    bird = {
      x: BIRD_X,
      y: BASE_H / 2,
      vy: 0,
      rot: 0,
      flapFrame: 0
    };
    pipes = [];
    score = 0;
    groundOffset = 0;
    state = 'ready';
  }

  reset();

  function flap() {
    if (state === 'score') return;
    initAudio();
    if (flapSound) flapSound();
    if (state === 'ready') {
      state = 'play';
      bird.vy = FLAP_VEL;
    } else if (state === 'play') {
      bird.vy = FLAP_VEL;
    } else if (state === 'over') {
      restart();
    }
  }

  function restart() {
    reset();
    state = 'ready';
  }

  function addPipe() {
    const minTop = 50;
    const maxTop = BASE_H - GROUND_H - PIPE_GAP - 50;
    const topH = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
    const hue = 100 + Math.floor(Math.random() * 50);
    const sat = 55 + Math.floor(Math.random() * 30);
    const light = 35 + Math.floor(Math.random() * 20);
    const color = `hsl(${hue}, ${sat}%, ${light}%)`;
    const capColor = `hsl(${hue}, ${sat+5}%, ${light+12}%)`;
    pipes.push({
      x: BASE_W + 20,
      topH,
      scored: false,
      color,
      capColor
    });
  }

  function getPipeGapCenter(pipe) {
    return pipe.topH + PIPE_GAP / 2;
  }

  function collides(px, py, pr, pipe) {
    const gapBot = pipe.topH + PIPE_GAP;
    if (px + pr < pipe.x || px - pr > pipe.x + PIPE_W) return false;
    if (py - pr > pipe.topH && py + pr < gapBot) return false;
    return true;
  }

  function update() {
    frame++;

    if (state === 'play') {
      bird.vy += GRAVITY;
      bird.y += bird.vy;

      bird.rot = Math.min(Math.PI / 3, Math.max(-Math.PI / 4, bird.vy * 0.08));

      if (bird.vy < -1) bird.flapFrame = (bird.flapFrame + 1) % 10;
      else if (bird.flapFrame > 0) bird.flapFrame--;

      if (frame % 90 === 0) addPipe();

      for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= PIPE_SPEED;

        if (!pipes[i].scored && pipes[i].x + PIPE_W < bird.x) {
          pipes[i].scored = true;
          score++;
          if (scoreSound) scoreSound();
        }

        if (pipes[i].x + PIPE_W < -10) {
          pipes.splice(i, 1);
          continue;
        }

        if (collides(bird.x, bird.y, BIRD_RADIUS, pipes[i])) {
          gameOver();
          return;
        }
      }

      if (bird.y + BIRD_RADIUS >= BASE_H - GROUND_H) {
        bird.y = BASE_H - GROUND_H - BIRD_RADIUS;
        gameOver();
        return;
      }
      if (bird.y - BIRD_RADIUS <= 0) {
        bird.y = BIRD_RADIUS;
        bird.vy = 0;
      }

      groundOffset = (groundOffset + PIPE_SPEED) % 24;
    }
  }

  function gameOver() {
    if (state === 'over') return;
    state = 'over';
    if (hitSound) hitSound();
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('flappy_best', bestScore.toString());
    }
  }

  function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, BASE_H);
    grad.addColorStop(0, '#4dc9f6');
    grad.addColorStop(0.6, '#87d8f7');
    grad.addColorStop(1, '#b8e6f9');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, BASE_W, BASE_H);
  }

  function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    const clouds = [
      { x: 30, y: 50, w: 70, h: 26 },
      { x: 160, y: 30, w: 90, h: 30 },
      { x: 270, y: 70, w: 60, h: 22 },
    ];
    const off = frame * 0.15;
    for (const c of clouds) {
      const cx = ((c.x - off) % (BASE_W + 100) + BASE_W + 100) % (BASE_W + 100) - 50;
      drawCloud(cx, c.y, c.w, c.h);
    }
  }

  function drawCloud(x, y, w, h) {
    ctx.beginPath();
    ctx.ellipse(x, y, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
    ctx.ellipse(x - w * 0.25, y + h * 0.15, w * 0.35, h * 0.4, 0, 0, Math.PI * 2);
    ctx.ellipse(x + w * 0.25, y + h * 0.1, w * 0.3, h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGround() {
    const y = BASE_H - GROUND_H;
    ctx.fillStyle = '#8BC34A';
    ctx.fillRect(0, y, BASE_W, GROUND_H);

    ctx.fillStyle = '#7CB342';
    ctx.fillRect(0, y, BASE_W, 4);

    ctx.fillStyle = '#689F38';
    for (let i = -24; i < BASE_W + 24; i += 24) {
      const sx = i + groundOffset;
      ctx.fillRect(sx, y + 10, 12, 3);
      ctx.fillRect(sx + 6, y + 20, 12, 3);
      ctx.fillRect(sx + 12, y + 30, 12, 3);
    }

    ctx.fillStyle = '#5D4037';
    ctx.fillRect(0, y + GROUND_H - 8, BASE_W, 8);
    ctx.fillStyle = '#4E342E';
    ctx.fillRect(0, y + GROUND_H - 4, BASE_W, 4);
  }

  function drawBird(x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    const r = BIRD_RADIUS;

    ctx.shadowColor = 'rgba(0,0,0,0.15)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 2;

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = '#FFD54F';
    ctx.fill();
    ctx.strokeStyle = '#F9A825';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.beginPath();
    ctx.arc(0, 0, r - 3, 0, Math.PI * 2);
    ctx.fillStyle = '#FFE082';
    ctx.fill();

    const wingY = state === 'play' ? Math.sin(frame * 0.3) * 3 - 2 : -2;
    ctx.beginPath();
    ctx.ellipse(-4, wingY, 7, 5, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#FFC107';
    ctx.fill();
    ctx.strokeStyle = '#F9A825';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(5, -3, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6.5, -4.5, 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#E65100';
    ctx.beginPath();
    ctx.moveTo(r + 2, 2);
    ctx.lineTo(r + 8, 3);
    ctx.lineTo(r + 2, 5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawPipe(pipe) {
    const { x, topH, color, capColor } = pipe;
    const gapBot = topH + PIPE_GAP;

    ctx.shadowColor = 'rgba(0,0,0,0.2)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 3;

    ctx.fillStyle = color;
    ctx.fillRect(x, 0, PIPE_W, topH);
    ctx.fillRect(x, gapBot, PIPE_W, BASE_H - GROUND_H - gapBot);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    ctx.fillStyle = capColor;
    ctx.fillRect(x - 4, topH - 20, PIPE_W + 8, 20);
    ctx.fillRect(x - 4, gapBot, PIPE_W + 8, 20);

    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - 4, topH - 20, PIPE_W + 8, 20);
    ctx.strokeRect(x - 4, gapBot, PIPE_W + 8, 20);

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(x + 6, 0, 8, topH);
    ctx.fillRect(x + 6, gapBot, 8, BASE_H - GROUND_H - gapBot);
  }

  function drawScore() {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2;

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(score, BASE_W / 2, 24);

    ctx.restore();
  }

  function drawReady() {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Flappy Bird', BASE_W / 2, BASE_H * 0.28);

    ctx.font = '20px "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText('點擊或按空白鍵開始', BASE_W / 2, BASE_H * 0.38);

    ctx.restore();

    const pulse = Math.sin(frame * 0.05) * 4;
    drawBird(BIRD_X, BASE_H * 0.52 + pulse, 0);
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, BASE_W, BASE_H);

    const cx = BASE_W / 2;
    const cy = BASE_H / 2;

    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 4;

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 42px "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('遊戲結束', cx, cy - 70);

    ctx.font = '22px "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillStyle = '#FFD54F';
    ctx.fillText(`得分：${score}`, cx, cy - 16);

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '18px "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText(`最高分數：${bestScore}`, cx, cy + 30);

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '16px "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif';
    const blink = Math.sin(frame * 0.06) > -0.3;
    if (blink) ctx.fillText('點擊或按空白鍵重新開始', cx, cy + 82);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
  }

  function draw() {
    ctx.clearRect(0, 0, BASE_W, BASE_H);

    drawBackground();
    drawClouds();

    for (const pipe of pipes) drawPipe(pipe);

    if (state === 'play' || state === 'over') {
      drawBird(bird.x, bird.y, bird.rot);
    }

    drawGround();

    if (state === 'ready') drawReady();
    if (state === 'play' || state === 'ready') drawScore();
    if (state === 'over') {
      drawScore();
      drawOver();
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();

  function handleInput(e) {
    if (e) e.preventDefault();
    flap();
  }

  canvas.addEventListener('mousedown', handleInput);
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    flap();
  }, { passive: false });

  document.addEventListener('keydown', function(e) {
    if (e.key === ' ' || e.key === 'ArrowUp') {
      e.preventDefault();
      handleInput(e);
    }
  });
})();
</script>
</body>
</html>
