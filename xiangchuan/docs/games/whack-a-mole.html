<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打地鼠 — 挑戰你的朋友！</title>
<meta name="description" content="經典打地鼠遊戲！30 秒內打到最多地鼠，挑戰最高分！">
<meta property="og:title" content="🔨 打地鼠 — 來挑戰我的分數！">
<meta property="og:description" content="30 秒打地鼠，看看你能打幾隻！">
<meta property="og:image" content="https://lewislunora.github.io/lewislunora/assets/og-game.png">
<meta property="og:type" content="website">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e27;color:#e8ecf4;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:manipulation;user-select:none}
.wrap{display:flex;flex-direction:column;align-items:center;padding:16px;max-width:450px;width:100%;margin-top:env(safe-area-inset-top)}
.header{display:flex;justify-content:space-between;align-items:center;width:100%;padding:4px 0;margin-bottom:8px}
h1{font-size:clamp(20px,5vw,28px);font-weight:800;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:flex;gap:10px;font-size:13px}
.stats span{background:rgba(255,255,255,.05);padding:4px 12px;border-radius:8px;color:rgba(255,255,255,.4)}
.stats strong{color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:360px;margin:8px 0}
.hole{position:relative;aspect-ratio:1;background:rgba(255,255,255,.04);border-radius:50%;border:2px solid rgba(255,255,255,.06);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,8vw,44px);transition:all .1s;overflow:hidden;touch-action:manipulation}
.hole.active{background:rgba(255,255,255,.08);border-color:rgba(245,158,11,.3);cursor:pointer}
.hole.active:active{transform:scale(.85)}
.hole .mole{display:none;font-size:clamp(32px,9vw,48px);animation:pop .2s ease-out}
.hole.active .mole{display:block}
.mole-hit{background:rgba(239,68,68,.2)!important;border-color:#ef4444!important}
@keyframes pop{0%{transform:translateY(20px) scale(.5);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
.timer-bar{width:100%;max-width:360px;height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin-bottom:8px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:2px;transition:width 1s linear;width:100%}
#overlay{display:none;position:fixed;inset:0;background:rgba(10,14,39,.85);backdrop-filter:blur(8px);flex-direction:column;align-items:center;justify-content:center;z-index:10;gap:12px}
#overlay.show{display:flex}
#overlay h2{font-size:clamp(22px,5vw,30px)}
#overlay p{font-size:14px;color:rgba(255,255,255,.5)}
#overlay .btns{display:flex;gap:8px;margin-top:4px}
.btn{padding:10px 24px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#00d4ff,#7b68ee);color:#fff}
.btn-share{padding:10px 20px;border-radius:10px;border:1px solid rgba(0,212,255,.2);background:rgba(0,212,255,.12);color:#00d4ff;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-share:hover{background:rgba(0,212,255,.2)}
.back-link{margin-top:12px;font-size:13px;color:rgba(255,255,255,.25);text-decoration:none}
.back-link:hover{color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🔨 打地鼠</h1>
    <div class="stats" id="stats1p">
      <span>🎯 <strong id="score">0</strong></span>
      <span>⏱ <strong id="timer">30</strong>s</span>
    </div>
    <div class="stats" id="stats2p" style="display:none">
      <span style="color:#00d4ff">🔵 P1 <strong id="p1score">0</strong></span>
      <span style="color:rgba(255,255,255,.15)">|</span>
      <span style="color:#ef4444">🔴 P2 <strong id="p2score">0</strong></span>
      <span>⏱ <strong id="timer2">30</strong>s</span>
    </div>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:6px">
    <button id="wmMode1p" style="padding:4px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(135deg,#00d4ff,#7b68ee);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">👤 單人</button>
    <button id="wmMode2p" style="padding:4px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;font-family:inherit">👥 雙人</button>
  </div>
  <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
  <div class="grid" id="grid"></div>
  <a href="../games/" class="back-link">← 返回遊戲大廳</a>
</div>
<div id="overlay">
  <h2 id="oTitle">⏰ 時間到！</h2>
  <p id="oMsg">你打了 0 隻地鼠</p>
  <div class="btns">
    <button class="btn btn-primary" onclick="startGame()">🔄 再玩一次</button>
    <button class="btn-share" onclick="shareScore()">📤 分享分數</button>
  </div>
</div>
<script>
const DURATION=30;let mode='1p',score=0,p1score=0,p2score=0,timeLeft=DURATION,running=false,spawnInt,timerInt,highScore=0;
const grid=document.getElementById('grid');
const scoreEl=document.getElementById('score');
const p1El=document.getElementById('p1score'),p2El=document.getElementById('p2score');
const timerEl=document.getElementById('timer'),timer2El=document.getElementById('timer2');
const timerFill=document.getElementById('timerFill');
const overlay=document.getElementById('overlay');
const oTitle=document.getElementById('oTitle'),oMsg=document.getElementById('oMsg');
const s1p=document.getElementById('stats1p'),s2p=document.getElementById('stats2p');
highScore=parseInt(localStorage.getItem('whackHigh')||'0');

for(let i=0;i<9;i++){
  const hole=document.createElement('div');
  hole.className='hole';hole.dataset.i=i;
  hole.innerHTML='<span class="mole">🐹</span>';
  hole.addEventListener('click',(e)=>{if(mode==='2p')whack2p(e,i);else whack(i);});
  hole.addEventListener('touchstart',(e)=>{e.preventDefault();if(mode==='2p')whack2p(e,i);else whack(i);},{passive:false});
  grid.appendChild(hole);
}

function setMode(m){
  mode=m;
  document.getElementById('wmMode1p').style.background=m==='1p'?'linear-gradient(135deg,#00d4ff,#7b68ee)':'rgba(255,255,255,.05)';
  document.getElementById('wmMode1p').style.color=m==='1p'?'#fff':'rgba(255,255,255,.4)';
  document.getElementById('wmMode1p').style.fontWeight=m==='1p'?'600':'400';
  document.getElementById('wmMode2p').style.background=m==='2p'?'linear-gradient(135deg,#00d4ff,#7b68ee)':'rgba(255,255,255,.05)';
  document.getElementById('wmMode2p').style.color=m==='2p'?'#fff':'rgba(255,255,255,.4)';
  document.getElementById('wmMode2p').style.fontWeight=m==='2p'?'600':'400';
  s1p.style.display=m==='1p'?'flex':'none';
  s2p.style.display=m==='2p'?'flex':'none';
  startGame();
}

function startGame(){
  score=0;p1score=0;p2score=0;timeLeft=DURATION;running=true;
  scoreEl.textContent='0';p1El.textContent='0';p2El.textContent='0';
  timerEl.textContent=DURATION;timer2El.textContent=DURATION;
  timerFill.style.width='100%';
  overlay.classList.remove('show');overlay.style.display='none';
  document.querySelectorAll('.hole').forEach(h=>{h.classList.remove('active','mole-hit')});
  clearInterval(spawnInt);clearInterval(timerInt);
  spawnInt=setInterval(spawnMole,800);
  timerInt=setInterval(()=>{
    timeLeft--;timerEl.textContent=timeLeft;timer2El.textContent=timeLeft;
    timerFill.style.width=(timeLeft/DURATION*100)+'%';
    if(timeLeft<=0)endGame();
  },1000);
  setTimeout(spawnMole,200);
}
function spawnMole(){
  if(!running)return;
  const holes=document.querySelectorAll('.hole');
  const inactive=[...holes].filter(h=>!h.classList.contains('active'));
  if(inactive.length<2)return;
  const count=Math.min(2,Math.floor(inactive.length/3));
  for(let i=0;i<count;i++){
    const idx=Math.floor(Math.random()*inactive.length);
    inactive[idx].classList.add('active');
    setTimeout(()=>{if(running)inactive[idx].classList.remove('active')},1000+Math.random()*500);
    inactive.splice(idx,1);
  }
}
function whack(i){
  if(!running)return;
  const hole=document.querySelectorAll('.hole')[i];
  if(!hole.classList.contains('active'))return;
  score++;scoreEl.textContent=score;
  hole.classList.remove('active');
  hole.classList.add('mole-hit');
  setTimeout(()=>hole.classList.remove('mole-hit'),200);
}
function whack2p(e,i){
  if(!running)return;
  const hole=document.querySelectorAll('.hole')[i];
  if(!hole.classList.contains('active'))return;
  const rect=grid.getBoundingClientRect();
  const x=(e.clientX||e.changedTouches&&e.changedTouches[0].clientX)-rect.left;
  if(x<rect.width/2){p1score++;p1El.textContent=p1score}
  else{p2score++;p2El.textContent=p2score}
  hole.classList.remove('active');
  hole.classList.add('mole-hit');
  setTimeout(()=>hole.classList.remove('mole-hit'),200);
}
function endGame(){
  running=false;
  clearInterval(spawnInt);clearInterval(timerInt);
  if(mode==='2p'){
    const w=p1score>p2score?'🔵 P1 獲勝！':p2score>p1score?'🔴 P2 獲勝！':'🤝 平手！';
    oTitle.textContent='⏰ 時間到！';
    oMsg.textContent=`${w}  P1 ${p1score} : ${p2score} P2`;
  }else{
    if(score>highScore){highScore=score;localStorage.setItem('whackHigh',highScore.toString())}
    oTitle.textContent='⏰ 時間到！';
    oMsg.textContent=`你打了 ${score} 隻地鼠${score>=highScore?' 🎉 新紀錄！':''}`;
  }
  overlay.style.display='flex';overlay.classList.add('show');
}
window.shareScore=function(){
  const msg=mode==='2p'?`🔨 打地鼠 2P 對戰 ${p1score}:${p2score}！${p1score>p2score?'P1':'P2'} 獲勝！`:`🔨 打地鼠 30 秒打了 ${score} 隻${score>=20?' 我是快手王！':'！你能比我多嗎？'}`;
  if(navigator.share)navigator.share({title:'打地鼠挑戰',text:msg,url:location.href});
  else shareToLine(location.href);
}
document.getElementById('wmMode1p').onclick=()=>setMode('1p');
document.getElementById('wmMode2p').onclick=()=>setMode('2p');
startGame();
</script>
<script src="../share.js"></script>
</body>
</html>
