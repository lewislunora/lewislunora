<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>行事曆 — 翔川 Neo</title>
<meta name="description" content="活動、面試、截止日、工作排程行事曆">
<link rel="stylesheet" href="css/main.css?v=20261005">
<style>
.hero-mini{padding:clamp(3.5rem,6vw,4.5rem) 1rem 1rem;text-align:center}
.hero-mini h1{font-size:clamp(30px,5vw,48px);margin-bottom:.5rem;background:linear-gradient(135deg,#e8ecf4 0%,rgba(232,236,244,.5) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-mini p{opacity:.65;max-width:640px;margin:0 auto 1rem}
.cal-wrap{max-width:min(760px,94vw);margin:0 auto 2rem;border:1px solid var(--nav-line);border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03))}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:.6rem .85rem;border-bottom:1px solid rgba(255,255,255,.08)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:rgba(255,255,255,.05)}
.cal-dow{padding:.35rem .4rem;text-align:center;font-size:11px;opacity:.65;background:rgba(255,255,255,.05)}
.cal-cell{min-height:70px;padding:.25rem .35rem;background:rgba(0,0,0,.15);font-size:12px;display:flex;flex-direction:column;gap:.15rem}
.cal-cell.today{outline:1px solid rgba(0,212,255,.45)}
.cal-cell .d{opacity:.65}
.ev{padding:.1rem .25rem;border-radius:6px;background:rgba(0,212,255,.22);border:1px solid rgba(0,212,255,.4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.hire{background:rgba(123,104,238,.22);border-color:rgba(123,104,238,.4)}
.ev.task{background:rgba(16,185,129,.22);border-color:rgba(16,185,129,.4)}
.footer{padding:1rem;text-align:center;opacity:.45;font-size:12px}
</style>
</head>
<body>
<div class="bg"></div>
<header class="nav" id="nav"></header>
<section class="hero-mini">
  <h1>行事曆</h1>
  <p>活動、面試、截止日、任務到期，一目了然。</p>
  <a class="btn-pri" href="/community/">＋ 新增事件</a>
</section>
<div class="cal-wrap">
  <div class="cal-head">
    <button class="btn-sm" id="prev">← 上月</button>
    <div id="title">2026 年 10 月</div>
    <button class="btn-sm" id="next">下月 →</button>
  </div>
  <div class="cal-grid" id="dow"></div>
  <div class="cal-grid" id="grid"></div>
</div>
<div class="footer">翔川 Neo — 把煩人的事，用最簡單的方式做掉</div>
<script>
const dow=['日','一','二','三','四','五','六'];
document.getElementById('dow').innerHTML=dow.map(d=>`<div class="cal-dow">${d}</div>`).join('');
const now=new Date(), y=now.getFullYear(), m=now.getMonth();
function pad(n){return String(n).padStart(2,'0')}
let cy=y, cm=m;
const evs={
  '2026-10-09':[{t:'任務截止：文章潤稿',c:'task'}],
  '2026-10-12':[{t:'面試：遠端前端',c:'hire'}],
  '2026-10-15':[{t:'任務截止：自動化腳本',c:'task'}],
  '2026-10-20':[{t:'招募截止：AI 外包',c:'hire'}],
};
function render(){
  const title=document.getElementById('title'); title.textContent=`${cy} 年 ${cm+1} 月`;
  const first=new Date(cy,cm,1), last=new Date(cy,cm+1,0), start=first.getDay(), days=last.getDate();
  const grid=document.getElementById('grid'); let h='';
  for(let i=0;i<42;i++){
    const d=i-start+1; const inM=d>=1&&d<=days;
    const dt=`${cy}-${pad(cm+1)}-${pad(d)}`; const list=(inM&&evs[dt])||[];
    const today=new Date().toDateString()===new Date(cy,cm,d).toDateString();
    h+=`<div class="cal-cell ${today?'today':''}">${inM?`<div class="d">${d}</div>`:''}${list.map(e=>`<div class="ev ${e.c}">${e.t}</div>`).join('')}</div>`;
  }
  grid.innerHTML=h;
}
document.getElementById('prev').onclick=()=>{cm--; if(cm<0){cm=11;cy--;}render();}
document.getElementById('next').onclick=()=>{cm++; if(cm>11){cm=0;cy++;}render();}
render();
</script>
</body>
</html>
