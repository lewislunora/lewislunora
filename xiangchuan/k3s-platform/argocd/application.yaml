apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xiangchuan-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.slack: ""
spec:
  project: xiangchuan
  source:
    repoURL: https://github.com/lewislunora/lewislunora.git
    targetRevision: main
    path: xiangchuan/k3s-platform/k8s-manifests
  destination:
    name: in-cluster
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
