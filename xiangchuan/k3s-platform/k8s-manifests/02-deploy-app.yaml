apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-app
  namespace: platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: platform-app
  template:
    metadata:
      labels:
        app: platform-app
    spec:
      containers:
        - name: app
          image: platform-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8742"
            - name: RENDER
              value: "1"
          envFrom:
            - secretRef:
                name: platform-env
                optional: true
          ports:
            - containerPort: 8742
          volumeMounts:
            - name: data
              mountPath: /app/marketing_system/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8742
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8742
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-data