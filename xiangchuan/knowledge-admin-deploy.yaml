apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-admin
  labels:
    app: knowledge-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge-admin
  template:
    metadata:
      labels:
        app: knowledge-admin
    spec:
      containers:
      - name: knowledge-admin
        image: knowledge-admin:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5001
        volumeMounts:
        - name: knowledge-volume
          mountPath: /data
      volumes:
      - name: knowledge-volume
        hostPath:
          path: /tmp/knowledge
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-admin-svc
spec:
  selector:
    app: knowledge-admin
  ports:
  - port: 5001
    targetPort: 5001
  type: ClusterIP
