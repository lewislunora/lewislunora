<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 客服 Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f0f2f5;
        }
        .header {
            background: #165dff;
            color: white;
            padding: 1rem;
            text-align: center;
            font-size: 1.2rem;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            line-height: 1.5;
            word-break: break-word;
        }
        .user-msg {
            align-self: flex-end;
            background: #165dff;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai-msg {
            align-self: flex-start;
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .input-area {
            display: flex;
            padding: 1rem;
            background: white;
            border-top: 1px solid #e0e0e0;
            gap: 0.5rem;
        }
        .input-area input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .input-area button {
            background: #165dff;
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        .input-area button:hover {
            background: #0e4fdd;
        }
        .typing {
            align-self: flex-start;
            background: white;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">AI 客服 Demo</div>
    <div class="chat-container" id="chatContainer">
        <div class="message ai-msg">您好！我是AI客服小助手，请问有什么可以帮您？</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="输入您的问题..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">发送</button>
    </div>

    <script>
        const aiReplies = [
            "您好！我已收到您的问题，正在为您查询相关信息。",
            "关于这个问题，您可以参考我们的帮助文档：https://help.example.com",
            "感谢您的咨询，如有其他问题请随时告诉我。",
            "目前我正在学习更多知识，暂时无法回答这个问题哦。",
            "这个问题涉及账号安全，建议您联系人工客服处理。",
            "您的问题已记录，我们会尽快为您反馈结果。"
        ];

        function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            // 添加用户消息
            addMessage(msg, 'user');
            input.value = '';

            // 显示输入中状态
            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.id = 'typing';
            typing.textContent = 'AI 正在输入...';
            document.getElementById('chatContainer').appendChild(typing);
            scrollToBottom();

            // 模拟AI回复
            setTimeout(() => {
                document.getElementById('typing').remove();
                const reply = aiReplies[Math.floor(Math.random() * aiReplies.length)];
                addMessage(reply, 'ai');
            }, 1000 + Math.random() * 1000);
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}-msg`;
            div.textContent = text;
            document.getElementById('chatContainer').appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
