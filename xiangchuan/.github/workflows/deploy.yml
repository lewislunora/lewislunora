name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xiangchuan/brand_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --base-href=/lewislunora/
      - run: flutter build apk --debug
