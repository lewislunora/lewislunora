image: python:3.12-slim

stages:
  - lint
  - format
  - test
  - build

cache:
  paths:
    - .cache/pip
    - .venv/

before_script:
  - python -m venv .venv
  - source .venv/bin/activate
  - pip install --upgrade pip
  - pip install flake8 black isort ruff pytest
  - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
  - if [ -f marketing_system/requirements.txt ]; then pip install -r marketing_system/requirements.txt; fi

lint-flake8:
  stage: lint
  script:
    - source .venv/bin/activate
    - flake8 . --count --statistics --show-source

lint-ruff:
  stage: lint
  script:
    - source .venv/bin/activate
    - ruff check .

check-format-black:
  stage: format
  script:
    - source .venv/bin/activate
    - black --check --diff .

check-format-isort:
  stage: format
  script:
    - source .venv/bin/activate
    - isort --check-only --diff .

test-pytest:
  stage: test
  script:
    - source .venv/bin/activate
    - pytest marketing_system/tests/ -v --tb=short
  artifacts:
    when: always
    reports:
      junit: report.xml

build-image:
  stage: build
  image: docker:27-dind
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE/platform-app:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - k3s-platform/**/*
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY || true
    - docker build -f k3s-platform/remote/Dockerfile -t "$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/platform-app:latest" .
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push "$IMAGE_TAG"
        docker push "$CI_REGISTRY_IMAGE/platform-app:latest"
      fi
  allow_failure: true
