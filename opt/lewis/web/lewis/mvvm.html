<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翔川 Lewis AI - MVVM 創業平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* CSS Variables */
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #00ff88;
            --success: #22c55e;
            --danger: #ef4444;
            --dark: #0f0f1a;
            --dark2: #1a1a2e;
            --light: #f8f9fa;
            --text: #333;
            --text-light: #aaa;
            --white: #fff;
        }
        
        /* Base Styles */
        body { 
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%); 
            color: var(--white); 
            min-height: 100vh;
            line-height: 1.6;
        }
        
        /* Container */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Header */
        .header {
            background: rgba(255,255,255,0.05);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo { font-size: 24px; font-weight: bold; }
        .logo span { color: var(--accent); }
        
        .nav { display: flex; gap: 20px; }
        .nav a { color: var(--white); text-decoration: none; opacity: 0.8; transition: 0.3s; }
        .nav a:hover { opacity: 1; color: var(--accent); }
        
        /* Hero Section */
        .hero {
            padding: 80px 0;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .hero p { font-size: 20px; color: var(--text-light); max-width: 600px; margin: 0 auto 30px; }
        
        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        
        /* Card */
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }
        
        .card-icon { font-size: 40px; margin-bottom: 15px; }
        .card h3 { color: var(--accent); margin-bottom: 10px; }
        .card p { color: var(--text-light); font-size: 14px; }
        
        /* Button */
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn-primary { background: var(--accent); color: var(--dark); }
        .btn-primary:hover { transform: scale(1.05); }
        
        .btn-outline { background: transparent; border: 2px solid var(--white); color: var(--white); }
        .btn-outline:hover { background: var(--white); color: var(--dark); }
        
        /* Form */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: var(--white);
            font-size: 16px;
        }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: var(--dark2);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
        }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-close { background: none; border: none; color: var(--white); font-size: 30px; cursor: pointer; }
        
        /* Services List */
        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .service-name { font-weight: bold; }
        .service-price { color: var(--accent); font-size: 18px; }
        
        /* Stats */
        .stats { display: flex; gap: 30px; justify-content: center; margin: 30px 0; }
        .stat { text-align: center; }
        .stat-value { font-size: 36px; color: var(--accent); font-weight: bold; }
        .stat-label { color: var(--text-light); }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: var(--white);
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            z-index: 2000;
        }
        
        .toast.show { display: block; animation: slideIn 0.3s ease; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Loader */
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .grid { grid-template-columns: 1fr; }
            .nav { display: none; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">🚀 翔川 <span>Lewis</span> AI</div>
                <nav class="nav">
                    <a href="#services">服務</a>
                    <a href="#about">關於</a>
                    <a href="#contact">聯絡</a>
                    <a href="#" onclick="app.showModal('login')">登入</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="container">
            <h1>🤖 AI × 命理 × 科技</h1>
            <p>結合傳統智慧與現代 AI 技術，提供最專業的命理分析與科技服務。10+ 年資訊科技經驗，幫助你開創事業新局。</p>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="btn btn-primary" onclick="app.showModal('register')">立即開始</button>
                <button class="btn btn-outline" onclick="app.scrollTo('services')">查看服務</button>
            </div>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-value">{{ stats.users }}</div>
                    <div class="stat-label">用戶數</div>
                </div>
                <div class="stat">
                    <div class="stat-value">${{ stats.revenue }}</div>
                    <div class="stat-label">營收</div>
                </div>
                <div class="stat">
                    <div class="stat-value">{{ stats.orders }}</div>
                    <div class="stat-label">訂單</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Services -->
    <section id="services">
        <div class="container">
            <h2 style="text-align: center; margin: 40px 0;">💼 服務項目</h2>
            <div class="grid" id="servicesList">
                <!-- 服務項目會由 ViewModel 渲染 -->
            </div>
        </div>
    </section>

    <!-- Contact -->
    <section id="contact" style="padding: 60px 0;">
        <div class="container">
            <h2 style="text-align: center; margin: 40px 0;">📩 預約諮詢</h2>
            <div class="form-group">
                <label>選擇服務</label>
                <select id="contactService">
                    <option value="">請選擇服務</option>
                </select>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="contactName" placeholder="請輸入姓名">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="contactEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>備註</label>
                <textarea id="contactMessage" rows="4" placeholder="請描述您的需求..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="app.submitContact()" style="width: 100%;">🚀 送出預約</button>
        </div>
    </section>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>登入</h2>
                <button class="modal-close" onclick="app.closeModal('login')">&times;</button>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>密碼</label>
                <input type="password" id="loginPassword" placeholder="密碼">
            </div>
            <button class="btn btn-primary" onclick="app.login()" style="width: 100%;">登入</button>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>註冊</h2>
                <button class="modal-close" onclick="app.closeModal('register')">&times;</button>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="registerName" placeholder="請輸入姓名">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>密碼</label>
                <input type="password" id="registerPassword" placeholder="密碼">
            </div>
            <button class="btn btn-primary" onclick="app.register()" style="width: 100%;">註冊</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- JavaScript MVVM -->
    <script>
        // ====================
        // MODEL (數據層)
        // ====================
        const Model = {
            // 服務項目數據
            services: [
                { id: 1, name: '八字命理分析', price: 3000, icon: '🪐', desc: '完整命盤分析，八字五行解讀' },
                { id: 2, name: '五行平衡諮詢', price: 2500, icon: '🌿', desc: '五行屬性建議，調整運勢' },
                { id: 3, name: '寶寶命名服務', price: 5000, icon: '✍️', desc: '命理取名，音義兼備' },
                { id: 4, name: '星座運勢分析', price: 1000, icon: '⭐', desc: '月度星座運程解讀' },
                { id: 5, name: '創業方向諮詢', price: 5000, icon: '🚀', desc: '創業方向建議與規劃' },
                { id: 6, name: 'AI Telegram Bot', price: 15000, icon: '🤖', desc: '客製化 AI 機器人開發' },
                { id: 7, name: 'DevOps 顧問', price: 20000, icon: '☁️', desc: 'K8s 架構、雲端遷移' },
                { id: 8, name: '技術諮詢', price: 2000, icon: '💻', desc: '單次技術問題解答' }
            ],
            
            // 用戶數據
            users: [],
            
            // 預約數據
            bookings: [],
            
            // 統計數據
            stats: {
                users: 156,
                revenue: '45,000',
                orders: 23
            }
        };

        // ====================
        // VIEWMODEL (業務邏輯)
        // ====================
        const ViewModel = {
            // 格式化價格
            formatPrice(price) {
                return '$' + price.toLocaleString();
            },
            
            // 取得服務列表
            getServices() {
                return Model.services;
            },
            
            // 新增預約
            addBooking(data) {
                const booking = {
                    id: Date.now(),
                    ...data,
                    date: new Date().toISOString(),
                    status: 'pending'
                };
                Model.bookings.push(booking);
                return booking;
            },
            
            // 用戶註冊
            registerUser(data) {
                const user = {
                    id: Date.now(),
                    ...data,
                    date: new Date().toISOString()
                };
                Model.users.push(user);
                return user;
            },
            
            // 用戶登入
            loginUser(email, password) {
                const user = Model.users.find(u => u.email === email);
                if (user && user.password === password) {
                    return user;
                }
                return null;
            },
            
            // 更新統計
            updateStats() {
                Model.stats.users = Model.users.length + 156;
                Model.stats.orders = Model.bookings.length + 23;
            }
        };

        // ====================
        // VIEW (視圖渲染)
        // ====================
        const View = {
            // 渲染服務列表
            renderServices() {
                const container = document.getElementById('servicesList');
                if (!container) return;
                
                const services = ViewModel.getServices();
                container.innerHTML = services.map(service => `
                    <div class="card">
                        <div class="card-icon">${service.icon}</div>
                        <h3>${service.name}</h3>
                        <p>${service.desc}</p>
                        <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                            <span class="service-price">${ViewModel.formatPrice(service.price)}</span>
                            <button class="btn btn-primary" onclick="app.bookService(${service.id})">預約</button>
                        </div>
                    </div>
                `).join('');
                
                // 更新下拉選單
                const select = document.getElementById('contactService');
                if (select) {
                    select.innerHTML = '<option value="">請選擇服務</option>' + 
                        services.map(s => `<option value="${s.id}">${s.name} - ${ViewModel.formatPrice(s.price)}</option>`).join('');
                }
            },
            
            // 渲染統計
            renderStats() {
                // 使用 Vue 風格的綁定
                document.querySelectorAll('.stat-value').forEach((el, index) => {
                    const keys = ['users', 'revenue', 'orders'];
                    const key = keys[index];
                    if (key === 'users') {
                        el.textContent = Model.stats.users;
                    } else if (key === 'revenue') {
                        el.textContent = '$' + Model.stats.revenue;
                    } else if (key === 'orders') {
                        el.textContent = Model.stats.orders;
                    }
                });
            }
        };

        // ====================
        // APP (控制器)
        // ====================
        const app = {
            // 初始化
            init() {
                View.renderServices();
                View.renderStats();
                console.log('🚀 MVVM App 初始化完成');
            },
            
            // 顯示 Modal
            showModal(type) {
                const modal = document.getElementById(type + 'Modal');
                if (modal) {
                    modal.classList.add('active');
                }
            },
            
            // 關閉 Modal
            closeModal(type) {
                const modal = document.getElementById(type + 'Modal');
                if (modal) {
                    modal.classList.remove('active');
                }
            },
            
            // 滾動到目標
            scrollTo(target) {
                const el = document.getElementById(target);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth' });
                }
            },
            
            // 登入
            login() {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                if (!email || !password) {
                    this.showToast('請輸入 Email 和密碼', 'error');
                    return;
                }
                
                const user = ViewModel.loginUser(email, password);
                if (user) {
                    this.showToast('登入成功！歡迎回來 ' + user.name);
                    this.closeModal('login');
                } else {
                    this.showToast('登入失敗，請檢查帳號密碼', 'error');
                }
            },
            
            // 註冊
            register() {
                const name = document.getElementById('registerName').value;
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;
                
                if (!name || !email || !password) {
                    this.showToast('請填寫完整資料', 'error');
                    return;
                }
                
                const user = ViewModel.registerUser({ name, email, password, password });
                this.showToast('註冊成功！歡迎 ' + user.name);
                this.closeModal('register');
            },
            
            // 預約服務
            bookService(serviceId) {
                const service = Model.services.find(s => s.id === serviceId);
                if (service) {
                    document.getElementById('contactService').value = serviceId;
                    this.scrollTo('contact');
                }
            },
            
            // 提交預約
            submitContact() {
                const serviceId = document.getElementById('contactService').value;
                const name = document.getElementById('contactName').value;
                const email = document.getElementById('contactEmail').value;
                const message = document.getElementById('contactMessage').value;
                
                if (!serviceId || !name || !email) {
                    this.showToast('請填寫必填欄位', 'error');
                    return;
                }
                
                const booking = ViewModel.addBooking({
                    serviceId: parseInt(serviceId),
                    serviceName: Model.services.find(s => s.id === parseInt(serviceId)).name,
                    name, email, message
                });
                
                ViewModel.updateStats();
                View.renderStats();
                
                this.showToast('預約成功！我們會盡快聯繫您');
                this.clearForm();
            },
            
            // 清除表單
            clearForm() {
                document.getElementById('contactService').value = '';
                document.getElementById('contactName').value = '';
                document.getElementById('contactEmail').value = '';
                document.getElementById('contactMessage').value = '';
            },
            
            // 顯示提示
            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                if (toast) {
                    toast.textContent = message;
                    toast.style.background = type === 'error' ? '#ef4444' : '#22c55e';
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 3000);
                }
            }
        };

        // 啟動 App
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
