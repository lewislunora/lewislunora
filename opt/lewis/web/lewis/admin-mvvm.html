<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翔川 Lewis AI - MVVM 創業平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #00ff88;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f0f1a;
            --dark2: #1a1a2e;
            --light: #f8f9fa;
            --text: #fff;
            --text-muted: #9ca3af;
        }
        body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(135deg, var(--dark), var(--dark2)); color: var(--text); min-height: 100vh; }
        
        /* Layout */
        .app { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--dark2); padding: 20px; position: fixed; height: 100vh; overflow-y: auto; }
        .main { flex: 1; margin-left: 250px; padding: 20px; }
        
        /* Sidebar */
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 30px; padding: 10px; }
        .logo span { color: var(--accent); }
        .nav-item { padding: 12px 15px; margin: 5px 0; border-radius: 8px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover, .nav-item.active { background: var(--accent); color: var(--dark); }
        .nav-icon { font-size: 20px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--dark2); border-radius: 12px; margin-bottom: 20px; }
        .header-title { font-size: 24px; font-weight: bold; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 40px; height: 40px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--dark); }
        
        /* Cards */
        .card { background: var(--dark2); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-size: 18px; font-weight: bold; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--dark2); border-radius: 12px; padding: 20px; text-align: center; }
        .stat-value { font-size: 32px; font-weight: bold; color: var(--accent); }
        .stat-label { color: var(--text-muted); font-size: 14px; }
        
        /* Table */
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .table th { background: var(--dark); color: var(--accent); }
        .table tr:hover { background: rgba(255,255,255,0.05); }
        
        /* Buttons */
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: var(--dark); }
        .btn-primary:hover { transform: scale(1.05); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: var(--dark); }
        
        /* Status Badge */
        .status { padding: 5px 12px; border-radius: 20px; font-size: 12px; }
        .status.pending { background: var(--warning); color: var(--dark); }
        .status.completed { background: var(--success); color: white; }
        .status.cancelled { background: var(--danger); color: white; }
        
        /* Form */
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 8px; color: var(--text-muted); }
        .form-input { width: 100%; padding: 12px; background: var(--dark); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--text); }
        .form-input:focus { outline: none; border-color: var(--accent); }
        
        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--dark2); padding: 30px; border-radius: 16px; max-width: 500px; width: 90%; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-close { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
        
        /* Toast */
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; display: none; z-index: 2000; }
        .toast.show { display: block; animation: slideIn 0.3s; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        
        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .service-card { background: var(--dark); border-radius: 12px; padding: 20px; }
        .service-icon { font-size: 40px; margin-bottom: 10px; }
        .service-name { font-weight: bold; margin-bottom: 5px; }
        .service-desc { color: var(--text-muted); font-size: 14px; }
        .service-price { color: var(--accent); font-size: 20px; font-weight: bold; margin-top: 10px; }
        
        /* Loader */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        /* Page sections */
        .page { display: none; }
        .page.active { display: block; }
        
        /* Search */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input { flex: 1; padding: 12px; background: var(--dark); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--text); }
        
        /* Chart placeholder */
        .chart { background: var(--dark); border-radius: 12px; padding: 40px; text-align: center; color: var(--text-muted); min-height: 300px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <!-- App Container -->
    <div class="app" id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">🚀 <span>Lewis</span> AI</div>
            <nav>
                <div class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">📊</span> 儀表板
                </div>
                <div class="nav-item" data-page="services">
                    <span class="nav-icon">💼</span> 服務項目
                </div>
                <div class="nav-item" data-page="bookings">
                    <span class="nav-icon">📋</span> 預約訂單
                </div>
                <div class="nav-item" data-page="users">
                    <span class="nav-icon">👥</span> 用戶管理
                </div>
                <div class="nav-item" data-page="stats">
                    <span class="nav-icon">📈</span> 數據分析
                </div>
                <div class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙️</span> 系統設定
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Header -->
            <header class="header">
                <div class="header-title">翔川 Lewis AI 管理後台</div>
                <div class="user-info">
                    <span id="currentUser">管理員</span>
                    <div class="avatar">L</div>
                </div>
            </header>

            <!-- Dashboard Page -->
            <div class="page active" id="page-dashboard">
                <h2 style="margin-bottom: 20px;">📊 儀表板</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="statUsers">0</div>
                        <div class="stat-label">總用戶</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statBookings">0</div>
                        <div class="stat-label">總訂單</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statRevenue">$0</div>
                        <div class="stat-label">總營收</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statPending">0</div>
                        <div class="stat-label">待處理</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">📈 最近訂單</div>
                    </div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>服務</th>
                                <th>客戶</th>
                                <th>狀態</th>
                                <th>日期</th>
                            </tr>
                        </thead>
                        <tbody id="recentBookings"></tbody>
                    </table>
                </div>
            </div>

            <!-- Services Page -->
            <div class="page" id="page-services">
                <h2 style="margin-bottom: 20px;">💼 服務項目</h2>
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">服務列表</div>
                        <button class="btn btn-primary" onclick="vm.openModal('service')">+ 新增服務</button>
                    </div>
                    <div class="grid" id="servicesList"></div>
                </div>
            </div>

            <!-- Bookings Page -->
            <div class="page" id="page-bookings">
                <h2 style="margin-bottom: 20px;">📋 預約訂單</h2>
                <div class="card">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="搜尋訂單..." id="searchBookings" oninput="vm.filterBookings()">
                    </div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>服務</th>
                                <th>客戶姓名</th>
                                <th>Email</th>
                                <th>狀態</th>
                                <th>日期</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsList"></tbody>
                    </table>
                </div>
            </div>

            <!-- Users Page -->
            <div class="page" id="page-users">
                <h2 style="margin-bottom: 20px;">👥 用戶管理</h2>
                <div class="card">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>姓名</th>
                                <th>Email</th>
                                <th>角色</th>
                                <th>註冊日期</th>
                            </tr>
                        </thead>
                        <tbody id="usersList"></tbody>
                    </table>
                </div>
            </div>

            <!-- Stats Page -->
            <div class="page" id="page-stats">
                <h2 style="margin-bottom: 20px;">📈 數據分析</h2>
                <div class="card">
                    <div class="card-title">營收趨勢</div>
                    <div class="chart">📊 圖表展示區（需要 Chart.js）</div>
                </div>
            </div>

            <!-- Settings Page -->
            <div class="page" id="page-settings">
                <h2 style="margin-bottom: 20px;">⚙️ 系統設定</h2>
                <div class="card">
                    <div class="form-group">
                        <label class="form-label">網站名稱</label>
                        <input type="text" class="form-input" value="翔川 Lewis AI">
                    </div>
                    <div class="form-group">
                        <label class="form-label">聯絡 Email</label>
                        <input type="email" class="form-input" value="contact@neoxiang.ai">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Telegram Bot</label>
                        <input type="text" class="form-input" value="@NeoXiangAI">
                    </div>
                    <button class="btn btn-primary" onclick="vm.showToast('設定已儲存', 'success')">儲存設定</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">新增</h3>
                <button class="modal-close" onclick="vm.closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- JavaScript MVVM -->
    <script>
        // ====================
        // MODEL (數據層)
        // ====================
        const Model = {
            data: {
                services: [],
                bookings: [],
                users: [],
                stats: {
                    total_users: 0,
                    total_bookings: 0,
                    completed_orders: 0,
                    pending_orders: 0,
                    total_revenue: 0
                }
            },
            
            setData(key, value) {
                this.data[key] = value;
            },
            
            getData(key) {
                return this.data[key];
            }
        };

        // ====================
        // VIEWMODEL (業務邏輯)
        // ====================
        const ViewModel = {
            async api(endpoint, method = 'GET', body = null) {
                const options = { method };
                if (body) {
                    options.headers = { 'Content-Type': 'application/json' };
                    options.body = JSON.stringify(body);
                }
                try {
                    const response = await fetch(`api/api.php?request=${endpoint}`, options);
                    return await response.json();
                } catch (error) {
                    console.error('API Error:', error);
                    return { success: false, message: error.message };
                }
            },
            
            formatPrice(price) {
                return '$' + (price || 0).toLocaleString();
            },
            
            formatDate(date) {
                return new Date(date).toLocaleDateString('zh-TW');
            }
        };

        // ====================
        // VIEW (視圖渲染)
        // ====================
        const View = {
            renderServices(services) {
                const container = document.getElementById('servicesList');
                if (!container) return;
                container.innerHTML = services.map(s => `
                    <div class="service-card">
                        <div class="service-icon">${s.icon}</div>
                        <div class="service-name">${s.name}</div>
                        <div class="service-desc">${s.desc}</div>
                        <div class="service-price">${ViewModel.formatPrice(s.price)}</div>
                        <button class="btn btn-primary" style="margin-top: 10px; width: 100%;" onclick="vm.editService(${s.id})">編輯</button>
                    </div>
                `).join('');
            },
            
            renderStats(stats) {
                document.getElementById('statUsers').textContent = stats.total_users || 0;
                document.getElementById('statBookings').textContent = stats.total_bookings || 0;
                document.getElementById('statRevenue').textContent = ViewModel.formatPrice(stats.total_revenue);
                document.getElementById('statPending').textContent = stats.pending_orders || 0;
            },
            
            renderBookings(bookings) {
                const container = document.getElementById('bookingsList');
                if (!container) return;
                container.innerHTML = bookings.map(b => `
                    <tr>
                        <td>${b.id}</td>
                        <td>${b.service_name}</td>
                        <td>${b.name}</td>
                        <td>${b.email}</td>
                        <td><span class="status ${b.status}">${b.status === 'pending' ? '待處理' : '已完成'}</span></td>
                        <td>${b.created_at}</td>
                        <td>
                            ${b.status === 'pending' ? `<button class="btn btn-success" onclick="vm.updateBooking(${b.id}, 'completed')">完成</button>` : ''}
                            <button class="btn btn-danger" onclick="vm.updateBooking(${b.id}, 'cancelled')">取消</button>
                        </td>
                    </tr>
                `).join('');
            },
            
            renderUsers(users) {
                const container = document.getElementById('usersList');
                if (!container) return;
                container.innerHTML = users.map(u => `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td>${u.role === 'admin' ? '👑 管理員' : '👤 用戶'}</td>
                        <td>${u.created_at}</td>
                    </tr>
                `).join('');
            }
        };

        // ====================
        // CONTROLLER (控制器)
        // ====================
        const vm = {
            currentPage: 'dashboard',
            
            async init() {
                await this.loadData();
                this.bindEvents();
            },
            
            async loadData() {
                const [servicesRes, bookingsRes, usersRes, statsRes] = await Promise.all([
                    ViewModel.api('services'),
                    ViewModel.api('bookings'),
                    ViewModel.api('users'),
                    ViewModel.api('stats')
                ]);
                
                if (servicesRes.success) Model.setData('services', servicesRes.data);
                if (bookingsRes.success) Model.setData('bookings', bookingsRes.data);
                if (usersRes.success) Model.setData('users', usersRes.data);
                if (statsRes.success) Model.setData('stats', statsRes.data);
                
                this.render();
            },
            
            render() {
                View.renderServices(Model.getData('services'));
                View.renderStats(Model.getData('stats'));
                View.renderBookings(Model.getData('bookings'));
                View.renderUsers(Model.getData('users'));
            },
            
            bindEvents() {
                // 導航點擊
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const page = item.dataset.page;
                        this.navigate(page);
                    });
                });
            },
            
            navigate(page) {
                // 更新導航狀態
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.page === page);
                });
                
                // 顯示對應頁面
                document.querySelectorAll('.page').forEach(p => {
                    p.classList.toggle('active', p.id === `page-${page}`);
                });
                
                this.currentPage = page;
            },
            
            async filterBookings() {
                const search = document.getElementById('searchBookings').value.toLowerCase();
                const bookings = Model.getData('bookings');
                const filtered = bookings.filter(b => 
                    b.name.toLowerCase().includes(search) ||
                    b.email.toLowerCase().includes(search) ||
                    b.service_name.toLowerCase().includes(search)
                );
                View.renderBookings(filtered);
            },
            
            async updateBooking(id, status) {
                const result = await ViewModel.api('booking/update', 'POST', { id, status });
                if (result.success) {
                    this.showToast('訂單狀態已更新', 'success');
                    await this.loadData();
                } else {
                    this.showToast('更新失敗', 'error');
                }
            },
            
            editService(id) {
                this.showToast('編輯功能開發中', 'success');
            },
            
            openModal(type) {
                document.getElementById('modal').classList.add('active');
            },
            
            closeModal() {
                document.getElementById('modal').classList.remove('active');
            },
            
            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast ${type} show`;
                setTimeout(() => toast.classList.remove('show'), 3000);
            }
        };

        // 啟動應用
        document.addEventListener('DOMContentLoaded', () => vm.init());
    </script>
</body>
</html>
