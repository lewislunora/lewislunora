<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人頁 — 翔川社交</title>
<meta property="og:title" content="個人頁 — 翔川社交">
<meta property="og:description" content="翔川社交個人頁">
<link rel="stylesheet" href="../css/social.css">
<style>
.profile{text-align:center;padding:34px 20px}
.profile .pv{width:88px;height:88px;margin:0 auto 14px}
.profile .nm{font-size:22px;font-weight:800}
.profile .em{color:#64748b;font-size:13px;margin-top:2px}
.profile .bio{color:#cbd5e1;font-size:15px;margin:12px auto;max-width:480px}
.stats{display:flex;justify-content:center;gap:34px;margin:18px 0 22px}
.stats .st b{display:block;font-size:20px;color:#fff}
.stats .st span{font-size:12px;color:#64748b}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.edit-btn{background:transparent;border:1px solid #2b3446;color:#cbd5e1;padding:10px 18px;border-radius:10px;font-size:14px;cursor:pointer}
.edit-card label{display:block;font-size:13px;color:#94a3b8;margin:12px 0 6px}
.edit-card textarea{min-height:80px;resize:vertical}
.feed-title{font-size:15px;color:#94a3b8;margin:20px 4px 12px;font-weight:700}
.post .head .nm{font-weight:700;color:#f1f5f9;font-size:14.5px}
.post .head .time{color:#64748b;font-size:12px;margin-left:auto}
.post .content{font-size:15px;margin-top:10px;white-space:pre-wrap}
.post .stats-line{display:flex;gap:16px;margin-top:10px;font-size:13px;color:#64748b}
</style>
</head>
<body>
<nav class="sn-top"><div class="sn-inner" id="social-nav"></div></nav>
<div class="sn-container">
  <div class="card profile" id="profileCard"><div class="empty">載入中…</div></div>
  <div class="edit-card card" id="editCard" hidden>
    <h3 style="margin-bottom:6px">編輯自我介紹</h3>
    <label>顯示名稱</label><input type="text" id="editName" maxlength="40">
    <label>自我介紹</label><textarea id="editBio" maxlength="200" placeholder="寫點關於自己，讓大家認識你…"></textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
      <button class="edit-btn" onclick="toggleEdit(false)">取消</button>
      <button class="btn-pri" onclick="saveEdit()">儲存</button>
    </div>
  </div>
  <div class="feed-title">📰 貼文</div>
  <div id="postList"><div class="empty">載入中…</div></div>
</div>
<script src="../js/social.js"></script>
<script>
(function () {
  'use strict';
  var profile = null, me = null;
  Social.renderNav('/social/profile.html?me=1');

  var params = new URLSearchParams(location.search);
  var isMe = params.get('me') === '1';
  var uid = params.get('id') ? parseInt(params.get('id')) : null;

  function loadProfile() {
    Social.requireLogin().then(function (u) {
      me = u;
      var target = isMe || !uid ? u.id : uid;
      return Social.api('/api/users/' + target);
    }).then(function (r) {
      if (!r.ok) { document.getElementById('profileCard').innerHTML = '<div class="empty">載入失敗</div>'; return; }
      profile = r.data;
      renderProfile();
      loadPosts(profile.id);
    });
  }

  function renderProfile() {
    document.getElementById('profileCard').innerHTML =
      '<div class="pv">' + Social.avatarHtml(profile, 88) + '</div>' +
      '<div class="nm">' + Social.esc(profile.name) + '</div>' +
      (profile.email ? '<div class="em">' + Social.esc(profile.email) + '</div>' : '') +
      (profile.bio ? '<div class="bio">' + Social.esc(profile.bio) + '</div>' : '<div class="bio" style="color:#475569">（這個人很害羞，還沒有自我介紹）</div>') +
      '<div class="stats">' +
        '<div class="st"><b>' + profile.post_count + '</b><span>貼文</span></div>' +
        '<div class="st"><b>' + profile.followers + '</b><span>追蹤者</span></div>' +
        '<div class="st"><b>' + profile.following + '</b><span>追蹤中</span></div>' +
      '</div>' +
      '<div class="acts">' + actsHtml() + '</div>';
  }

  function actsHtml() {
    if (profile.is_me) {
      return '<button class="btn-ghost" onclick="toggleEdit(true)">✏️ 編輯個人頁</button>';
    }
    var follow = '<button class="btn-pri follow-btn" id="pfollow" onclick="toggleFollow()">' +
      (profile.is_following ? '✓ 追蹤中' : '+ 追蹤') + '</button>';
    return follow + '<a class="btn-pri" href="/social/chat.html?uid=' + profile.id + '">💬 傳訊息</a>';
  }

  window.toggleFollow = function () {
    var following = profile.is_following;
    Social.api('/api/users/' + profile.id + '/follow', { method: following ? 'DELETE' : 'POST', body: {} }).then(function (r) {
      if (!r.ok) { Social.notify('請先登入'); return; }
      profile.is_following = !following;
      profile.followers += following ? -1 : 1;
      renderProfile();
    });
  };

  function loadPosts(pid) {
    Social.api('/api/feed?page=1&per_page=20').then(function (r) {
      var posts = (r.data.items || []).filter(function (p) { return p.author && p.author.id === pid; });
      document.getElementById('postList').innerHTML = posts.length
        ? posts.map(function (p) {
            return '<div class="card post"><div class="head">' + Social.avatarHtml(p.author, 36) +
              '<div class="nm">' + Social.esc(p.author.name) + '</div>' +
              '<span class="time">' + Social.timeAgo(p.created_at) + '</span></div>' +
              '<div class="content">' + Social.esc(p.content) + '</div>' +
              '<div class="stats-line"><span>' + (p.liked ? '❤️' : '🤍') + ' ' + p.like_count + '</span><span>💬 ' + p.comment_count + '</span></div></div>';
          }).join('')
        : '<div class="empty">還沒有發文</div>';
    });
  }

  window.toggleEdit = function (show) {
    var card = document.getElementById('editCard');
    if (show) {
      document.getElementById('editName').value = me.name;
      document.getElementById('editBio').value = me.bio || '';
    }
    card.hidden = !show;
  };

  window.saveEdit = function () {
    Social.api('/api/me/profile', {
      method: 'PUT',
      body: { name: document.getElementById('editName').value, bio: document.getElementById('editBio').value }
    }).then(function (r) {
      if (r.ok) { Social.notify('已儲存'); toggleEdit(false); me = null; loadProfile(); }
    });
  };

  loadProfile();
})();
</script>
</body>
</html>
