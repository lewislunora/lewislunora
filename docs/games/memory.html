<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>記憶翻牌 - Memory Card Game</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  body {
    padding: 16px;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    text-shadow: none;
  }
  .stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 14px;
    padding: 12px 18px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 0.9rem;
  }
  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .stat-item .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.4);
  }
  .stat-item .value {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .stat-item .value.time {
    font-family: "SF Mono", "Fira Code", monospace;
  }
  .best-score {
    font-size: 0.65rem;
    color: rgba(255,215,0,0.7);
    letter-spacing: 0.5px;
    margin-top: 1px;
  }
  .btn-reset {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    border: none;
    border-radius: 10px;
    padding: 8px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    color: #1a1a2e;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .btn-reset:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(247,151,30,0.4); }
  .btn-reset:active { transform: scale(0.96); }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
    width: 100%;
  }
  .card {
    perspective: 800px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.45s cubic-bezier(0.4, 0.0, 0.2, 1);
    transform-style: preserve-3d;
    border-radius: 14px;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    user-select: none;
  }
  .card-back {
    background: linear-gradient(145deg, #2a2a4a, #1e1e3a);
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    font-size: 2rem;
    color: rgba(255,255,255,0.2);
    font-weight: 700;
  }
  .card-back::after {
    content: "?";
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .card:not(.flipped):not(.matched):hover .card-back {
    border-color: rgba(247,151,30,0.4);
    box-shadow: 0 4px 20px rgba(247,151,30,0.15);
  }
  .card:not(.flipped):not(.matched):hover .card-back::after {
    opacity: 0.9;
  }
  .card-front {
    background: linear-gradient(145deg, #1a2a3a, #0f1f2f);
    border: 2px solid rgba(255,215,0,0.3);
    transform: rotateY(180deg);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .card.matched .card-front {
    border-color: rgba(80, 255, 120, 0.4);
    background: linear-gradient(145deg, #1a3a2a, #0f2f1f);
    box-shadow: 0 0 25px rgba(80, 255, 120, 0.15);
  }
  .card.matched .card-front .card-emoji {
    filter: drop-shadow(0 0 8px rgba(80, 255, 120, 0.5));
  }
  .card.matched {
    cursor: default;
    pointer-events: none;
  }
  .card-emoji {
    transition: filter 0.3s;
  }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.4s ease;
  }
  .overlay.show { display: flex; }
  .modal {
    background: linear-gradient(145deg, #1e1e3a, #16213e);
    border-radius: 24px;
    padding: 40px 36px 32px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    border: 1px solid rgba(255,215,0,0.15);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: scaleUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal h2 {
    font-size: 1.6rem;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .modal .trophy { font-size: 3rem; display: block; margin-bottom: 8px; }
  .modal p {
    color: rgba(255,255,255,0.7);
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 6px;
  }
  .modal p strong { color: #fff; }
  .modal .new-record {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 14px;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    border-radius: 20px;
    color: #1a1a2e;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    -webkit-text-fill-color: #1a1a2e;
  }
  .modal .btn-play-again {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    color: #1a1a2e;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 1px;
  }
  .modal .btn-play-again:hover {
    transform: scale(1.03);
    box-shadow: 0 4px 25px rgba(247,151,30,0.4);
  }
  .modal .btn-play-again:active { transform: scale(0.97); }
  .footer {
    text-align: center;
    margin-top: 20px;
    padding: 8px 0 4px;
  }
  .footer a {
    color: rgba(255,255,255,0.35);
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 1px;
    transition: color 0.2s;
  }
  .footer a:hover { color: rgba(255,215,0,0.7); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (max-width: 400px) {
    .grid { gap: 7px; }
    .card-face { font-size: 1.8rem; border-radius: 10px; }
    .card-inner { border-radius: 10px; }
    .card-back { border-radius: 10px; }
    .card-front { border-radius: 10px; }
    h1 { font-size: 1.4rem; }
    .stats-bar { padding: 10px 14px; font-size: 0.8rem; }
    .modal { padding: 30px 24px 26px; }
  }
  @media (min-width: 600px) {
    .container { max-width: 520px; }
    .grid { gap: 12px; }
    .card-face { font-size: 3rem; border-radius: 16px; }
    .card-inner { border-radius: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>記憶翻牌</h1>
  <div class="stats-bar">
    <div class="stat-item">
      <span class="label">配對</span>
      <span class="value" id="pairs">0 / 8</span>
    </div>
    <div class="stat-item">
      <span class="label">翻牌</span>
      <span class="value" id="moves">0</span>
      <span class="best-score" id="bestDisplay"></span>
    </div>
    <div class="stat-item">
      <span class="label">時間</span>
      <span class="value time" id="timer">00:00</span>
    </div>
    <button class="btn-reset" id="resetBtn">重新開始</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer"><a href="../games/">← 返回遊戲大廳</a></div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <span class="trophy">🏆</span>
    <h2>恭喜過關！</h2>
    <p>你用了 <strong id="finalMoves">0</strong> 步</p>
    <p>花費 <strong id="finalTime">00:00</strong></p>
    <div id="newRecordBadge" class="new-record" style="display:none">🎉 新紀錄！</div>
    <button class="btn-play-again" id="playAgainBtn">再玩一次</button>
  </div>
</div>
<script>
(function(){
  const EMOJIS = ['🎮','🚀','💎','🌟','🎯','🏆','🔥','💡'];
  const STORAGE_KEY = 'memoryGameBest';

  let cards = [];
  let flippedIndices = [];
  let matchedPairs = 0;
  let moves = 0;
  let timerInterval = null;
  let seconds = 0;
  let isLocked = false;
  let gameStarted = false;

  const grid = document.getElementById('grid');
  const pairsEl = document.getElementById('pairs');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const bestDisplay = document.getElementById('bestDisplay');
  const resetBtn = document.getElementById('resetBtn');
  const overlay = document.getElementById('overlay');
  const finalMoves = document.getElementById('finalMoves');
  const finalTime = document.getElementById('finalTime');
  const newRecordBadge = document.getElementById('newRecordBadge');
  const playAgainBtn = document.getElementById('playAgainBtn');

  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function getBest() {
    try {
      const val = localStorage.getItem(STORAGE_KEY);
      if (val !== null) {
        const parsed = parseInt(val, 10);
        return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
      }
    } catch (_) {}
    return null;
  }

  function setBest(val) {
    try { localStorage.setItem(STORAGE_KEY, String(val)); } catch (_) {}
  }

  function updateBestDisplay() {
    const best = getBest();
    bestDisplay.textContent = best !== null ? `最佳 ${best}` : '';
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildDeck() {
    const deck = [];
    EMOJIS.forEach((emoji, idx) => {
      deck.push({ id: idx, emoji });
      deck.push({ id: idx, emoji });
    });
    return shuffleArray(deck);
  }

  function renderGrid() {
    grid.innerHTML = '';
    cards.forEach((card, index) => {
      const cardEl = document.createElement('div');
      cardEl.className = 'card';
      cardEl.dataset.index = index;
      const inner = document.createElement('div');
      inner.className = 'card-inner';
      const back = document.createElement('div');
      back.className = 'card-face card-back';
      const front = document.createElement('div');
      front.className = 'card-face card-front';
      const emojiSpan = document.createElement('span');
      emojiSpan.className = 'card-emoji';
      emojiSpan.textContent = card.emoji;
      front.appendChild(emojiSpan);
      inner.appendChild(back);
      inner.appendChild(front);
      cardEl.appendChild(inner);
      cardEl.addEventListener('click', () => handleCardClick(index));
      grid.appendChild(cardEl);
    });
    updateStats();
  }

  function getCardEl(index) {
    return grid.children[index];
  }

  function handleCardClick(index) {
    if (isLocked) return;
    const card = cards[index];
    if (card.matched) return;
    if (flippedIndices.includes(index)) return;
    if (flippedIndices.length >= 2) return;

    if (!gameStarted) {
      gameStarted = true;
      startTimer();
    }

    flipCard(index);
    flippedIndices.push(index);
    moves++;
    updateStats();

    if (flippedIndices.length === 2) {
      isLocked = true;
      const [i1, i2] = flippedIndices;
      if (cards[i1].id === cards[i2].id) {
        cards[i1].matched = true;
        cards[i2].matched = true;
        getCardEl(i1).classList.add('matched');
        getCardEl(i2).classList.add('matched');
        matchedPairs++;
        flippedIndices = [];
        isLocked = false;
        updateStats();
        if (matchedPairs === EMOJIS.length) {
          completeGame();
        }
      } else {
        setTimeout(() => {
          flipCard(i1);
          flipCard(i2);
          flippedIndices = [];
          isLocked = false;
        }, 800);
      }
    }
  }

  function flipCard(index) {
    const el = getCardEl(index);
    el.classList.toggle('flipped');
  }

  function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function completeGame() {
    stopTimer();
    finalMoves.textContent = moves;
    finalTime.textContent = formatTime(seconds);

    const best = getBest();
    let isRecord = false;
    if (best === null || moves < best) {
      isRecord = true;
      setBest(moves);
      updateBestDisplay();
    }
    newRecordBadge.style.display = isRecord ? 'inline-block' : 'none';
    overlay.classList.add('show');
  }

  function updateStats() {
    pairsEl.textContent = `${matchedPairs} / ${EMOJIS.length}`;
    movesEl.textContent = moves;
  }

  function resetGame() {
    stopTimer();
    overlay.classList.remove('show');
    isLocked = false;
    flippedIndices = [];
    matchedPairs = 0;
    moves = 0;
    seconds = 0;
    gameStarted = false;
    timerEl.textContent = '00:00';
    cards = buildDeck().map(c => ({ ...c, matched: false }));
    renderGrid();
    updateBestDisplay();
  }

  resetBtn.addEventListener('click', resetGame);
  playAgainBtn.addEventListener('click', resetGame);

  resetGame();
})();
</script>
</body>
</html>
