<head>

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
  background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0d1233 100%);
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}
header {
  width: 100%;
  max-width: 600px;
  padding: 1.5rem 1rem 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  animation: fadeIn 0.4s ease-out;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 8px;
}
h1 {
  font-size: 2rem;
  font-weight: 800;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}
h1 .mode-badge {
  font-size: 0.6rem;
  -webkit-text-fill-color: initial;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 2px 10px;
  vertical-align: middle;
  margin-left: 6px;
  color: #9999cc;
  font-weight: 500;
}
.status-badge {
  display: inline-block;
  font-size: 0.85rem;
  padding: 4px 16px;
  border-radius: 20px;
  background: rgba(102,126,234,0.15);
  border: 1px solid rgba(102,126,234,0.25);
  color: #b8b8ff;
  margin-top: 2px;
}
.status-badge .category-icon { margin-right: 4px; }
.count-box {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 4px 14px;
  text-align: center;
  white-space: nowrap;
}
.count-box .label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.4);
}
.count-box .value {
  font-size: 1.2rem;
  font-weight: 700;
  color: #fff;
}
.btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  padding: 8px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.2s ease;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  font-family: inherit;
}
.btn:hover {
  background: rgba(102,126,234,0.15);
  border-color: rgba(102,126,234,0.3);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); }
.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  color: #fff;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.btn-secondary {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
}
.btn-secondary:hover { background: rgba(255,255,255,0.15); }
.btn-success {
  background: linear-gradient(135deg, #4ade80, #22c55e);
  border: none;
  color: #fff;
}
.btn-success:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-danger {
  background: linear-gradient(135deg, #f472b6, #ec4899);
  border: none;
  color: #fff;
}
.btn-danger:hover { opacity: 0.9; transform: translateY(-1px); }

#game-container {
  width: 100%;
  max-width: 600px;
  padding: 0 1rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  animation: fadeIn 0.4s ease-out;
}

/* History area */
#history-area {
  flex: 1;
  min-height: 200px;
  max-height: calc(100vh - 340px);
  overflow-y: auto;
  margin: 0.75rem 0;
  padding: 0.5rem;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.04);
  border-radius: 12px;
  scroll-behavior: smooth;
}
#history-area::-webkit-scrollbar { width: 4px; }
#history-area::-webkit-scrollbar-track { background: transparent; }
#history-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

.history-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  min-height: 120px;
  color: rgba(255,255,255,0.25);
  font-size: 0.9rem;
  text-align: center;
  line-height: 1.6;
}

.qa-entry {
  display: flex;
  flex-direction: column;
  margin-bottom: 10px;
  animation: slideIn 0.3s ease-out;
}
.qa-entry:last-child { margin-bottom: 0; }
.question-bubble {
  align-self: flex-end;
  background: rgba(102,126,234,0.2);
  border: 1px solid rgba(102,126,234,0.2);
  border-radius: 14px 14px 4px 14px;
  padding: 8px 14px;
  max-width: 85%;
  font-size: 0.92rem;
  color: #d0d0ff;
  word-break: break-word;
}
.answer-bubble {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 14px 14px 14px 4px;
  padding: 8px 14px;
  max-width: 85%;
  font-size: 0.92rem;
  margin-top: 4px;
  word-break: break-word;
}
.answer-bubble.yes {
  background: rgba(74,222,128,0.15);
  border: 1px solid rgba(74,222,128,0.2);
  color: #86efac;
}
.answer-bubble.no {
  background: rgba(244,114,182,0.15);
  border: 1px solid rgba(244,114,182,0.2);
  color: #f9a8d4;
}
.answer-bubble.uncertain {
  background: rgba(251,191,36,0.12);
  border: 1px solid rgba(251,191,36,0.15);
  color: #fcd34d;
}
.answer-bubble .hint-dots {
  font-size: 0.7rem;
  letter-spacing: 2px;
  opacity: 0.5;
}
.answer-bubble .qa-num {
  font-size: 0.65rem;
  opacity: 0.4;
  margin-left: auto;
  padding-left: 8px;
}

/* Input area */
#input-area {
  display: flex;
  gap: 8px;
  margin: 0.5rem 0 0.75rem;
}
#question-input {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px 14px;
  color: #e0e0e0;
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
#question-input:focus {
  border-color: rgba(102,126,234,0.5);
  box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
#question-input::placeholder { color: rgba(255,255,255,0.25); }
#question-input:disabled { opacity: 0.5; }

/* Action row */
#action-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 1rem;
}
#action-row .btn { flex: 1; justify-content: center; display: flex; align-items: center; gap: 6px; }

footer {
  width: 100%;
  max-width: 600px;
  padding: 0.5rem 1rem 1.5rem;
  text-align: center;
}
footer a {
  color: rgba(255,255,255,0.3);
  text-decoration: none;
  font-size: 0.8rem;
  transition: color 0.2s;
}
footer a:hover { color: rgba(255,255,255,0.6); }

/* Modal overlay */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.modal-overlay.show {
  display: flex;
  opacity: 1;
}
.modal-box {
  background: #1a1f3a;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 2rem;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  transform: scale(0.9);
  transition: transform 0.3s ease;
}
.modal-overlay.show .modal-box { transform: scale(1); }
.modal-box h2 {
  font-size: 1.3rem;
  margin-bottom: 0.75rem;
  color: #fff;
}
.modal-box p {
  color: rgba(255,255,255,0.5);
  font-size: 0.85rem;
  margin-bottom: 1rem;
}
.modal-box input {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px 14px;
  color: #e0e0e0;
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 1rem;
}
.modal-box input:focus {
  border-color: rgba(102,126,234,0.5);
  box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
}
.modal-box .modal-btns {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.modal-box .modal-btns .btn { flex: 1; }

/* Result overlay */
#result-overlay .modal-box { padding: 2.5rem 2rem; }
#result-overlay .result-icon { font-size: 3.5rem; margin-bottom: 0.5rem; }
#result-overlay .result-title {
  font-size: 1.5rem;
  font-weight: 800;
  margin-bottom: 0.5rem;
}
#result-overlay .result-title.win { color: #4ade80; }
#result-overlay .result-title.lose { color: #f472b6; }
#result-overlay .result-subtitle {
  color: rgba(255,255,255,0.5);
  font-size: 0.95rem;
  margin-bottom: 0.25rem;
  line-height: 1.6;
}
#result-overlay .result-subtitle .answer-text {
  color: #e0e0ff;
  font-weight: 700;
  font-size: 1.2rem;
}
#result-overlay .result-score {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.35);
  margin-bottom: 1.2rem;
}
#result-overlay .result-btns { display: flex; gap: 10px; justify-content: center; }
#result-overlay .result-btns .btn { flex: 1; }

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.loading-pulse { animation: pulse 1.2s ease-in-out infinite; }
.thinking-dots::after {
  content: '';
  display: inline-block;
  width: 1.2em;
  text-align: left;
  animation: dotProgress 1.8s steps(4, end) infinite;
}
@keyframes dotProgress {
  0% { content: ''; }
  25% { content: '.'; }
  50% { content: '..'; }
  75% { content: '...'; }
}

/* Scrollable history auto-scroll */
#history-area { overscroll-behavior: contain; }

@media (max-width: 540px) {
  header { padding: 1rem 0.75rem 0; }
  h1 { font-size: 1.6rem; }
  .count-box .value { font-size: 1rem; }
  .count-box { padding: 3px 10px; }
  .btn { font-size: 0.8rem; padding: 7px 14px; }
  #question-input { font-size: 0.88rem; padding: 8px 12px; }
}
@media (max-width: 420px) {
  .count-box .label { font-size: 0.55rem; }
  .count-box .value { font-size: 0.9rem; }
  .header-top { gap: 4px; }
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>AI 20 問</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="count-box">
        <span class="label">問題</span>
        <span class="value" id="question-count">0 / 20</span>
      </div>
      <button class="btn btn-secondary" id="newGameBtn" title="新遊戲">↻</button>
    </div>
  </div>
  <div class="status-badge" id="statusBadge">🤔 按「新遊戲」開始</div>
</header>

<div id="game-container">
  <div id="history-area">
    <div class="history-empty" id="historyEmpty">
      點選「新遊戲」開始<br>AI 會想一個東西，你來問問題猜！
    </div>
  </div>

  <div id="input-area">
    <input type="text" id="question-input" placeholder="輸入你的問題..." disabled>
    <button class="btn btn-primary" id="askBtn" disabled>提問</button>
  </div>

  <div id="action-row">
    <button class="btn btn-secondary" id="guessBtn" disabled>🔍 猜答案</button>
    <button class="btn btn-secondary" id="hintBtn" disabled>💡 提示</button>
  </div>
</div>

<footer>
  <a href="index.html">← 返回遊戲大廳</a>
</footer>

<!-- Guess Modal -->
<div class="modal-overlay" id="guessModal">
  <div class="modal-box">
    <h2>🔍 猜答案</h2>
    <p>你覺得 AI 想的是什麼？</p>
    <input type="text" id="guessInput" placeholder="輸入你的答案..." autocomplete="off">
    <div class="modal-btns">
      <button class="btn btn-secondary" id="guessCancelBtn">取消</button>
      <button class="btn btn-success" id="guessSubmitBtn">送出猜測</button>
    </div>
  </div>
</div>

<!-- Result Overlay -->
<div class="modal-overlay" id="resultOverlay">
  <div class="modal-box">
    <div class="result-icon" id="resultIcon">🎉</div>
    <div class="result-title" id="resultTitle">你贏了！</div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-btns" id="resultBtns"></div>
  </div>
</div>

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function getCategoryById(id) { return CATEGORIES.find(c => c.id === id); }

function startNewGame() {
  currentItem = pickRandom(ITEMS);
  questions = [];
  gameActive = true;
  isAsking = false;
  questionInput.disabled = false;
  askBtn.disabled = false;
  guessBtn.disabled = false;
  hintBtn.disabled = false;
  questionInput.value = '';
  questionInput.focus();
  updateCounter();
  updateStatus();
  renderHistory();
  resultOverlay.classList.remove('show');
  guessModal.classList.remove('show');
  checkBackend();
}

function checkBackend() {
  if (backendAvailable !== null) return;
  fetch(BACKEND_URL, { method: 'HEAD', signal: AbortSignal.timeout(3000) })
    .then(r => { backendAvailable = r.ok; useBackend = r.ok; updateModeBadge(); })
    .catch(() => { backendAvailable = false; useBackend = false; updateModeBadge(); });
}

function updateModeBadge() {
  const badge = document.querySelector('.mode-badge');
  if (!badge) return;
  if (useBackend) {
    badge.textContent = 'AI';
    badge.style.background = 'rgba(102,126,234,0.2)';
    badge.style.borderColor = 'rgba(102,126,234,0.3)';
    badge.style.color = '#b8b8ff';
  } else {
    badge.textContent = '離線';
    badge.style.background = 'rgba(251,191,36,0.12)';
    badge.style.borderColor = 'rgba(251,191,36,0.2)';
    badge.style.color = '#fcd34d';
  }
}

function updateStatus() {
  if (!currentItem || !gameActive) {
    statusBadge.textContent = '🤔 按「新遊戲」開始';
    return;
  }
  const cat = getCategoryById(currentItem.cat);
  if (!cat) { statusBadge.textContent = '🤔 我想好了一個東西！'; return; }
  statusBadge.innerHTML = `<span class="category-icon">${cat.icon}</span> 我想的是一個${cat.label}`;
}

function updateCounter() {
  questionCount.textContent = `${questions.length} / ${MAX_QUESTIONS}`;
}

function addQA(question, answer, hintLevel) {
  questions.push({ question, answer, hintLevel, timestamp: Date.now() });
  updateCounter();
  renderHistory();
  if (questions.length >= MAX_QUESTIONS) {
    endGame(false);
  }
}

function renderHistory() {
  historyEmpty.style.display = questions.length === 0 ? 'flex' : 'none';
  const existing = historyArea.querySelectorAll('.qa-entry');
  for (const el of existing) el.remove();

  for (let i = 0; i < questions.length; i++) {
    const qa = questions[i];
    const entry = document.createElement('div');
    entry.className = 'qa-entry';

    const qBubble = document.createElement('div');
    qBubble.className = 'question-bubble';
    qBubble.textContent = `Q${i + 1}: ${qa.question}`;
    entry.appendChild(qBubble);

    const aBubble = document.createElement('div');
    const ansClass = qa.answer === '是' ? 'yes' : qa.answer === '否' ? 'no' : 'uncertain';
    const ansText = qa.answer === '不確定' ? '🤷 不確定' : qa.answer === '是' ? '✅ 是' : '❌ 否';
    aBubble.className = `answer-bubble ${ansClass}`;
    let hintDots = '';
    if (qa.hintLevel > 0) {
      hintDots = ' <span class="hint-dots">' + '💡'.repeat(qa.hintLevel) + '</span>';
    }
    aBubble.innerHTML = `${ansText}${hintDots} <span class="qa-num">#${i + 1}</span>`;
    entry.appendChild(aBubble);

    historyArea.appendChild(entry);
  }

  historyArea.scrollTop = historyArea.scrollHeight;
}

let loadingInterval = null;
function showLoading() {
  const entry = document.createElement('div');
  entry.className = 'qa-entry';
  entry.id = 'loading-entry';
  const qBubble = document.createElement('div');
  qBubble.className = 'question-bubble';
  qBubble.textContent = `Q${questions.length + 1}: ${questionInput.value}`;
  entry.appendChild(qBubble);
  const aBubble = document.createElement('div');
  aBubble.className = 'answer-bubble uncertain';
  aBubble.id = 'loading-bubble';
  aBubble.textContent = '⏳ AI 思考中';
  entry.appendChild(aBubble);
  historyArea.appendChild(entry);
  historyArea.scrollTop = historyArea.scrollHeight;
  let dots = 0;
  const bubble = document.getElementById('loading-bubble');
  if (bubble) {
    loadingInterval = setInterval(() => {
      dots = (dots + 1) % 4;
      bubble.textContent = '⏳ AI 思考中' + '.'.repeat(dots);
    }, 400);
  }
}

function removeLoading() {
  if (loadingInterval) { clearInterval(loadingInterval); loadingInterval = null; }
  const el = document.getElementById('loading-entry');
  if (el) el.remove();
}

async function submitQuestion() {
  const text = questionInput.value.trim();
  if (!text || !gameActive || isAsking) return;
  if (questions.length >= MAX_QUESTIONS) return;

  isAsking = true;
  askBtn.disabled = true;
  questionInput.disabled = true;
  showLoading();

  let answer = '不確定';
  let hintLevel = 0;

  if (useBackend) {
    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic: currentItem.name, question: text }),
        signal: AbortSignal.timeout(10000)
      });
      if (res.ok) {
        const data = await res.json();
        answer = data.answer || '不確定';
        hintLevel = data.hint_level || 0;
      } else {
        useBackend = false;
        updateModeBadge();
        const result = getLocalAnswer(text);
        answer = result.answer;
        hintLevel = result.hintLevel;
      }
    } catch {
      useBackend = false;
      updateModeBadge();
      const result = getLocalAnswer(text);
      answer = result.answer;
      hintLevel = result.hintLevel;
    }
  } else {
    const result = getLocalAnswer(text);
    answer = result.answer;
    hintLevel = result.hintLevel;
  }

  removeLoading();
  addQA(text, answer, hintLevel);

  if (!gameActive) return;
  questionInput.value = '';
  questionInput.disabled = false;
  askBtn.disabled = false;
  isAsking = false;
  questionInput.focus();
}

function getLocalAnswer(question) {
  let q = question.replace(/[？?，,。.！!、；;：:\s]/g, '').toLowerCase();

  // Category checks
  for (const check of CATEGORY_CHECKS) {
    for (const kw of check.keywords) {
      if (q.includes(kw)) {
        const isMatch = currentItem.cat === check.cat;
        return { answer: isMatch ? '是' : '否', hintLevel: isMatch ? 1 : 2 };
      }
    }
  }

  // Direct name check
  if (q.includes(currentItem.name) || currentItem.name.includes(q)) {
    return { answer: '是', hintLevel: 3 };
  }

  // Pattern matching: "是XX嗎" "是不是XX"
  let attr = null;
  let m = q.match(/^(?:是|是不是)(.+?)(?:嗎|呢)?$/);
  if (m) attr = m[1];
  if (!attr) {
    m = q.match(/^會(.+?)(?:嗎|呢)?$/);
    if (m) attr = '會' + m[1];
  }
  if (!attr) {
    m = q.match(/^有(.+?)(?:嗎|呢)?$/);
    if (m) attr = '有' + m[1];
  }
  if (!attr) {
    m = q.match(/^能(.+?)(?:嗎|呢)?$/);
    if (m) attr = '會' + m[1];
  }
  if (!attr) {
    m = q.match(/^可以(.+?)(?:嗎|呢)?$/);
    if (m) attr = '會' + m[1];
  }
  if (!attr) {
    m = q.match(/^會在(.+?)(?:嗎|呢)?$/);
    if (m) attr = '生活在' + m[1];
  }
  if (!attr) {
    m = q.match(/^住在(.+?)(?:嗎|呢)?$/);
    if (m) attr = '生活在' + m[1];
  }
  if (!attr) {
    m = q.match(/^生活在(.+?)(?:嗎|呢)?$/);
    if (m) attr = '生活在' + m[1];
  }
  if (!attr) {
    m = q.match(/^(.+)的(?:嗎|呢)?$/);
    if (m) attr = m[1];
  }

  // Try matching extracted attribute
  if (attr) {
    // Check aliases
    const aliasTarget = TRAIT_ALIASES[attr];
    const checkAttr = aliasTarget || attr;

    // Check direct category
    for (const cat of CATEGORIES) {
      if (attr.includes(cat.label) || cat.label.includes(attr)) {
        const isMatch = currentItem.cat === cat.id;
        return { answer: isMatch ? '是' : '否', hintLevel: isMatch ? 1 : 2 };
      }
    }

    // Check traits (positive)
    for (const t of currentItem.traits) {
      if (t === checkAttr || t.includes(checkAttr) || checkAttr.includes(t) ||
          (aliasTarget && (t === aliasTarget || t.includes(aliasTarget) || aliasTarget.includes(t)))) {
        return { answer: '是', hintLevel: 2 };
      }
    }

    // Check notTraits (negative)
    for (const t of currentItem.not) {
      if (t === checkAttr || t.includes(checkAttr) || checkAttr.includes(t) ||
          (aliasTarget && (t === aliasTarget || t.includes(aliasTarget) || aliasTarget.includes(t)))) {
        return { answer: '否', hintLevel: 2 };
      }
    }
  }

  // Keyword-based matching
  const matchedTraits = [];
  const matchedNotTraits = [];

  for (const [keyword, trait] of Object.entries(TRAIT_ALIASES)) {
    if (q.includes(keyword)) {
      if (currentItem.traits.includes(trait)) matchedTraits.push(trait);
      else if (currentItem.not.includes(trait)) matchedNotTraits.push(trait);
    }
  }

  if (matchedTraits.length > 0) {
    return { answer: '是', hintLevel: 1 + Math.min(matchedTraits.length, 2) };
  }
  if (matchedNotTraits.length > 0) {
    return { answer: '否', hintLevel: 1 + Math.min(matchedNotTraits.length, 2) };
  }

  return { answer: '不確定', hintLevel: 0 };
}

  if (!gameActive) return;
  guessInput.value = '';
  guessModal.classList.add('show');

function submitGuess() {
  const guess = guessInput.value.trim();
  if (!guess || !currentItem) return;
  guessModal.classList.remove('show');

  const isCorrect = guess.includes(currentItem.name) || currentItem.name.includes(guess);
  if (isCorrect) {
    endGame(true);
  } else {
    const entry = document.createElement('div');
    entry.className = 'qa-entry';
    const qBubble = document.createElement('div');
    qBubble.className = 'question-bubble';
    qBubble.textContent = `🔍 猜測: ${guess}`;
    entry.appendChild(qBubble);
    const aBubble = document.createElement('div');
    aBubble.className = 'answer-bubble no';
    aBubble.innerHTML = '❌ 不對，再想想！';
    entry.appendChild(aBubble);
    historyArea.appendChild(entry);
    historyArea.scrollTop = historyArea.scrollHeight;
  }
}

function showHint() {
  if (!gameActive || !currentItem || questions.length === 0) return;
  const cat = getCategoryById(currentItem.cat);
  const hints = [];

  hints.push(`📂 類別：${cat ? cat.label : '未知'}${cat ? ' ' + cat.icon : ''}`);

  const usedQuestions = questions.length;
  const traitIdx = Math.min(Math.floor((usedQuestions - 1) / 3), currentItem.traits.length - 1);
  if (usedQuestions >= 2 && traitIdx >= 0) {
    hints.push(`🔹 特徵：它有「${currentItem.traits[traitIdx]}」的特性`);
  }

  const notIdx = Math.min(Math.floor((usedQuestions - 2) / 4), currentItem.not.length - 1);
  if (usedQuestions >= 4 && notIdx >= 0) {
    hints.push(`🔸 它不是「${currentItem.not[notIdx]}」`);
  }

  if (usedQuestions >= 7) {
    const firstChar = currentItem.name[0];
    hints.push(`💡 名稱第一個字是「${firstChar}」`);
  }

  if (usedQuestions >= 12) {
    hints.push(`🔑 名稱有 ${currentItem.name.length} 個字`);
  }

  const hintText = hints.join('<br>');
  const entry = document.createElement('div');
  entry.className = 'qa-entry';
  const qBubble = document.createElement('div');
  qBubble.className = 'question-bubble';
  qBubble.textContent = `💡 請求提示 (已問 ${usedQuestions} 題)`;
  entry.appendChild(qBubble);
  const aBubble = document.createElement('div');
  aBubble.className = 'answer-bubble uncertain';
  aBubble.innerHTML = hintText;
  entry.appendChild(aBubble);
  historyArea.appendChild(entry);
  historyArea.scrollTop = historyArea.scrollHeight;
}

function endGame(won) {
  gameActive = false;
  questionInput.disabled = true;
  askBtn.disabled = true;
  guessBtn.disabled = true;
  hintBtn.disabled = true;

  setTimeout(() => {
    resultIcon.textContent = won ? '🎉' : '😔';
    resultTitle.textContent = won ? '你贏了！' : '遊戲結束';
    resultTitle.className = `result-title ${won ? 'win' : 'lose'}`;

    const cat = getCategoryById(currentItem.cat);
    const catStr = cat ? `${cat.label}（${cat.icon}）` : '未知';

    if (won) {
      resultSubtitle.innerHTML = `答案是 <span class="answer-text">${currentItem.name}</span><br>你用了 ${questions.length} / ${MAX_QUESTIONS} 個問題！`;
      const finalScore = Math.min(Math.round((1 - questions.length / MAX_QUESTIONS) * 100) + 50, 100);
      resultScore.textContent = '得分：0 分';
      const scoreEl = resultScore;
      let currentScore = 0;
      const step = Math.max(1, Math.floor(finalScore / 20));
      const scoreInterval = setInterval(() => {
        currentScore = Math.min(currentScore + step, finalScore);
        const label = currentScore >= 90 ? '完美！' : currentScore >= 70 ? '很棒！' : currentScore >= 50 ? '不錯！' : '繼續加油！';
        scoreEl.textContent = `得分：${currentScore} 分 — ${label}`;
        if (currentScore >= finalScore) clearInterval(scoreInterval);
      }, 40);
    } else {
      resultSubtitle.innerHTML = `答案是 <span class="answer-text">${currentItem.name}</span><br>類別：${catStr}`;
      resultScore.textContent = `用了全部 ${MAX_QUESTIONS} 個問題，下次再挑戰！`;
    }

    resultBtns.innerHTML = `
      <button class="btn btn-primary" id="playAgainBtn">🔄 再玩一次</button>
      <button class="btn btn-secondary" id="resultBackBtn">← 返回</button>
    `;
    resultOverlay.classList.add('show');
    document.getElementById('playAgainBtn').addEventListener('click', () => {
      resultOverlay.classList.remove('show');
      startNewGame();
    });
    document.getElementById('resultBackBtn').addEventListener('click', () => {
      resultOverlay.classList.remove('show');
    });
  }, 600);
}

// Event binding
askBtn.addEventListener('click', submitQuestion);
questionInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitQuestion();
});
newGameBtn.addEventListener('click', startNewGame);
guessBtn.addEventListener('click', openGuessModal);
hintBtn.addEventListener('click', showHint);
guessCancelBtn.addEventListener('click', () => guessModal.classList.remove('show'));
guessSubmitBtn.addEventListener('click', submitGuess);
guessInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitGuess();
});

// Close modals on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    guessModal.classList.remove('show');
    resultOverlay.classList.remove('show');
    if (gameActive) questionInput.focus();
  }
});

// Click outside modal to close
guessModal.addEventListener('click', (e) => {
  if (e.target === guessModal) guessModal.classList.remove('show');
});

// Prevent closing result overlay by clicking outside
resultOverlay.addEventListener('click', (e) => {
  if (e.target === resultOverlay) return;
});

// Init mode badge
const badge = document.createElement('span');
badge.className = 'mode-badge';
document.querySelector('h1').appendChild(badge);
updateModeBadge();

// Auto start
startNewGame();

})();
</script>
