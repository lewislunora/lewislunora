<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>三國志 線上對戰 — 1-12 人即時戰略</title>
<meta name="description" content="與朋友或電腦線上即時對戰三國志！開房邀請好友加入，電腦自動補滿空缺，最多 12 人逐鹿中原！">
<meta property="og:title" content="🏯 三國志線上對戰 — 來挑戰我！">
<meta property="og:description" content="1-12 人線上對戰三國志，開房或輸入邀請碼，電腦自動補位！">
<meta property="og:image" content="https://lewislunora.github.io/lewislunora/assets/og-game.png">
<meta property="og:type" content="website">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', Helvetica, Arial, sans-serif;
  background: linear-gradient(145deg, #0f0f13 0%, #1a1a2e 50%, #16213e 100%);
  color: #e0e0e0;
  display: flex;
  justify-content: center;
  padding: 24px 14px;
}
.game-container {
  position: relative;
  max-width: 960px;
  width: 100%;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 32px;
  padding: 28px 26px 20px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.06);
}
.title {
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  user-select: none;
}
.subtitle { text-align: center; color: rgba(255,255,255,0.45); font-size: 13px; margin-bottom: 16px; }

.conn-badge { text-align: center; font-size: 12px; margin-bottom: 10px; color: rgba(255,255,255,0.4); }
.conn-badge .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f87171; margin-right: 6px; vertical-align: middle; }
.conn-badge.on .dot { background: #4ade80; }

.status-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; }
.stat {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 100px;
  padding: 5px 14px;
  font-size: 12.5px;
  font-weight: 600;
}
.stat b { color: #ffd866; }
.stat.me { border-color: rgba(255,210,0,0.4); }

.players-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 12px; }
.chip {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 100px;
  border: 1px solid;
  background: rgba(255,255,255,0.04);
}
.chip.turn { box-shadow: 0 0 0 2px rgba(255,210,0,0.35); }

.hint { text-align: center; font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 12px; min-height: 20px; }

.map-grid { display: grid; gap: 10px; margin-bottom: 16px; }
.territory {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 10px 6px 8px;
  text-align: center;
  cursor: default;
  transition: all 0.2s ease;
}
.territory.mine { cursor: pointer; }
.territory .owner { font-size: 11px; font-weight: 700; margin-bottom: 1px; }
.territory .name { font-size: 13.5px; font-weight: 700; margin-bottom: 1px; }
.territory .army { font-size: 12px; color: rgba(255,255,255,0.55); }
.territory.selected { border-color: #ffd200; box-shadow: 0 0 0 2px rgba(255,210,0,0.25); transform: translateY(-2px); }
.territory.target { border-color: #ff9f43; animation: pulse 1.2s infinite; }
.territory.target.mine { cursor: crosshair; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,159,67,0.35); }
  50% { box-shadow: 0 0 0 8px rgba(255,159,67,0); }
}
.territory.dim { opacity: 0.55; }

.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 16px; }
.btn {
  border: none; cursor: pointer; padding: 10px 20px; border-radius: 100px;
  font-size: 14px; font-weight: 700; color: #1a1a2e;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  box-shadow: 0 4px 14px rgba(247,151,30,0.25);
  transition: all 0.2s; font-family: inherit;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(247,151,30,0.35); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.ghost { background: rgba(255,255,255,0.08); color: #e0e0e0; box-shadow: none; border: 1px solid rgba(255,255,255,0.1); }
.btn.ghost:hover { background: rgba(255,255,255,0.14); }
.btn.big { padding: 14px 28px; font-size: 15px; }

.log-box {
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px; padding: 12px 16px; max-height: 120px; overflow-y: auto;
  font-size: 13px; line-height: 1.9; color: rgba(255,255,255,0.7);
}
.log-box div { border-bottom: 1px dashed rgba(255,255,255,0.05); }

.overlay {
  position: fixed; inset: 0; background: rgba(5,5,10,0.88);
  backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center;
  z-index: 50; padding: 20px;
}
.overlay.show { display: flex; }
.overlay-card {
  background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px; padding: 28px 26px; max-width: 520px; width: 100%;
  text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.7);
  max-height: 92vh; overflow-y: auto;
}
.overlay-card h2 { font-size: 22px; margin-bottom: 10px; }
.overlay-card p { color: rgba(255,255,255,0.6); font-size: 14px; margin: 8px 0; }
.overlay-card .lobby-btns { display: flex; gap: 12px; margin: 18px 0; }
.overlay-card .lobby-btns .btn { flex: 1; padding: 14px 8px; font-size: 15px; }
.room-code { font-size: 38px; font-weight: 800; letter-spacing: 10px; color: #ffd866; margin: 10px 0; user-select: all; }
input[type=text], input[type=number], select {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
  color: #e0e0e0; border-radius: 10px; padding: 10px 14px; font-size: 15px;
  width: 100%; margin: 6px 0; outline: none; font-family: inherit; text-align: center; letter-spacing: 2px;
}
input[type=text]:focus, select:focus { border-color: #f7971e; }
select option { background: #1a1a2e; color: #e0e0e0; }
.spinner {
  display: inline-block; width: 18px; height: 18px;
  border: 3px solid rgba(255,255,255,0.15); border-top-color: #ffd866;
  border-radius: 50%; animation: spin 0.9s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.win-text { color: #ffd866; }
.lose-text { color: #ff6b6b; }
.lobby-player-row {
  display: flex; justify-content: center; align-items: center; gap: 8px;
  padding: 5px 12px; margin: 4px auto; border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600;
  max-width: 280px;
}
@media (max-width: 600px) {
  .map-grid { gap: 8px; }
  .title { font-size: 22px; }
  .overlay-card .lobby-btns { flex-direction: column; }
  .game-container { padding: 22px 14px; }
}
.btn-share{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.2);color:#00d4ff;font-size:.85rem;padding:10px 18px;cursor:pointer;border-radius:10px;font-weight:600;transition:all .2s;font-family:inherit}
.btn-share:hover{background:rgba(0,212,255,.2)}
</style>
</head>
<body>
<div class="game-container">
  <div class="title">🏯 三國志 線上對戰</div>
  <div class="subtitle">1-12 人 · 邀請好友 · 電腦自動補位</div>
  <div class="conn-badge" id="connBadge"><span class="dot"></span><span id="connText">未連線</span></div>

  <div class="status-bar" id="statusBar"></div>
  <div class="players-strip" id="playersStrip"></div>
  <div class="hint" id="hint"></div>
  <div class="map-grid" id="mapGrid"></div>
  <div class="actions">
    <button class="btn" id="btnRecruit" onclick="doRecruit()">🔨 徵兵 −10金</button>
    <button class="btn" id="btnRest" onclick="doRest()">🛡️ 整軍</button>
    <button class="btn ghost" id="btnEnd" onclick="doEnd()">⏭️ 結束回合</button>
    <button class="btn ghost" id="btnQuit" onclick="leaveGame()">🚪 離開</button>
  </div>
  <div class="log-box" id="logBox"></div>
</div>

<div class="overlay show" id="lobbyOverlay">
  <div class="overlay-card">
    <h2 id="lobbyTitle">🏯 三國志 線上對戰</h2>
    <p id="lobbyMsg">建立戰局邀請好友，電腦會自動補滿空缺，最多 12 人逐鹿中原！</p>
    <div id="lobbyPlayers"></div>
    <div class="lobby-btns" id="lobbyBtns">
      <button class="btn" onclick="showCreateForm()">👑 建立戰局</button>
      <button class="btn ghost" onclick="showJoinForm()">🔑 加入戰局</button>
    </div>
    <div id="lobbyForm"></div>
  </div>
</div>

<div class="overlay" id="endOverlay">
  <div class="overlay-card">
    <h2 id="endTitle"></h2>
    <p id="endMsg"></p>
    <button class="btn" style="margin-top:12px" onclick="leaveGame()">🚪 離開戰局</button>
  </div>
</div>

<div class="overlay" id="dropOverlay">
  <div class="overlay-card">
    <h2>📴 連線已中斷</h2>
    <p>與房主的連線已斷開。</p>
    <button class="btn" style="margin-top:12px" onclick="location.reload()">🔄 重新連線</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  var FACTIONS = [
    { k: '曹', name: '曹操', title: '魏', color: '#8a7bff' },
    { k: '劉', name: '劉備', title: '蜀', color: '#34d399' },
    { k: '孫', name: '孫權', title: '吳', color: '#f87171' },
    { k: '袁', name: '袁紹', title: '冀', color: '#f59e0b' },
    { k: '董', name: '董卓', title: '涼', color: '#a855f7' },
    { k: '呂', name: '呂布', title: '呂', color: '#eab308' },
    { k: '馬', name: '馬騰', title: '西涼', color: '#06b6d4' },
    { k: '張', name: '張魯', title: '漢', color: '#ec4899' },
    { k: '公孫', name: '公孫瓚', title: '遼', color: '#3b82f6' },
    { k: '劉表', name: '劉表', title: '荊', color: '#10b981' },
    { k: '劉焉', name: '劉焉', title: '益', color: '#84cc16' },
    { k: '士', name: '士燮', title: '交', color: '#f97316' }
  ];
  var MAX_ARMY = 220;
  var CITY_POOL = [
    '冀州', '幽州', '并州', '青州', '徐州', '兗州', '豫州', '司隸',
    '涼州', '荊州', '揚州', '益州', '交州', '漢中', '長安', '洛陽',
    '許昌', '鄴城', '南陽', '襄陽', '江陵', '江夏', '廬江', '建業',
    '會稽', '吳郡', '巴郡', '成都', '永安', '天水', '安定', '隴西',
    '陳留', '濮陽', '平原', '北海', '下邳', '壽春', '丹陽', '宛城',
    '新野', '汝南', '譙郡', '東萊', '樂浪', '代郡', '上黨', '西涼',
    '南郡', '桂陽', '零陵', '武陵', '長沙', '樊城', '官渡', '街亭',
    '夷陵', '白帝', '柴桑', '吳興'
  ];

  var isHost = false;
  var myIndex = -1;
  var myName = '';
  var peer = null;
  var conns = {};        // host only: index -> connection
  var clientConn = null; // client only
  var state = null;
  var started = false;
  var selected = -1;
  var endShown = false;
  var aiTimer = null;
  var factionOrder = [];

  function $(id) { return document.getElementById(id); }
  function F(k) { for (var i = 0; i < FACTIONS.length; i++) if (FACTIONS[i].k === k) return FACTIONS[i]; return FACTIONS[0]; }
  function nameOf(i) { return state.players[i].name || F(state.players[i].faction).name; }
  function myTerritories() { return state.map.filter(function (t) { return t.owner === myIndex; }); }
  function territoriesOf(i) { return state.map.filter(function (t) { return t.owner === i; }).length; }
  function income(i) { return 20 + territoriesOf(i) * 5; }
  function isMyTurn() { return started && state.winner === null && state.turn === myIndex && state.players[myIndex].alive; }
  function neighborsOf(id) {
    var t = state.map[id];
    return state.map.filter(function (o) { return Math.abs(o.row - t.row) + Math.abs(o.col - t.col) === 1; });
  }

  function setConn(on, txt) {
    $('connBadge').className = 'conn-badge' + (on ? ' on' : '');
    $('connText').textContent = txt;
  }

  /* ═══════ 大廳（建立 / 加入） ═══════ */
  function showCreateForm() {
    $('lobbyBtns').style.display = 'none';
    $('lobbyForm').innerHTML =
      '<input type="text" id="hostName" maxlength="12" placeholder="你的稱號">' +
      '<select id="hostSlots">' + slotOptions() + '</select>' +
      '<button class="btn" style="width:100%;margin-top:8px" onclick="createRoom()">👑 建立戰局</button>';
    $('lobbyMsg').textContent = '設定總人數（含電腦），人數越多地圖越大！';
  }
  function slotOptions() {
    var html = '';
    for (var n = 2; n <= 12; n++) html += '<option value="' + n + '"' + (n === 4 ? ' selected' : '') + '>' + n + ' 人</option>';
    return html;
  }

  function createRoom() {
    if (typeof Peer === 'undefined') { alert('無法載入連線模組（PeerJS），請檢查網路連線'); return; }
    var slots = parseInt($('hostSlots').value, 10);
    myName = $('hostName').value.trim() || '房主';
    isHost = true; myIndex = 0;
    state = makeState(slots);
    state.players[0].name = myName;
    state.players[0].human = true;
    state.players[0].connected = true;
    factionOrder = shuffle(FACTIONS.map(function (f) { return f.k; }));
    state.players[0].faction = nextFaction();
    $('lobbyForm').innerHTML = '';
    $('lobbyMsg').textContent = '正在建立戰局…';

    var code = genCode();
    peer = new Peer(code, { debug: 1 });
    peer.on('open', function () { renderHostLobby(code); });
    peer.on('connection', function (c) {
      c.on('data', function (d) { handleHostData(c, d); });
      c.on('close', function () { handleHostClose(c); });
      c.on('error', function () { handleHostClose(c); });
    });
    peer.on('error', function (err) {
      if (err.type === 'unavailable-id') alert('此邀請碼已被使用，請重整重試');
      else alert('連線錯誤：' + (err.type || 'unknown'));
      location.reload();
    });
  }

  function renderHostLobby(code) {
    $('lobbyTitle').textContent = '👑 戰局已建立';
    $('lobbyMsg').innerHTML = '邀請碼：<div class="room-code">' + code + '</div>將此碼傳給好友，電腦會自動補滿空缺';
    renderLobbyPlayers();
    $('lobbyForm').innerHTML =
      '<button class="btn" style="width:100%;margin-top:10px" onclick="hostStart()">🚀 開始遊戲（目前 ' + humansCount() + ' 人）</button>' +
      '<button class="btn ghost" style="width:100%;margin-top:8px" onclick="leaveGame()">取消</button>';
    setConn(true, '已連線（房主）');
  }

  function humansCount() {
    var n = 0;
    state.players.forEach(function (p) { if (p.human && p.connected) n++; });
    return n;
  }

  function renderLobbyPlayers() {
    var html = '';
    state.players.forEach(function (p, i) {
      if (!p.faction) return;
      var f = F(p.faction);
      var label = p.name + '（' + f.name + '）' + (p.human ? '' : ' 🤖 電腦');
      if (i === 0 && p.human) label += ' 👑 房主';
      html += '<div class="lobby-player-row" style="border-color:' + f.color + ';color:' + f.color + '">' + label + '</div>';
    });
    $('lobbyPlayers').innerHTML = html || '<p style="font-size:12px;color:rgba(255,255,255,0.35)">（尚無人加入）</p>';
  }

  function showJoinForm() {
    $('lobbyBtns').style.display = 'none';
    $('lobbyForm').innerHTML =
      '<input type="text" id="joinCode" maxlength="5" placeholder="邀請碼，如 ABC12" style="text-transform:uppercase">' +
      '<input type="text" id="joinName" maxlength="12" placeholder="你的稱號">' +
      '<button class="btn" style="width:100%;margin-top:10px" onclick="doJoin()">🚀 連線加入</button>';
    $('lobbyMsg').textContent = '輸入房主給你的 5 碼邀請碼';
  }

  function doJoin() {
    if (typeof Peer === 'undefined') { alert('無法載入連線模組（PeerJS），請檢查網路連線'); return; }
    var code = ($('joinCode').value || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{5}$/.test(code)) { alert('請輸入正確的 5 碼邀請碼'); return; }
    myName = $('joinName').value.trim() || '挑戰者';
    $('lobbyMsg').innerHTML = '正在連線 <span class="spinner"></span>';
    $('lobbyForm').innerHTML = '';
    peer = new Peer({ debug: 1 });
    peer.on('open', function () {
      clientConn = peer.connect(code, { reliable: true });
      clientConn.on('open', function () { clientConn.send({ type: 'join', name: myName }); });
      clientConn.on('data', function (d) { handleClientData(d); });
      clientConn.on('close', function () { if (started) $('dropOverlay').classList.add('show'); else { alert('連線已中斷'); location.reload(); } });
      clientConn.on('error', function () { alert('連線錯誤'); location.reload(); });
      setConn(true, '已連線');
    });
    peer.on('error', function (err) {
      alert('連線失敗：' + (err.type || 'unknown'));
      location.reload();
    });
  }

  /* ═══════ 房主資料處理 ═══════ */
  function handleHostData(c, data) {
    if (!data || !data.type) return;
    if (data.type === 'join') {
      var idx = -1;
      for (var i = 0; i < state.players.length; i++) if (!state.players[i].human) { idx = i; break; }
      if (idx === -1) { c.send({ type: 'err', msg: '戰局已滿' }); c.close(); return; }
      state.players[idx].name = data.name;
      state.players[idx].human = true;
      state.players[idx].connected = true;
      state.players[idx].faction = nextFaction();
      conns[idx] = c;
      broadcastLobby();
      return;
    }
    if (data.type === 'act') {
      if (!started || state.winner !== null) return;
      var idx2 = -1;
      for (var k in conns) if (conns[k] === c) idx2 = parseInt(k, 10);
      if (idx2 >= 0) applyAction(idx2, data.a);
      return;
    }
  }

  function handleHostClose(c) {
    var idx = -1;
    for (var k in conns) if (conns[k] === c) idx = parseInt(k, 10);
    if (idx < 0) return;
    delete conns[idx];
    state.players[idx].connected = false;
    if (started) {
      state.players[idx].human = false;
      state.log.push('📴 ' + nameOf(idx) + ' 斷線，改由電腦接管');
      if (state.turn === idx) { clearTimeout(aiTimer); advanceTurn(); }
      else broadcastState();
    } else {
      state.players[idx] = { name: '', faction: null, human: false, gold: 40, connected: false, alive: true };
      broadcastLobby();
    }
  }

  function broadcastLobby() {
    var list = state.players.map(function (p) {
      return { name: p.name, faction: p.faction, human: p.human };
    });
    for (var k in conns) {
      conns[k].send({ type: 'lobby', you: parseInt(k, 10), slots: state.slots, players: list, started: started });
    }
    renderLobbyPlayers();
  }

  /* ═══════ 玩家資料處理（加入者） ═══════ */
  function handleClientData(data) {
    if (!data || !data.type) return;
    if (data.type === 'lobby') {
      myIndex = data.you;
      $('lobbyTitle').textContent = '🔑 已加入戰局';
      $('lobbyMsg').textContent = data.started ? '戰局已開始！' : '等待房主開始遊戲…';
      var myF = data.players[myIndex] ? F(data.players[myIndex].faction) : null;
      $('lobbyPlayers').innerHTML = data.players.map(function (p) {
        if (!p.faction) return '';
        var f = F(p.faction);
        return '<div class="lobby-player-row" style="border-color:' + f.color + ';color:' + f.color + '">' +
          p.name + '（' + f.name + '）' + (p.human ? '' : ' 🤖 電腦') + (myIndex === data.players.indexOf(p) ? ' ← 你' : '') + '</div>';
      }).join('');
      $('lobbyForm').innerHTML = myF ? '<p style="font-size:14px">你的主公：<b style="color:' + myF.color + '">' + myF.name + '</b></p>' : '';
      return;
    }
    if (data.type === 'start') {
      state = data.state;
      started = true;
      endShown = false;
      selected = -1;
      hideLobby();
      render();
      return;
    }
    if (data.type === 'state') {
      if (!started) return;
      state = data.state;
      if (selected >= 0 && (state.turn !== myIndex || !state.players[myIndex].alive)) selected = -1;
      render();
      return;
    }
    if (data.type === 'err') alert(data.msg);
  }

  /* ═══════ 遊戲開始（房主） ═══════ */
  function hostStart() {
    if (started) return;
    started = true;
    state.players.forEach(function (p, i) {
      if (!p.faction) p.faction = nextFaction();
      if (!p.human) p.connected = true;
    });
    state.map = buildMap(state.slots);
    state.round = 1;
    state.players[0].gold += income(0);
    state.log.push('🔥 亂世開啟！' + nameOf(0) + ' 揭竿而起，' + state.slots + ' 路諸侯逐鹿中原！');
    hideLobby();
    var msg = { type: 'start', state: serialize() };
    for (var k in conns) conns[k].send(msg);
    render();
  }

  function buildMap(n) {
    var per = n <= 6 ? 5 : (n <= 9 ? 4 : 3);
    var rows = per, cols = n;
    var names = shuffle(CITY_POOL.slice());
    var map = [];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        map.push({
          name: names[(r * cols + c) % names.length],
          row: r, col: c,
          owner: c,
          army: 95 + Math.floor(Math.random() * 50)
        });
      }
    }
    return map;
  }

  /* ═══════ 行動與回合（房主權威） ═══════ */
  function doRecruit() {
    if (!isMyTurn() || selected < 0 || state.actions <= 0 || state.players[myIndex].gold < 10) return;
    sendAct({ a: 'recruit', id: selected });
  }
  function doRest() {
    if (!isMyTurn() || selected < 0 || state.actions <= 0) return;
    sendAct({ a: 'rest', id: selected });
  }
  function doEnd() {
    if (!isMyTurn()) return;
    sendAct({ a: 'end' });
  }
  function sendAct(a) {
    if (isHost) applyAction(0, a);
    else clientConn.send({ type: 'act', a: a });
  }

  function applyAction(me, a) {
    if (!started || state.winner !== null || state.turn !== me || !state.players[me].alive) return;
    var fname = F(state.players[me].faction).name;
    if (a.a === 'end') {
      state.log.push('———— ' + fname + ' 結束回合 ————');
      advanceTurn();
      return;
    }
    if (state.actions <= 0) return;
    if (a.a === 'recruit') {
      var t = state.map[a.id];
      if (!t || t.owner !== me || state.players[me].gold < 10) return;
      state.players[me].gold -= 10;
      t.army = Math.min(t.army + 25, MAX_ARMY);
      state.actions--;
      state.log.push('🔨 ' + fname + ' 於 ' + t.name + ' 徵兵 +25');
    } else if (a.a === 'rest') {
      var r = state.map[a.id];
      if (!r || r.owner !== me) return;
      r.army = Math.min(Math.round(r.army * 1.15), MAX_ARMY);
      state.actions--;
      state.log.push('🛡️ ' + fname + ' 於 ' + r.name + ' 整軍備戰');
    } else if (a.a === 'attack') {
      var s = state.map[a.sid], d = state.map[a.tid];
      if (!s || !d || s.owner !== me || d.owner === me) return;
      if (!neighborsOf(a.sid).some(function (n) { return state.map.indexOf(n) === a.tid; })) return;
      var aPow = s.army * (0.9 + Math.random() * 0.4) * (1 + 0.04 * (territoriesOf(me) - territoriesOf(d.owner)));
      var dPow = d.army * (0.85 + Math.random() * 0.4);
      if (aPow > dPow) {
        var rem = Math.max(1, Math.round(s.army * 0.7));
        d.owner = me;
        d.army = Math.min(rem, MAX_ARMY);
        s.army = Math.max(1, Math.round(s.army * 0.65));
        state.log.push('⚔️ ' + fname + ' 攻佔 ' + d.name + '！');
      } else {
        var sLoss = Math.max(1, Math.round(s.army * 0.4));
        var dLoss = Math.max(1, Math.round(d.army * 0.35));
        s.army -= sLoss;
        d.army -= dLoss;
        state.log.push('💥 ' + fname + ' 攻打 ' + d.name + ' 失利，損兵 ' + sLoss);
      }
      state.actions--;
      selected = -1;
    }
    recomputeAlive();
    broadcastState();
  }

  function recomputeAlive() {
    var aliveCount = 0, lastAlive = -1;
    state.players.forEach(function (p, i) {
      var c = territoriesOf(i);
      if (c === 0) {
        if (p.alive) { p.alive = false; state.log.push('☠️ ' + nameOf(i) + ' 滅亡！'); }
      } else { p.alive = true; aliveCount++; lastAlive = i; }
    });
    if (aliveCount <= 1) state.winner = lastAlive;
  }

  function advanceTurn() {
    recomputeAlive();
    if (state.winner !== null) { broadcastState(); return; }
    var n = state.slots, next = -1;
    for (var step = 1; step <= n; step++) {
      var idx = (state.turn + step) % n;
      if (state.players[idx].alive) { next = idx; break; }
    }
    if (next === -1) return;
    if (next === 0) state.round++;
    state.turn = next;
    state.actions = 3;
    state.players[next].gold += income(next);
    state.log.push('🎲 第 ' + state.round + ' 回合：' + nameOf(next) + ' 行動');
    if (!state.players[next].human) scheduleAI();
    else broadcastState();
  }

  function scheduleAI() {
    clearTimeout(aiTimer);
    aiTimer = setTimeout(function () {
      if (!started || state.winner !== null) return;
      var me = state.turn;
      if (state.players[me].human) return;
      aiTurn(me);
      recomputeAlive();
      if (state.winner !== null) { broadcastState(); return; }
      broadcastState();
      advanceTurn();
    }, 750);
  }

  function aiTurn(me) {
    var fname = F(state.players[me].faction).name;
    var mine = state.map.filter(function (t) { return t.owner === me; });
    var borders = mine.filter(function (t) {
      return neighborsOf(state.map.indexOf(t)).some(function (n) { return n.owner !== me; });
    });
    var spent = 0;
    for (var act = 0; act < 3 && spent < 3; act++) {
      var acted = false;
      var cands = [];
      borders.forEach(function (s) {
        if (s.army < 30) return;
        neighborsOf(state.map.indexOf(s)).forEach(function (n) {
          if (n.owner !== me && s.army >= n.army * 0.9) cands.push({ s: s, t: n });
        });
      });
      if (cands.length) {
        var pick = cands[Math.floor(Math.random() * cands.length)];
        var aPow = pick.s.army * (0.9 + Math.random() * 0.4) * (1 + 0.04 * (territoriesOf(me) - territoriesOf(pick.t.owner)));
        var dPow = pick.t.army * (0.85 + Math.random() * 0.4);
        if (aPow > dPow) {
          var rem = Math.max(1, Math.round(pick.s.army * 0.7));
          pick.t.owner = me;
          pick.t.army = Math.min(rem, MAX_ARMY);
          pick.s.army = Math.max(1, Math.round(pick.s.army * 0.65));
          state.log.push('⚔️ ' + fname + ' 攻佔 ' + pick.t.name + '！');
        } else {
          var sLoss = Math.max(1, Math.round(pick.s.army * 0.4));
          var dLoss = Math.max(1, Math.round(pick.t.army * 0.35));
          pick.s.army -= sLoss;
          pick.t.army -= dLoss;
          state.log.push('💥 ' + fname + ' 攻打 ' + pick.t.name + ' 失利');
        }
        spent++;
        acted = true;
      }
      if (state.players[me].gold >= 10 && spent < 3) {
        var weak = (borders.length ? borders : mine).slice().sort(function (a, b) { return a.army - b.army; })[0];
        if (weak) {
          state.players[me].gold -= 10;
          weak.army = Math.min(weak.army + 25, MAX_ARMY);
          state.log.push('🔨 ' + fname + ' 於 ' + weak.name + ' 徵兵 +25');
          spent++;
          acted = true;
        }
      }
      if (!acted) {
        var t = borders.length ? borders[0] : mine[0];
        if (t) {
          t.army = Math.min(Math.round(t.army * 1.12), MAX_ARMY);
          state.log.push('🛡️ ' + fname + ' 於 ' + t.name + ' 整軍備戰');
          spent++;
          break;
        }
      }
    }
  }

  function broadcastState() {
    if (!started) return;
    var msg = { type: 'state', state: serialize() };
    for (var k in conns) conns[k].send(msg);
    if (isHost) render();
  }

  /* ═══════ 序列化 ═══════ */
  function serialize() {
    return {
      slots: state.slots,
      round: state.round,
      turn: state.turn,
      actions: state.actions,
      winner: state.winner,
      players: state.players.map(function (p) {
        return { name: p.name, faction: p.faction, human: p.human, gold: p.gold, alive: p.alive };
      }),
      map: state.map.map(function (t) { return Object.assign({}, t); }),
      log: state.log.slice()
    };
  }

  function makeState(slots) {
    var ps = [];
    for (var i = 0; i < slots; i++) {
      ps.push({ name: '', faction: null, human: false, gold: 40, connected: false, alive: true });
    }
    return { slots: slots, round: 1, turn: 0, actions: 3, winner: null, players: ps, map: [], log: [] };
  }

  function nextFaction() { return factionOrder.length ? factionOrder.shift() : FACTIONS[state.players.length % FACTIONS.length].k; }

  /* ═══════ 渲染 ═══════ */
  function hideLobby() { $('lobbyOverlay').classList.remove('show'); }

  function render() {
    if (!state) return;
    var me = state.players[myIndex];
    var myF = F(me.faction);
    var total = state.map.length;

    $('statusBar').innerHTML =
      '<div class="stat">🏮 第 <b>' + state.round + '</b> 回合</div>' +
      '<div class="stat me">👑 ' + (isHost ? '你' : myName) + '（<span style="color:' + myF.color + '">' + myF.name + '</span>）</div>' +
      '<div class="stat">💰 <b>' + me.gold + '</b></div>' +
      '<div class="stat">🗺️ 領地 <b>' + territoriesOf(myIndex) + '</b>/' + total + '</div>' +
      '<div class="stat">🎯 行動 <b>' + state.actions + '</b></div>';

    $('playersStrip').innerHTML = state.players.map(function (p, i) {
      if (!p.faction) return '';
      var f = F(p.faction);
      var isTurn = state.turn === i && state.winner === null;
      var cls = 'chip' + (isTurn ? ' turn' : '');
      var style = 'border-color:' + f.color + ';color:' + f.color + ';opacity:' + (p.alive ? 1 : 0.35);
      return '<span class="' + cls + '" style="' + style + '">' +
        (isTurn ? '▶ ' : '') + (i === myIndex ? '你·' : '') + f.name +
        (p.human ? '' : ' 🤖') + (p.alive ? '' : ' ☠️') + '</span>';
    }).join('');

    var canAct = isMyTurn();
    $('btnRecruit').disabled = !canAct || selected < 0 || state.actions <= 0 || me.gold < 10;
    $('btnRest').disabled = !canAct || selected < 0 || state.actions <= 0;
    $('btnEnd').disabled = !canAct;

    var grid = $('mapGrid');
    grid.style.gridTemplateColumns = 'repeat(' + state.slots + ', 1fr)';
    var html = '';
    state.map.forEach(function (t, id) {
      var isMine = t.owner === myIndex;
      var f = F(state.players[t.owner].faction);
      var cls = 'territory' + (isMine ? ' mine' : ' dim');
      if (selected === id) cls += ' selected';
      var isTarget = false;
      if (selected >= 0 && !isMine && canAct) {
        if (neighborsOf(selected).some(function (n) { return state.map.indexOf(n) === id; })) isTarget = true;
      }
      if (isTarget) cls += ' target mine';
      html += '<div class="' + cls + '" style="border-color:' + f.color + '" onclick="clickTerritory(' + id + ')">' +
        '<div class="owner" style="color:' + f.color + '">' + f.name + '</div>' +
        '<div class="name">' + t.name + '</div>' +
        '<div class="army">⚔️ ' + t.army + '</div></div>';
    });
    grid.innerHTML = html;

    var hint = $('hint');
    if (state.winner !== null) hint.innerHTML = '';
    else if (!canAct) {
      var op = state.players[state.turn];
      var opF = F(op.faction);
      hint.innerHTML = '⏳ 等待 <b style="color:' + opF.color + '">' + nameOf(state.turn) + '</b> 行動' + (op.human ? '' : '（電腦思考中…）');
    } else if (selected < 0) {
      hint.innerHTML = '📢 點擊 <b style="color:#ffd866">我方領地</b> 選為據點，再徵兵或整軍；點擊 <b style="color:#ff9f43">發光敵方領地</b> 出征';
    } else {
      hint.innerHTML = '📍 據點：<b style="color:#ffd866">' + state.map[selected].name + '</b>（兵 ' + state.map[selected].army + '）';
    }

    var box = $('logBox');
    box.innerHTML = '';
    state.log.slice(-40).forEach(function (m) {
      var div = document.createElement('div');
      div.textContent = m;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;

    if (state.winner !== null && !endShown) {
      endShown = true;
      var won = state.winner === myIndex;
      $('endTitle').innerHTML = won ? '🏆 <span class="win-text">天下一統！</span>' : '☠️ <span class="lose-text">霸業傾頹…</span>';
      $('endMsg').textContent = won
        ? nameOf(myIndex) + '（' + myF.name + '）席捲八荒，贏得了這場亂世！'
        : nameOf(state.winner) + '（' + F(state.players[state.winner].faction).name + '）統一天下，下次再戰！';
      $('endOverlay').classList.add('show');
      if (won) window.shareScore && window.shareScore();
    }
  }

  function clickTerritory(id) {
    if (!isMyTurn()) return;
    var t = state.map[id];
    if (selected >= 0 && t.owner !== myIndex &&
        neighborsOf(selected).some(function (n) { return state.map.indexOf(n) === id; })) {
      sendAct({ a: 'attack', sid: selected, tid: id });
      return;
    }
    if (t.owner === myIndex) selected = (selected === id) ? -1 : id;
    render();
  }

  /* ═══════ 其他 ═══════ */
  function leaveGame() {
    clearTimeout(aiTimer);
    if (clientConn) clientConn.close();
    if (peer) peer.destroy();
    location.reload();
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  function genCode() {
    var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    var code = '';
    for (var i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  window.showCreateForm = showCreateForm;
  window.createRoom = createRoom;
  window.showJoinForm = showJoinForm;
  window.doJoin = doJoin;
  window.hostStart = hostStart;
  window.clickTerritory = clickTerritory;
  window.doRecruit = doRecruit;
  window.doRest = doRest;
  window.doEnd = doEnd;
  window.leaveGame = leaveGame;
  window.shareScore = function () {
    var msg = '🏯 三國志線上對戰 — 我用' + F(state.players[myIndex].faction).name + '在多人大亂戰中一統天下了！來挑戰我！';
    if (navigator.share) navigator.share({ title: '🏯 三國志線上對戰', text: msg, url: location.href });
  };
})();
</script>
