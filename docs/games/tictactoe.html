<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>圈圈叉叉 - Tic-Tac-Toe</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', Helvetica, Arial, sans-serif;
  background: linear-gradient(145deg, #0f0f13 0%, #1a1a2e 50%, #16213e 100%);
  color: #e0e0e0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
body { width: 100%; padding: 16px; }

.game-container {
  position: relative;
  max-width: 440px;
  width: 100%;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 32px;
  padding: 28px 24px 16px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.06);
}

/* Title */
.title {
  text-align: center;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 4px;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
  user-select: none;
}

/* Turn indicator */
.turn-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  font-size: 15px;
  font-weight: 500;
  color: rgba(255,255,255,0.6);
  user-select: none;
}
.turn-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 14px;
  border-radius: 100px;
  font-weight: 600;
  font-size: 15px;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.turn-badge.player-turn {
  background: rgba(255,190,30,0.18);
  color: #ffd866;
  border: 1px solid rgba(255,190,30,0.25);
}
.turn-badge.ai-turn {
  background: rgba(100,180,255,0.14);
  color: #7abfff;
  border: 1px solid rgba(100,180,255,0.2);
}
.turn-badge.game-over {
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.4);
  border: 1px solid rgba(255,255,255,0.08);
}

/* Scoreboard */
.scoreboard {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  user-select: none;
}
.score-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  border-radius: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  font-size: 14px;
  font-weight: 500;
}
.score-item .label { color: rgba(255,255,255,0.45); }
.score-item .value {
  min-width: 20px;
  text-align: center;
  font-weight: 700;
}
.score-item.win .value { color: #4ade80; }
.score-item.loss .value { color: #f87171; }
.score-item.draw .value { color: #94a3b8; }

/* Board */
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  aspect-ratio: 1;
  width: 100%;
  margin-bottom: 18px;
}

.cell {
  position: relative;
  background: rgba(255,255,255,0.04);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
  aspect-ratio: 1;
}
.cell:not(.taken):hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.12);
}
.cell:not(.taken):active { transform: scale(0.95); }
.cell.taken { cursor: default; }
.cell.disabled { cursor: default; pointer-events: none; }

/* X and O SVG drawings */
.cell svg {
  width: 55%;
  height: 55%;
  display: block;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}
.cell .x-svg { animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.cell .o-svg { animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* Winning highlight */
.cell.win-highlight {
  background: rgba(74, 222, 128, 0.15);
  border-color: rgba(74, 222, 128, 0.4);
  box-shadow: 0 0 20px rgba(74, 222, 128, 0.15);
}
.cell.win-highlight.o-win svg .o-circle {
  stroke: #4ade80;
}
.cell.win-highlight.x-win svg .x-line {
  stroke: #4ade80;
}

/* O circle */
.o-circle {
  fill: none;
  stroke: #ffd866;
  stroke-width: 8;
  stroke-linecap: round;
  stroke-dasharray: 283;
  stroke-dashoffset: 283;
  animation: drawCircle 0.4s ease-out 0.1s forwards;
}
@keyframes drawCircle {
  to { stroke-dashoffset: 0; }
}
/* X lines */
.x-line {
  fill: none;
  stroke: #7abfff;
  stroke-width: 8;
  stroke-linecap: round;
  stroke-dasharray: 170;
  stroke-dashoffset: 170;
}
.x-line-1 { animation: drawX1 0.3s ease-out 0.05s forwards; }
.x-line-2 { animation: drawX2 0.3s ease-out 0.15s forwards; }
@keyframes drawX1 { to { stroke-dashoffset: 0; } }
@keyframes drawX2 { to { stroke-dashoffset: 0; } }

/* Overlay for game over */
.overlay {
  position: absolute;
  inset: 0;
  border-radius: 32px;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  z-index: 10;
  padding: 24px;
}
.overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.overlay-text {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
  user-select: none;
}
.overlay-sub {
  font-size: 16px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 24px;
  user-select: none;
}
.overlay-text.win-text { color: #4ade80; }
.overlay-text.lose-text { color: #f87171; }
.overlay-text.draw-text { color: #94a3b8; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 32px;
  border: none;
  border-radius: 100px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn:active { transform: scale(0.94); }

.btn-primary {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1a1a2e;
  box-shadow: 0 4px 20px rgba(247,151,30,0.3);
}
.btn-primary:hover { box-shadow: 0 6px 28px rgba(247,151,30,0.45); transform: translateY(-1px); }
.btn-primary:active { transform: scale(0.94) translateY(0); }

.btn-secondary {
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.7);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-secondary:hover { background: rgba(255,255,255,0.1); color: #fff; }

/* Bottom actions */
.actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 4px;
}

/* Footer */
.footer {
  text-align: center;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.footer a {
  color: rgba(255,255,255,0.3);
  text-decoration: none;
  font-size: 13px;
  transition: color 0.2s;
}
.footer a:hover { color: rgba(255,255,255,0.6); }

/* Prevent double-tap zoom on mobile */
@media (pointer: coarse) {
  .cell:not(.taken):hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.06); }
}

@media (max-width: 480px) {
  .game-container { padding: 20px 16px 14px; }
  .title { font-size: 24px; }
  .score-item { padding: 4px 12px; font-size: 13px; }
  .turn-bar { font-size: 13px; margin-bottom: 14px; }
  .board { gap: 6px; }
  .cell { border-radius: 12px; }
  .overlay-text { font-size: 26px; }
  .btn { padding: 10px 24px; font-size: 14px; }
}

@media (max-width: 360px) {
  .game-container { padding: 14px 10px 10px; }
  .title { font-size: 20px; }
  .score-item { padding: 3px 8px; font-size: 12px; }
}
</style>
</head>
<body>

<div class="game-container" id="app">
  <div class="title">圈圈叉叉</div>

  <div class="turn-bar">
    <span id="turnLabel">換你下棋</span>
    <span class="turn-badge player-turn" id="turnBadge">● O</span>
  </div>

  <div class="scoreboard">
    <div class="score-item win">
      <span class="label">勝</span>
      <span class="value" id="winCount">0</span>
    </div>
    <div class="score-item loss">
      <span class="label">敗</span>
      <span class="value" id="lossCount">0</span>
    </div>
    <div class="score-item draw">
      <span class="label">平</span>
      <span class="value" id="drawCount">0</span>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="overlay" id="overlay">
    <div class="overlay-text" id="overlayText"></div>
    <div class="overlay-sub" id="overlaySub"></div>
    <button class="btn btn-primary" id="playAgainBtn">再玩一局</button>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" id="resetBtn">重新開始</button>
  </div>

  <div class="footer">
    <a href="../games/">← 返回遊戲大廳</a>
  </div>
</div>

<script>
(function() {
  'use strict';

  // DOM refs
  const boardEl = document.getElementById('board');
  const turnLabel = document.getElementById('turnLabel');
  const turnBadge = document.getElementById('turnBadge');
  const winCountEl = document.getElementById('winCount');
  const lossCountEl = document.getElementById('lossCount');
  const drawCountEl = document.getElementById('drawCount');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const overlaySub = document.getElementById('overlaySub');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const resetBtn = document.getElementById('resetBtn');

  // State
  let board = Array(9).fill(null);
  let gameActive = true;
  let playerSymbol = 'O';
  let aiSymbol = 'X';
  let currentTurn = 'player'; // 'player' | 'ai' | 'over'
  let scores = { win: 0, loss: 0, draw: 0 };
  let winningLine = null;
  let isProcessing = false;

  // --- SVG generators ---

  function createXSVG() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('class', 'x-svg');
    svg.innerHTML =
      '<line class="x-line x-line-1" x1="20" y1="20" x2="80" y2="80"/>' +
      '<line class="x-line x-line-2" x1="80" y1="20" x2="20" y2="80"/>';
    return svg;
  }

  function createOSVG() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('class', 'o-svg');
    svg.innerHTML =
      '<circle class="o-circle" cx="50" cy="50" r="38"/>';
    return svg;
  }

  // --- Board rendering ---

  function renderBoard() {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;

      const mark = board[i];
      if (mark) {
        cell.classList.add('taken');
        if (mark === 'X') {
          cell.appendChild(createXSVG());
        } else {
          cell.appendChild(createOSVG());
        }
      }

      if (!gameActive || currentTurn === 'ai' || mark || isProcessing) {
        cell.classList.add('disabled');
      }

      cell.addEventListener('click', () => handleCellClick(i));
      boardEl.appendChild(cell);
    }

    // Apply winning highlights
    if (winningLine) {
      const cells = boardEl.children;
      for (const idx of winningLine) {
        cells[idx].classList.add('win-highlight');
        if (board[idx] === 'X') cells[idx].classList.add('x-win');
        else cells[idx].classList.add('o-win');
      }
    }
  }

  // --- Game logic ---

  function checkWinner(boardArr) {
    const lines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];
    for (const line of lines) {
      const [a,b,c] = line;
      if (boardArr[a] && boardArr[a] === boardArr[b] && boardArr[a] === boardArr[c]) {
        return { winner: boardArr[a], line };
      }
    }
    return null;
  }

  function isBoardFull(boardArr) {
    return boardArr.every(c => c !== null);
  }

  function getAvailableMoves(boardArr) {
    const moves = [];
    for (let i = 0; i < 9; i++) {
      if (boardArr[i] === null) moves.push(i);
    }
    return moves;
  }

  // --- Minimax (unbeatable) ---

  function minimax(boardArr, depth, isMaximizing) {
    const result = checkWinner(boardArr);
    if (result) {
      if (result.winner === aiSymbol) return 10 - depth;
      if (result.winner === playerSymbol) return depth - 10;
    }
    if (isBoardFull(boardArr)) return 0;

    const moves = getAvailableMoves(boardArr);
    if (isMaximizing) {
      let best = -Infinity;
      for (const i of moves) {
        boardArr[i] = aiSymbol;
        const val = minimax(boardArr, depth + 1, false);
        boardArr[i] = null;
        if (val > best) best = val;
      }
      return best;
    } else {
      let best = Infinity;
      for (const i of moves) {
        boardArr[i] = playerSymbol;
        const val = minimax(boardArr, depth + 1, true);
        boardArr[i] = null;
        if (val < best) best = val;
      }
      return best;
    }
  }

  function getBestMove() {
    let bestScore = -Infinity;
    let bestMove = -1;
    const boardCopy = [...board];
    const moves = getAvailableMoves(boardCopy);
    for (const i of moves) {
      boardCopy[i] = aiSymbol;
      const score = minimax(boardCopy, 0, false);
      boardCopy[i] = null;
      if (score > bestScore) {
        bestScore = score;
        bestMove = i;
      }
    }
    return bestMove;
  }

  // --- Turn management ---

  function handleCellClick(index) {
    if (!gameActive) return;
    if (currentTurn !== 'player') return;
    if (board[index] !== null) return;
    if (isProcessing) return;

    makePlayerMove(index);
  }

  function makePlayerMove(index) {
    isProcessing = true;
    board[index] = playerSymbol;
    renderBoard();

    const result = checkWinner(board);
    if (result) {
      endGame(result);
      isProcessing = false;
      return;
    }

    if (isBoardFull(board)) {
      endGame(null);
      isProcessing = false;
      return;
    }

    currentTurn = 'ai';
    updateTurnUI();
    renderBoard();

    // Small delay before AI moves
    setTimeout(() => {
      makeAIMove();
    }, 350);
  }

  function makeAIMove() {
    if (!gameActive) { isProcessing = false; return; }
    if (currentTurn !== 'ai') { isProcessing = false; return; }

    const move = getBestMove();
    if (move === -1) {
      // Shouldn't happen if game is active, but safety
      if (isBoardFull(board)) {
        endGame(null);
      }
      isProcessing = false;
      return;
    }

    board[move] = aiSymbol;
    renderBoard();

    const result = checkWinner(board);
    if (result) {
      endGame(result);
      isProcessing = false;
      return;
    }

    if (isBoardFull(board)) {
      endGame(null);
      isProcessing = false;
      return;
    }

    currentTurn = 'player';
    updateTurnUI();
    renderBoard();
    isProcessing = false;
  }

  function endGame(result) {
    gameActive = false;
    currentTurn = 'over';

    if (result) {
      winningLine = result.line;
      if (result.winner === playerSymbol) {
        // Player wins (O)
        scores.win++;
        showOverlay('你贏了！', '恭喜你擊敗了 AI 🎉', 'win-text');
      } else {
        // AI wins (X)
        scores.loss++;
        showOverlay('你輸了！', 'AI 獲勝，再接再厲', 'lose-text');
      }
    } else {
      scores.draw++;
      showOverlay('平局！', '勢均力敵', 'draw-text');
    }

    updateScoreUI();
    renderBoard();
    updateTurnUI();
  }

  // --- UI updates ---

  function updateTurnUI() {
    if (currentTurn === 'player') {
      turnLabel.textContent = '換你下棋';
      turnBadge.className = 'turn-badge player-turn';
      turnBadge.innerHTML = '● O';
    } else if (currentTurn === 'ai') {
      turnLabel.textContent = 'AI 思考中...';
      turnBadge.className = 'turn-badge ai-turn';
      turnBadge.innerHTML = '✕ X';
    } else {
      turnLabel.textContent = '遊戲結束';
      turnBadge.className = 'turn-badge game-over';
      turnBadge.innerHTML = '—';
    }
  }

  function updateScoreUI() {
    winCountEl.textContent = scores.win;
    lossCountEl.textContent = scores.loss;
    drawCountEl.textContent = scores.draw;
  }

  function showOverlay(text, sub, cls) {
    overlayText.textContent = text;
    overlayText.className = 'overlay-text ' + cls;
    overlaySub.textContent = sub;
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  // --- Game control ---

  function resetGame(keepScores = true) {
    isProcessing = false;
    hideOverlay();
    board = Array(9).fill(null);
    gameActive = true;
    winningLine = null;
    currentTurn = 'player';
    if (!keepScores) {
      scores = { win: 0, loss: 0, draw: 0 };
      updateScoreUI();
    }
    updateTurnUI();
    renderBoard();
  }

  function newGame() {
    resetGame(true);
  }

  function fullReset() {
    resetGame(false);
  }

  // --- Init ---

  function init() {
    resetGame(false);
  }

  // Event listeners
  playAgainBtn.addEventListener('click', newGame);
  resetBtn.addEventListener('click', fullReset);

  init();

})();
</script>
</body>
</html>
