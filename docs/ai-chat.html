<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #0a0e27; color: #fff;
  height: 100vh; display: flex; flex-direction: column;
}
.header {
  background: linear-gradient(135deg, #0a0e27, #1a1f3a);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  padding: 1rem 2rem;
  display: flex; align-items: center; gap: 1rem;
}
.header h1 {
  font-size: 1.2rem;
  background: linear-gradient(135deg, #00d4ff, #7b68ee);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header .badge {
  background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.3);
  color: #00d4ff; padding: 0.2rem 0.8rem; border-radius: 20px;
  font-size: 0.75rem;
}
.chat-container {
  flex: 1; display: flex; flex-direction: column;
  max-width: 800px; margin: 0 auto; width: 100%;
}
.chat-messages {
  flex: 1; overflow-y: auto; padding: 1.5rem;
  display: flex; flex-direction: column; gap: 1rem;
}
.chat-msg {
  max-width: 80%; padding: 1rem 1.2rem; border-radius: 16px;
  line-height: 1.6; font-size: 0.95rem;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.chat-msg.ai {
  align-self: flex-start;
  background: rgba(123,104,238,0.12); border: 1px solid rgba(123,104,238,0.2);
  border-bottom-left-radius: 4px;
}
.chat-msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #00d4ff, #7b68ee);
  border-bottom-right-radius: 4px;
}
.chat-msg .label {
  font-size: 0.75rem; color: rgba(255,255,255,0.35); margin-bottom: 0.4rem;
}
.chat-msg .time {
  font-size: 0.7rem; color: rgba(255,255,255,0.25); margin-top: 0.4rem; text-align: right;
}
.suggestions {
  display: flex; gap: 0.5rem; padding: 0.5rem 1.5rem;
  flex-wrap: wrap; justify-content: center;
}
.suggestions button {
  padding: 0.5rem 1.2rem; border-radius: 20px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.6); font-size: 0.85rem; cursor: pointer;
  transition: all 0.2s;
}
.suggestions button:hover { background: rgba(0,212,255,0.15); border-color: #00d4ff; color: #fff; }
.chat-input {
  display: flex; gap: 0.5rem; padding: 1rem 1.5rem;
  background: rgba(255,255,255,0.02); border-top: 1px solid rgba(255,255,255,0.05);
}
.chat-input input {
  flex: 1; padding: 0.8rem 1.2rem; border-radius: 12px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: #fff; font-size: 1rem; outline: none;
}
.chat-input input:focus { border-color: #00d4ff; }
.chat-input input::placeholder { color: rgba(255,255,255,0.2); }
.chat-input button {
  padding: 0.8rem 1.5rem; border-radius: 12px;
  background: linear-gradient(135deg, #00d4ff, #7b68ee);
  color: #fff; border: none; cursor: pointer; font-size: 1rem;
}
.footer-bar {
  text-align: center; padding: 0.8rem;
  background: rgba(255,255,255,0.02); border-top: 1px solid rgba(255,255,255,0.05);
  font-size: 0.8rem; color: rgba(255,255,255,0.3);
}
.footer-bar a { color: #00d4ff; text-decoration: none; }
@media (max-width: 600px) {
  .chat-msg { max-width: 90%; font-size: 0.9rem; }
  .header h1 { font-size: 1rem; }
}
</style>

<body>

function send(msg) {
  const input = document.getElementById('chatInput');
  const text = msg || input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg(text, 'user');
  setTimeout(() => {
    const reply = getReply(text);
    addMsg(reply, 'ai');
  }, 500 + Math.random() * 500);
}

function addMsg(text, role) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `chat-msg ${role}`;
  const now = new Date();
  const t = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  if (role === 'ai') {
    div.innerHTML = `<div class="label">🤖 AI 智能客服</div>${text.replace(/\n/g, '<br>')}<div class="time">${t}</div>`;
  } else {
    div.innerHTML = `${text.replace(/\n/g, '<br>')}<div class="time">${t}</div>`;
  }
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function getReply(text) {
  const lower = text.toLowerCase();
  for (const item of KB) {
    for (const kw of item.kw) {
      if (lower.includes(kw)) return item.reply;
    }
  }
  const fallbacks = [
    '感謝您的提問！建議查看我們的 Telegram 頻道 https://t.me/+QgAyWlVyIxFjNmRl 獲取更多資訊，或留下 Email 我們會詳細回覆！',
    '您的問題已記錄！請加入 Telegram 頻道 https://t.me/+QgAyWlVyIxFjNmRl 與我們即時交流。',
    '好問題！我們涵蓋 AI 客服、內容生成、知識庫管理等功能。請問您想了解哪個面向？'
  ];
  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

document.addEventListener('DOMContentLoaded', () => {
  addMsg('你好！我是翔川 Neo｜曜科技 AI 智能客服 🤖\n\n我可以幫助你了解我們的 AI 行銷解決方案。試試點擊上方建議問題，或直接輸入你的問題！', 'ai');
});
</script>
