<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>開放資料後台｜翔川 Neo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0a0e27;color:#fff;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:28px 18px}
h1{font-size:22px;margin-bottom:6px}
.muted{color:#94a3b8;font-size:14px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:18px;margin-top:16px}
label{display:block;margin:10px 0 6px;font-size:14px;color:#cbd5e1}
input[type=number]{background:#161b3d;border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#fff;padding:10px 12px;font-size:15px}
button{background:linear-gradient(135deg,#0d9488,#14b8a6);border:none;color:#042f2e;font-weight:700;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
.s{background:rgba(255,255,255,.04);border-radius:10px;padding:12px}
.s .num{font-size:20px;font-weight:800;color:#5eead4}.s .lbl{font-size:12px;color:#94a3b8}
.ok{color:#34d399}.fail{color:#f87171}
a{color:#5eead4}
</style>
</head>
<body>
<div class="wrap">
  <h1>政府開放資料後台</h1>
  <div class="muted">data.gov.tw 全目錄自動爬取與資料集匯入控制</div>

  <div class="card">
    <label>資料集詮釋資料同步（每頁 100 筆，全目錄約 52,000 筆 → 500 頁跑完即全量）</label>
    <div style="display:flex;gap:10px;align-items:center">
      <input type="number" id="pages" value="150" min="1" max="2000">
      <button onclick="sync()">立即同步</button>
      <span class="muted" id="syncout"></span>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:10px">常見維運</h3>
    <ul style="margin-left:20px;line-height:2;font-size:14px;color:#cbd5e1">
      <li>每日自動同步在排程器掛勾（scheduler），無需手動。</li>
      <li>公開頁：<a href="/govdata">/govdata</a>（搜尋＋匯入＋分析＋AI 問答）</li>
      <li>個資注意：本功能僅處理「開放資料」統計層級，不含身份證字號等個資。</li>
    </ul>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const api=(p,o)=>fetch(p,o).then(r=>r.json());
async function refresh(){ try{const d=await api("/api/govdata/status");
  $("#stats").innerHTML=[["目錄",d.catalog_total],["已匯入",d.ingested],["存放列",d.rows_stored],["失敗",d.failed]].map(([l,n])=>`<div class="s"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join("");
  if(d.top_orgs&&d.top_orgs.length){ $("#stats").insertAdjacentHTML("beforeend",`<div class="s" style="grid-column:span 3"><div class="lbl">提供單位 TOP：${d.top_orgs.map((o,i)=>`<span class="pill" style="display:inline-block;margin:2px">${i+1}. ${o.agency} (${o.c})</span>`).join("")}</div></div>`);}
  if(d.top_formats&&d.top_formats.length){ $("#stats").insertAdjacentHTML("beforeend",`<div class="s" style="grid-column:span 3"><div class="lbl">格式分布：${d.top_formats.map(f=>`${f.fmt}×${f.count}`).join("、")}</div></div>`);}
}catch(e){} }
async function sync(){ const p=$("#pages").value||150; $("button").disabled=true; $("#syncout").textContent="同步中…";
  const d=await api("/api/govdata/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pages:Number(p)})});
  $("#syncout").textContent=`完成：${d.fetched} 筆同步，${d.upserted} 筆更新（${d.pages} 頁）`;
  $("button").disabled=false; refresh();
}
refresh();
</script>
</body>
</html>
