<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流量分析 — 翔川 Neo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:#0a0e27;color:#e8ecf4;line-height:1.6;
  -webkit-font-smoothing:antialiased;padding:2rem
}
.header{text-align:center;margin-bottom:2rem}
.header h1{font-size:clamp(24px,3vw,36px);font-weight:800;background:linear-gradient(135deg,#7b68ee,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:rgba(255,255,255,.3);margin-top:.3rem;font-size:14px}
.controls{display:flex;gap:.5rem;justify-content:center;margin-bottom:2rem;flex-wrap:wrap}
.controls button{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4);
  padding:.4rem 1rem;border-radius:6px;font-size:12px;cursor:pointer;transition:all .2s
}
.controls button.active{background:rgba(123,104,238,.15);border-color:rgba(123,104,238,.3);color:#fff}
.controls button:hover{border-color:rgba(123,104,238,.3);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;max-width:1000px;margin:0 auto}
.card{
  background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.05);
  border-radius:12px;padding:1.3rem
}
.card h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.3);margin-bottom:.8rem}
.stat-row{display:flex;justify-content:space-between;padding:.35rem 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.02)}
.stat-row:last-child{border-bottom:none}
.stat-row .label{color:rgba(255,255,255,.5)}
.stat-row .val{color:#e8ecf4;font-weight:500}
.stat-big{text-align:center;padding:.5rem 0}
.stat-big .num{font-size:clamp(32px,4vw,56px);font-weight:800;background:linear-gradient(135deg,#00d4ff,#7b68ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-big .desc{font-size:11px;color:rgba(255,255,255,.3);margin-top:2px}
.bar-wrapper{display:flex;align-items:center;gap:.5rem;padding:.2rem 0}
.bar-wrapper .label{font-size:12px;color:rgba(255,255,255,.5);min-width:80px;text-align:right}
.bar-wrapper .bar-bg{flex:1;height:18px;background:rgba(255,255,255,.03);border-radius:4px;overflow:hidden}
.bar-wrapper .bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#7b68ee,#00d4ff);transition:width .6s ease}
.bar-wrapper .bar-val{font-size:11px;color:rgba(255,255,255,.3);min-width:30px}
.refresh-note{text-align:center;margin-top:2rem;font-size:10px;color:rgba(255,255,255,.12)}
.loading{text-align:center;padding:3rem;color:rgba(255,255,255,.2);font-size:14px}
a{color:#7b68ee;text-decoration:none}
a:hover{color:#00d4ff}
@media(prefers-color-scheme:light){
  body{background:#f5f5fa;color:#1a1a2e}
  .card{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.06)}
  .stat-row .val{color:#1a1a2e}
  .bar-wrapper .bar-bg{background:rgba(0,0,0,.04)}
  .header p{color:rgba(0,0,0,.3)}
}
</style>
</head>
<body>
<div class="header">
  <h1>📊 流量分析</h1>
  <p><a href="../">← 回首頁</a></p>
  <div class="controls">
    <button data-since="24" class="active">24 小時</button>
    <button data-since="168">7 天</button>
    <button data-since="720">30 天</button>
    <button onclick="location.reload()">🔄 重新整理</button>
  </div>
</div>
<div class="grid" id="dashboard"><div class="loading">載入中...</div></div>
<p class="refresh-note">自動每 60 秒更新 · 資料來自 Render API</p>
<script>
var BASE=location.hostname.includes('github.io')?'https://lewislunora.onrender.com':'';
var since=24;

document.querySelectorAll('.controls button[data-since]').forEach(function(btn){
  btn.onclick=function(){
    document.querySelectorAll('.controls button[data-since]').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    since=parseInt(btn.dataset.since);
    loadData();
  };
});

function loadData(){
  var grid=document.getElementById('dashboard');
  grid.innerHTML='<div class="loading">載入中...</div>';
  fetch(BASE+'/api/analytics/summary?since='+since).then(function(r){return r.json()}).then(function(d){
    var maxPage=0;
    d.pages.forEach(function(p){if(p.cnt>maxPage)maxPage=p.cnt});
    var maxHr=0;
    d.hourly.forEach(function(h){if(h.cnt>maxHr)maxHr=h.cnt});

    var pagesHtml=d.pages.map(function(p){
      var pct=maxPage>0?(p.cnt/maxPage*100):0;
      return '<div class="bar-wrapper">'+
        '<span class="label">'+(p.page.slice(0,25)||'/')+'</span>'+
        '<div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
        '<span class="bar-val">'+p.cnt+'</span>'+
      '</div>';
    }).join('')||'<div style="color:rgba(255,255,255,.2);font-size:13px">暫無數據</div>';

    var hrHtml=d.hourly.map(function(h){
      var pct=maxHr>0?(h.cnt/maxHr*100):0;
      return '<div class="bar-wrapper">'+
        '<span class="label">'+h.hr+':00</span>'+
        '<div class="bar-bg"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
        '<span class="bar-val">'+h.cnt+'</span>'+
      '</div>';
    }).join('')||'<div style="color:rgba(255,255,255,.2);font-size:13px">暫無數據</div>';

    grid.innerHTML=
      '<div class="card">'+
        '<div class="stat-big"><div class="num">'+d.total+'</div><div class="desc">過去 '+since+' 小時瀏覽次數</div></div>'+
        '<div class="stat-big" style="border-top:1px solid rgba(255,255,255,.03);margin-top:.5rem;padding-top:.8rem"><div class="num" style="font-size:clamp(20px,2.5vw,32px)">'+d.total_all+'</div><div class="desc">累計瀏覽次數</div></div>'+
      '</div>'+
      '<div class="card">'+
        '<h3>🌍 國家 / 地區</h3>'+
        d.countries.map(function(c){return '<div class="stat-row"><span class="label">'+c.country+'</span><span class="val">'+c.cnt+'</span></div>'}).join('')+
      '</div>'+
      '<div class="card">'+
        '<h3>📄 熱門頁面</h3>'+pagesHtml+
      '</div>'+
      '<div class="card">'+
        '<h3>⏰ 每小時分布</h3>'+hrHtml+
      '</div>'+
      '<div class="card" style="grid-column:1/-1">'+
        '<h3>🔗 來源</h3>'+
        (d.referrers.length?d.referrers.map(function(r){
          return '<div class="stat-row"><span class="label">'+(r.referrer||'直接訪問')+'</span><span class="val">'+r.cnt+'</span></div>';
        }).join(''):'<div style="color:rgba(255,255,255,.2);font-size:13px">暫無數據</div>')+
      '</div>';
  }).catch(function(){
    grid.innerHTML='<div class="card" style="text-align:center;padding:3rem"><div style="font-size:2rem;opacity:.3">📡</div><p style="color:rgba(255,255,255,.3);margin-top:.5rem">無法連線到伺服器<br><button onclick="loadData()" style="margin-top:.8rem;padding:.3rem .8rem;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.4);cursor:pointer">重試</button></p></div>';
  });
}

loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
