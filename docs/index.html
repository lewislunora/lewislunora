.card .arrow {

  background: linear-gradient(135deg, #00d4ff, #7b68ee);
  padding: 0.5rem 1.5rem; border-radius: 10px;

.lang-select {

  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff; padding: 0.4rem 0.8rem; border-radius: 6px;
  font-size: 0.85rem; cursor: pointer;
}
.footer-text {
  margin-top: 3rem; color: rgba(255,255,255,0.2); font-size: 0.8rem;
}
@media (max-width: 650px) {
  .card { width: 100%; max-width: 350px; }

</style>
</head>
<body>

    <div class="arrow" data-i18n="card_char_btn">開始體驗 →</div>

  <a href="ai-fate.html" class="card">

<div class="footer-text" data-i18n="footer_copy">© 2026 翔川 Neo｜曜科技 |Ai_bot</div>

<script>
let currentLang = 'zh-TW';
const LANG = {
  en: {
    page_title: 'XiangChuan Neo｜YaoTech |Ai_bot',
    brand_name: 'XiangChuan Neo｜YaoTech |Ai_bot',
    tagline: 'AI Customer Service · Auto Content · Brand App<br>One-Stop AI Marketing Solution',
    card_product_title: 'Product',
    card_product_desc: 'AI service plans, pricing, live demo, features<br>See what we can do for you',
    card_product_btn: 'Learn More →',
    card_app_title: 'Brand Content App',
    card_app_desc: '133 AI-generated contents<br>Articles · Guides · AI Dramas',
    card_app_btn: 'Open App →',
    card_char_title: 'AI Virtual Character',
    card_char_desc: 'Interactive AI virtual character<br>Live chat · Emotional response',
    card_char_btn: 'Try Now →',
    card_fate_title: 'AI Fortune Analysis',
    card_fate_desc: 'AI Chinese astrology analysis<br>Name suggestions · Fortune prediction',
    card_fate_btn: 'Analyze →',
    footer_copy: '© 2026 XiangChuan Neo｜YaoTech |Ai_bot',
    lang_zt: '繁體中文',
    lang_cn: '簡體中文',
    lang_en: 'English'
  },
  'zh-CN': {
    page_title: '翔川 Neo｜曜科技 |Ai_bot',
    brand_name: '翔川 Neo｜曜科技 |Ai_bot',
    tagline: 'AI 智能客服 · 自动内容生成 · 品牌 App<br>一站式 AI 营销解决方案',
    card_product_title: '商品介绍',
    card_product_desc: 'AI 客服方案、价格、即时展示、功能特色<br>了解我们能为你做什么',
    card_product_btn: '查看更多 →',
    card_app_title: '品牌内容 App',
    card_app_desc: '133 篇 AI 生成内容<br>品牌文章 · 攻略教学 · AI 短剧',
    card_app_btn: '开启 App →',
    card_char_title: 'AI 虚拟助手',
    card_char_desc: '互动式 AI 虚拟角色<br>即时对话 · 情感回应',
    card_char_btn: '开始体验 →',
    card_fate_title: 'AI 命理分析',
    card_fate_desc: 'AI 智慧八字分析<br>命名建议 · 运势预测',
    card_fate_btn: '开始分析 →',
    footer_copy: '© 2026 翔川 Neo｜曜科技 |Ai_bot',
    lang_zt: '繁體中文',
    lang_cn: '簡體中文',
    lang_en: 'English'
  }
};

function switchLang(val) {
  if (val === 'zh-TW') { location.reload(); return; }
  const t = LANG[val];
  if (!t) return;
  document.documentElement.lang = val;
  document.title = t.page_title || document.title;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key]) {
      if (key === 'tagline' || key.endsWith('_desc')) {
        el.innerHTML = t[key];
      } else {
        el.textContent = t[key];
      }
    }
  });
}
</script>
</body>
