<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 / 註冊 | 翔川 Neo</title>
<meta name="description" content="登入或註冊翔川 Neo 帳號，兌換開通碼、升級 PRO 解鎖無限 AI 創作。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",system-ui,sans-serif;background:#0a0e27;color:#e6e6e6;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{max-width:420px;width:100%;padding:2rem}
.card{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid rgba(0,212,255,.13);border-radius:16px;padding:2rem 1.6rem}
h1{font-size:1.4rem;color:#fff;text-align:center;margin-bottom:.3rem}
.sub{text-align:center;color:rgba(255,255,255,.5);font-size:.88rem;margin-bottom:1.8rem}
label{display:block;font-size:.85rem;color:rgba(255,255,255,.6);margin:1rem 0 .35rem}
input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(0,212,255,.3);color:#fff;border-radius:10px;padding:.75rem .9rem;font-size:.95rem}
input:focus{outline:none;border-color:#00d4ff}
.btn{display:block;width:100%;text-align:center;background:linear-gradient(135deg,#00d4ff,#ff7b9c);color:#0a0e27;font-weight:800;border:none;padding:.8rem;border-radius:11px;font-size:1rem;cursor:pointer;margin-top:1.4rem;transition:transform .18s}
.btn:hover{transform:translateY(-2px)}
.switch{text-align:center;font-size:.86rem;color:rgba(255,255,255,.5);margin-top:1.2rem}
.switch a{color:#00d4ff;text-decoration:none;font-weight:700;cursor:pointer}
.msg{text-align:center;font-size:.86rem;margin-top:1rem;min-height:1.4em}
.err{color:#ff8a8a}.ok{color:#7dffb0}
.back{display:block;text-align:center;color:#00d4ff;text-decoration:none;font-size:.83rem;margin-top:1.4rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>翔川 Neo 會員</h1>
    <div class="sub" id="cardSub">登入以兌換開通碼、升級方案</div>

    <div style="display:none;border:1px solid rgba(0,212,255,.25);background:rgba(0,212,255,.06);border-radius:12px;padding:.9rem 1.1rem;font-size:.85rem;margin-bottom:1rem;color:#9fe8ff" id="noticeBox">
      📢 已登入！點「兌換開通碼」帶你的開通碼過來。
    </div>

    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <label>密碼</label>
    <input type="password" id="password" placeholder="至少 6 字" autocomplete="current-password">
    <button class="btn" id="goBtn">登入</button>
    <div class="switch">沒有帳號？<a id="toggle" onclick="toggleMode()">切換到註冊</a></div>
    <div class="msg" id="msg"></div>
    <a class="back" href="pricing.html#activate">← 返回兌換開通碼</a>
  </div>
</div>

<script>
const API = 'https://lewislunora.onrender.com/api';
let mode = 'login';
const $ = id => document.getElementById(id);

function toggleMode(){
  mode = (mode==='login') ? 'register' : 'login';
  $('goBtn').textContent = mode==='login' ? '登入' : '註冊並登入';
  $('cardSub').textContent = mode==='login' ? '登入以兌換開通碼、升級方案' : '註冊一個免費帳號（註冊即登入）';
  $('toggle').textContent = mode==='login' ? '切換到註冊' : '切換到登入';
  $('toggle').parentElement.textContent = mode==='login' ? '沒有帳號？' : '已有帳號？';
  $('toggle').parentElement.appendChild($('toggle'));
  $('msg').textContent='';
}

$('goBtn').onclick = async () => {
  const email = $('email').value.trim(), password = $('password').value;
  if(!email || password.length<6){ $('msg').className='msg err'; $('msg').textContent='請填 Email，密碼至少 6 字'; return; }
  const ep = mode==='login' ? '/auth/login' : '/auth/register';
  $('msg').className='msg'; $('msg').textContent='處理中…';
  try{
    const r = await fetch(API+ep, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password}), credentials:'include'});
    const d = await r.json();
    if(r.ok || d.token){
      document.cookie='token='+(d.token||'')+';path=/;max-age=7776000;SameSite=Lax';
      $('msg').className='msg ok';
      $('msg').textContent = mode==='register' ? '✅ 註冊成功！帶開通碼去兌換吧' : '✅ 登入成功！';
      destination();
    } else {
      if(mode==='register' && r.status===400 && /已註冊/.test(d.detail||'')){
        $('msg').className='msg'; $('msg').textContent=d.detail+' → 已幫你切到登入';
        mode='login'; toggleMode(); toggleMode();
      } else { $('msg').className='msg err'; $('msg').textContent=d.detail||'失敗'; }
    }
  }catch(e){ $('msg').className='msg err'; $('msg').textContent='網路錯誤：'+e.message; }
};
function destination(){
  setTimeout(()=> location.href = 'pricing.html#activate', 800);
}
</script>
</body>
</html>
