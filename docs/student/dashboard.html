<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>學生首頁 — 學生賺分平台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
  background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
  color: #e0e0e0;
  min-height: 100vh;
  padding-bottom: 80px;
}
.container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.header-logo { display: flex; align-items: center; gap: 8px; }
.header-logo span { font-size: 1.4rem; }
.header-logo h2 {
  font-size: 1.05rem;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
}
.header-right { display: flex; align-items: center; gap: 12px; }
.points-badge {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1a1a2e;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 4px;
}
.points-badge .pts-num { min-width: 24px; display: inline-block; text-align: center; }
.student-name { font-size: 0.85rem; color: #aaaacc; }
.logout-btn { background: none; border: 1px solid rgba(255,255,255,0.1); color: #f87171; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: all 0.3s; }
.logout-btn:hover { background: rgba(248,113,113,0.1); border-color: #f87171; }

.points-card {
  background: linear-gradient(135deg, rgba(247,151,30,0.15), rgba(255,210,0,0.08));
  border: 1px solid rgba(247,151,30,0.2);
  border-radius: 20px;
  padding: 28px 24px;
  margin: 20px 0;
  text-align: center;
}
.points-card .label { font-size: 0.85rem; color: #9999bb; margin-bottom: 4px; }
.points-card .balance {
  font-size: 3rem;
  font-weight: 800;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}
.points-card .balance-sub {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-top: 12px;
  font-size: 0.85rem;
}
.points-card .balance-sub div span { display: block; font-weight: 700; font-size: 1rem; }
.earned { color: #4ade80; }
.spent { color: #f87171; }

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 20px 0;
}
.stat-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 16px 12px;
  text-align: center;
}
.stat-card .stat-icon { font-size: 1.5rem; margin-bottom: 6px; }
.stat-card .stat-value { font-size: 1.3rem; font-weight: 700; color: #fff; }
.stat-card .stat-label { font-size: 0.75rem; color: #8888aa; margin-top: 2px; }

.section-title { font-size: 1rem; font-weight: 700; margin: 24px 0 12px; color: #ccccee; display: flex; align-items: center; gap: 8px; }

.transaction-list { list-style: none; }
.tx-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  margin-bottom: 8px;
  transition: all 0.3s;
}
.tx-item:hover { background: rgba(255,255,255,0.06); }
.tx-icon { font-size: 1.4rem; width: 40px; text-align: center; }
.tx-info { flex: 1; min-width: 0; }
.tx-info .tx-desc { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-info .tx-date { font-size: 0.75rem; color: #6666aa; margin-top: 2px; }
.tx-amount { font-size: 1rem; font-weight: 700; white-space: nowrap; }
.tx-amount.earned { color: #4ade80; }
.tx-amount.spent { color: #f87171; }

.quick-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 20px 0;
}
.qaction {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 20px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  text-decoration: none;
  color: inherit;
}
.qaction:hover { transform: translateY(-4px); background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }
.qaction .qa-icon { font-size: 2rem; margin-bottom: 8px; display: block; }
.qaction .qa-label { font-size: 0.82rem; font-weight: 600; color: #ccccee; }

.tips-card {
  background: rgba(74,222,128,0.06);
  border: 1px solid rgba(74,222,128,0.12);
  border-radius: 14px;
  padding: 16px;
  margin: 20px 0;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.85rem;
  color: #4ade80;
}
.tips-card .tips-icon { font-size: 1.5rem; }

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(15,15,26,0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  justify-content: space-around;
  padding: 8px 0;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  z-index: 200;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 12px;
  text-decoration: none;
  color: #6666aa;
  font-size: 0.7rem;
  transition: all 0.3s;
  border: none;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.nav-item .nav-icon { font-size: 1.3rem; }
.nav-item.active { color: #f7971e; }
.nav-item:hover { color: #f7971e; }

.skeleton {
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
@keyframes countUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.animate-in { animation: countUp 0.4s ease forwards; }

.hidden { display: none !important; }

@media (max-width: 380px) {
  .stats-row { gap: 8px; }
  .stat-card { padding: 12px 8px; }
  .stat-card .stat-value { font-size: 1.1rem; }
  .quick-actions { gap: 8px; }
  .qaction { padding: 16px 8px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <span>🏆</span>
    <h2>賺分平台</h2>
  </div>
  <div class="header-right">
    <div class="points-badge">⭐ <span class="pts-num" id="headerPoints">0</span></div>
    <span class="student-name" id="studentName">載入中</span>
    <button class="logout-btn" onclick="handleLogout()">登出</button>
  </div>
</div>

<div class="container">
  <div class="points-card" id="pointsCard">
    <div class="label">可用點數</div>
    <div class="balance" id="balanceDisplay">0</div>
    <div class="balance-sub">
      <div>總獲得 <span class="earned" id="totalEarned">0</span></div>
      <div>總花費 <span class="spent" id="totalSpent">0</span></div>
    </div>
  </div>

  <div class="stats-row" id="statsRow">
    <div class="stat-card"><span class="stat-icon">📋</span><div class="stat-value" id="statTasks">-</div><div class="stat-label">本週任務</div></div>
    <div class="stat-card"><span class="stat-icon">🔥</span><div class="stat-value" id="statStreak">-</div><div class="stat-label">連續天數</div></div>
    <div class="stat-card"><span class="stat-icon">🏅</span><div class="stat-value" id="statRank">-</div><div class="stat-label">排名</div></div>
  </div>

  <div class="quick-actions">
    <a href="tasks.html" class="qaction"><span class="qa-icon">✅</span><span class="qa-label">做任務賺點數</span></a>
    <a href="rewards.html" class="qaction"><span class="qa-icon">🎁</span><span class="qa-label">兌換獎勵</span></a>
    <a href="history.html" class="qaction"><span class="qa-icon">📊</span><span class="qa-label">交易記錄</span></a>
  </div>

  <div class="tips-card">
    <span class="tips-icon">💡</span>
    <span>每日簽到可賺 3 點！連續簽到還有 bonus！</span>
  </div>

  <div class="section-title">📄 最近交易</div>
  <ul class="transaction-list" id="transactionList">
    <li style="text-align:center;padding:20px;color:#6666aa">載入中...</li>
  </ul>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item active"><span class="nav-icon">🏠</span>首頁</a>
  <a href="tasks.html" class="nav-item"><span class="nav-icon">✅</span>任務</a>
  <a href="rewards.html" class="nav-item"><span class="nav-icon">🎁</span>兌換</a>
  <a href="history.html" class="nav-item"><span class="nav-icon">📊</span>記錄</a>
  <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>個人</a>
</nav>

<script>
const API = '/api/student';

function getToken() { return localStorage.getItem('student_token'); }
function getUser() { try { return JSON.parse(localStorage.getItem('student_user')); } catch(e) { return null; } }

function handleLogout() {
  if (confirm('確定要登出嗎？')) {
    localStorage.removeItem('student_token');
    localStorage.removeItem('student_user');
    window.location.href = 'index.html';
  }
}

function authHeaders() {
  const t = getToken();
  if (!t) { window.location.href = 'index.html'; return {}; }
  return { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' };
}

function formatDate(d) {
  const date = new Date(d);
  const mm = String(date.getMonth()+1).padStart(2,'0');
  const dd = String(date.getDate()).padStart(2,'0');
  const hh = String(date.getHours()).padStart(2,'0');
  const mi = String(date.getMinutes()).padStart(2,'0');
  return `${mm}/${dd} ${hh}:${mi}`;
}

function getTxIcon(type) {
  const map = { 'earn': '💵', 'redeem': '🎁', 'spend': '🛒', 'adjust': '⚙️', 'daily': '📅', 'bonus': '🎉' };
  return map[type] || '💳';
}

async function loadDashboard() {
  const user = getUser();
  if (user) {
    document.getElementById('studentName').textContent = user.name || '學生';
  }
  try {
    const [pointsRes, txRes, statsRes] = await Promise.all([
      fetch(`${API}/points`, { headers: authHeaders() }),
      fetch(`${API}/transactions`, { headers: authHeaders() }),
      fetch(`${API}/stats`, { headers: authHeaders() })
    ]);
    if (pointsRes.status === 401 || txRes.status === 401 || statsRes.status === 401) { handleLogout(); return; }
    const points = await pointsRes.json();
    const txData = await txRes.json();
    const stats = await statsRes.json();

    const balance = points.balance || 0;
    document.getElementById('balanceDisplay').textContent = balance;
    document.getElementById('headerPoints').textContent = balance;
    document.getElementById('totalEarned').textContent = points.total_earned || 0;
    document.getElementById('totalSpent').textContent = points.total_spent || 0;

    document.getElementById('statTasks').textContent = stats.tasks_this_week ?? '-';
    document.getElementById('statStreak').textContent = stats.streak ?? '-';
    document.getElementById('statRank').textContent = stats.rank ? `#${stats.rank}` : '-';

    const txsApprox = (txData.transactions || txData.items || []);
    const txs = txsApprox.slice(0, 5);
    const list = document.getElementById('transactionList');
    if (txs.length === 0) {
      list.innerHTML = '<li style="text-align:center;padding:20px;color:#6666aa">尚無交易記錄</li>';
    } else {
      list.innerHTML = txs.map(tx => `
        <li class="tx-item">
          <span class="tx-icon">${getTxIcon(tx.type)}</span>
          <div class="tx-info">
            <div class="tx-desc">${tx.description || ''}</div>
            <div class="tx-date">${formatDate(tx.created_at)}</div>
          </div>
          <span class="tx-amount ${tx.amount > 0 ? 'earned' : 'spent'}">${tx.amount > 0 ? '+' : ''}${tx.amount}</span>
        </li>
      `).join('');
    }
  } catch (err) {
    console.error(err);
    document.getElementById('transactionList').innerHTML = '<li style="text-align:center;padding:20px;color:#f87171">載入失敗</li>';
  }
}

(function init() {
  if (!getToken()) { window.location.href = 'index.html'; return; }
  loadDashboard();
})();
</script>
</body>
</html>
