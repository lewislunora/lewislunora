<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>任務列表 — 學生賺分平台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
  background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
  color: #e0e0e0;
  min-height: 100vh;
  padding-bottom: 80px;
}
.container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.header h1 { font-size: 1.1rem; font-weight: 700; color: #ccccee; display: flex; align-items: center; gap: 8px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.points-badge {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1a1a2e;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 4px;
}

.section-title { font-size: 1rem; font-weight: 700; margin: 24px 0 12px; color: #ccccee; display: flex; align-items: center; gap: 8px; }
.section-title-small { font-size: 0.85rem; font-weight: 600; margin: 20px 0 10px; color: #8888aa; display: flex; align-items: center; gap: 6px; }

.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: #8888aa;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.3s;
  white-space: nowrap;
}
.filter-chip.active { background: rgba(247,151,30,0.15); border-color: #f7971e; color: #f7971e; font-weight: 600; }

.task-grid { display: flex; flex-direction: column; gap: 12px; }
.task-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.3s;
}
.task-card:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
.task-card .task-icon { font-size: 2.2rem; width: 48px; text-align: center; flex-shrink: 0; }
.task-card .task-info { flex: 1; min-width: 0; }
.task-card .task-info h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
.task-card .task-info p { font-size: 0.8rem; color: #8888aa; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task-card .task-points {
  flex-shrink: 0;
  background: linear-gradient(135deg, rgba(247,151,30,0.15), rgba(255,210,0,0.08));
  border: 1px solid rgba(247,151,30,0.2);
  padding: 6px 12px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.9rem;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
}
.task-card .task-points small { display: block; font-size: 0.6rem; -webkit-text-fill-color: #6666aa; background: none; }

.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 300;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px 20px 0 0;
  padding: 28px 20px;
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  max-width: 480px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
  width: 40px; height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.modal h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.modal .modal-desc { color: #9999bb; font-size: 0.9rem; line-height: 1.5; margin-bottom: 16px; }
.modal .modal-points {
  background: linear-gradient(135deg, rgba(247,151,30,0.15), rgba(255,210,0,0.08));
  border: 1px solid rgba(247,151,30,0.2);
  border-radius: 10px;
  padding: 10px 14px;
  text-align: center;
  color: #f7971e;
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 16px;
}
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 0.85rem; color: #aaaacc; margin-bottom: 6px; font-weight: 500; }
.form-group textarea {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: #e0e0e0;
  font-size: 0.95rem;
  outline: none;
  resize: vertical;
  min-height: 80px;
}
.form-group textarea:focus { border-color: #f7971e; }
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1a1a2e;
  position: relative;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(247,151,30,0.3); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn .spinner {
  display: none;
  width: 20px; height: 20px;
  border: 3px solid rgba(26,26,46,0.2);
  border-top-color: #1a1a2e;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  position: absolute;
  top: 50%; left: 50%;
  margin: -10px 0 0 -10px;
}
.btn.loading .spinner { display: block; }
.btn.loading .btn-text { visibility: hidden; }
.btn-secondary { background: rgba(255,255,255,0.06); color: #aaaacc; }
.btn-secondary:hover { background: rgba(255,255,255,0.1); box-shadow: none; transform: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 500;
  z-index: 500;
  animation: toastIn 0.3s ease;
  max-width: 420px;
  width: calc(100% - 40px);
  text-align: center;
}
.toast.success { background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.3); color: #4ade80; }
.toast.error { background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.3); color: #f87171; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(15,15,26,0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  justify-content: space-around;
  padding: 8px 0;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  z-index: 200;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 12px;
  text-decoration: none;
  color: #6666aa;
  font-size: 0.7rem;
  transition: all 0.3s;
  -webkit-tap-highlight-color: transparent;
}
.nav-item .nav-icon { font-size: 1.3rem; }
.nav-item.active { color: #f7971e; }

.status-badge {
  display: inline-block;
  font-size: 0.7rem;
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 500;
}
.status-badge.pending { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
.status-badge.approved { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }

.empty-state { text-align: center; padding: 40px 20px; color: #6666aa; }
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; display: block; }
.empty-state p { font-size: 0.9rem; }

.skeleton { background: rgba(255,255,255,0.06); border-radius: 12px; animation: pulse 1.5s ease-in-out infinite; height: 72px; margin-bottom: 12px; }
@keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="header">
  <h1>✅ 任務列表</h1>
  <div class="header-right">
    <div class="points-badge">⭐ <span id="headerPoints">0</span></div>
  </div>
</div>

<div class="container">
  <div class="filter-row" id="filterRow">
    <button class="filter-chip active" data-filter="all">全部</button>
    <button class="filter-chip" data-filter="ad">📺 看廣告</button>
    <button class="filter-chip" data-filter="review">✍️ 寫心得</button>
    <button class="filter-chip" data-filter="quiz">🧠 答題</button>
    <button class="filter-chip" data-filter="creative">🎨 創作內容</button>
    <button class="filter-chip" data-filter="daily">📅 每日</button>
  </div>

  <div id="dailySection" class="hidden">
    <div class="section-title">📅 每日任務</div>
    <div class="task-grid" id="dailyTasks"></div>
  </div>

  <div class="section-title">📋 所有任務</div>
  <div id="taskList">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>首頁</a>
  <a href="tasks.html" class="nav-item active"><span class="nav-icon">✅</span>任務</a>
  <a href="rewards.html" class="nav-item"><span class="nav-icon">🎁</span>兌換</a>
  <a href="history.html" class="nav-item"><span class="nav-icon">📊</span>記錄</a>
  <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>個人</a>
</nav>

<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modalTitle"><span id="modalIcon">✅</span> <span id="modalName">任務名稱</span></h2>
    <p class="modal-desc" id="modalDesc">描述</p>
    <div class="modal-points" id="modalPoints">+0 點數</div>
    <form id="submitForm" onsubmit="handleSubmit(event)">
      <div class="form-group" id="proofGroup">
        <label>提交證明 (選填)</label>
        <textarea id="proofText" placeholder="請描述你完成了什麼任務..."></textarea>
      </div>
      <button type="submit" class="btn" id="submitBtn"><span class="btn-text" id="submitBtnText">提交任務</span><span class="spinner"></span></button>
      <button type="button" class="btn btn-secondary" onclick="closeModal()" style="margin-top:8px">取消</button>
    </form>
  </div>
</div>

<script>
const API = '/api/student';
let allTasks = [];
let currentTaskId = null;
let currentFilter = 'all';

function getToken() { return localStorage.getItem('student_token'); }
function authHeaders() {
  const t = getToken();
  if (!t) { window.location.href = 'index.html'; return {}; }
  return { 'Authorization': `Bearer ${t}`, 'Content-Type': 'application/json' };
}

function showToast(msg, type = 'success') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
}

async function loadPoints() {
  try {
    const res = await fetch(`${API}/points`, { headers: authHeaders() });
    if (res.status === 401) { handleLogout(); return; }
    const data = await res.json();
    document.getElementById('headerPoints').textContent = data.balance || 0;
  } catch(e) {}
}

function handleLogout() {
  localStorage.removeItem('student_token');
  localStorage.removeItem('student_user');
  window.location.href = 'index.html';
}

function categoryIcon(cat) {
  const map = { 'ad': '📺', 'review': '✍️', 'quiz': '🧠', 'creative': '🎨', 'daily': '📅', 'other': '📋' };
  return map[cat] || '📋';
}

function renderTasks(tasks) {
  const filtered = currentFilter === 'all' ? tasks : tasks.filter(t => t.category === currentFilter);
  const daily = filtered.filter(t => t.category === 'daily');
  const others = filtered.filter(t => t.category !== 'daily');

  const ds = document.getElementById('dailySection');
  if (daily.length > 0) {
    ds.classList.remove('hidden');
    document.getElementById('dailyTasks').innerHTML = daily.map(t => taskCardHTML(t)).join('');
  } else {
    ds.classList.add('hidden');
  }

  const list = document.getElementById('taskList');
  if (others.length === 0 && daily.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><p>暫無任務</p></div>';
  } else if (others.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="empty-icon">✅</span><p>全部已完成！</p></div>';
  } else {
    list.innerHTML = others.map(t => taskCardHTML(t)).join('');
  }
}

function taskCardHTML(t) {
  return `<div class="task-card" onclick="openTask('${t.id}')">
    <span class="task-icon">${t.icon || categoryIcon(t.category)}</span>
    <div class="task-info">
      <h4>${t.title}</h4>
      <p>${t.description || ''}</p>
    </div>
    <div class="task-points">+${t.points_reward}<small>點</small></div>
  </div>`;
}

async function loadTasks() {
  document.getElementById('taskList').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  try {
    const res = await fetch(`${API}/tasks`, { headers: authHeaders() });
    if (res.status === 401) { handleLogout(); return; }
    const data = await res.json();
    allTasks = data.tasks || data.items || [];
    renderTasks(allTasks);
  } catch (e) {
    document.getElementById('taskList').innerHTML = '<div class="empty-state"><span class="empty-icon">❌</span><p>載入失敗</p></div>';
  }
}

function openTask(id) {
  const task = allTasks.find(t => String(t.id) === String(id));
  if (!task) return;
  currentTaskId = id;
  document.getElementById('modalIcon').textContent = task.icon || categoryIcon(task.category);
  document.getElementById('modalName').textContent = task.title;
  document.getElementById('modalDesc').textContent = task.description || '';
  document.getElementById('modalPoints').textContent = `+${task.points_reward} 點數`;
  const btn = document.getElementById('submitBtnText');
  btn.textContent = task.auto_approve ? '開始任務' : '提交任務';
  document.getElementById('submitForm').reset();
  document.getElementById('taskModal').classList.add('open');
  document.getElementById('submitBtn').classList.remove('loading');
  document.getElementById('submitBtn').disabled = false;
}

function closeModal() {
  document.getElementById('taskModal').classList.remove('open');
  currentTaskId = null;
}

async function handleSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const proof = document.getElementById('proofText').value.trim();
  btn.classList.add('loading'); btn.disabled = true;
  try {
    const res = await fetch(`${API}/tasks/${currentTaskId}/submit`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ proof_text: proof || undefined })
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || '提交失敗', 'error'); btn.classList.remove('loading'); btn.disabled = false; return; }
    showToast(`任務完成！獲得 ${data.points_earned} 點數 🎉`);
    closeModal();
    loadTasks();
    loadPoints();
  } catch (e) {
    showToast('網路錯誤', 'error');
    btn.classList.remove('loading'); btn.disabled = false;
  }
}

document.getElementById('filterRow').addEventListener('click', function(e) {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.filter;
  renderTasks(allTasks);
});

document.getElementById('taskModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

(function init() {
  if (!getToken()) { window.location.href = 'index.html'; return; }
  loadTasks();
  loadPoints();
})();
</script>
</body>
</html>
