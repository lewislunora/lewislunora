name: CI CD

on:
  push:
    branches: [main]
    paths:
      - "xiangchuan/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "xiangchuan/**"

env:
  IMAGE: ghcr.io/${{ github.repository }}/platform-app
  TF_DIR: xiangchuan/k3s-platform/terraform

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xiangchuan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xiangchuan/marketing_system/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r marketing_system/requirements.txt

      - name: Lint
        run: |
          pip install ruff black isort
          ruff check . || true
          black --check --diff . || true
          isort --check-only --diff . || true

      - name: Test
        run: python -m pytest marketing_system/tests -q

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff xiangchuan/k3s-platform/terraform

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: xiangchuan/k3s-platform/terraform

      - name: terraform validate
        run: terraform validate
        working-directory: xiangchuan/k3s-platform/terraform

  manifest-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate k8s manifests
        run: |
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -ignore-missing-schemas \
            xiangchuan/k3s-platform/k8s-manifests/*.yaml \
            xiangchuan/k3s-platform/argocd/*.yaml

  build:
    needs: [test, terraform-validate, manifest-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: xiangchuan
          file: xiangchuan/k3s-platform/remote/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Setup kubernetes config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::warning::KUBE_CONFIG secret 未設定，略過部署（僅 build image）"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "skip=false" >> "$GITHUB_ENV"

      - name: Argo CD 自動同步（manifests 已由 Git 觸發）
        if: env.skip == 'false'
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -e
          if [ -n "$ARGOCD_AUTH_TOKEN" ] && [ -n "$ARGOCD_SERVER" ]; then
            if ! command -v argocd >/dev/null 2>&1; then
              curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/download/v2.13.3/argocd-linux-amd64
              install /tmp/argocd /usr/local/bin/argocd
            fi
            argocd app set xiangchuan-platform \
              --repo https://github.com/${{ github.repository }}.git \
              --revision ${{ github.sha }} || true
            argocd app wait xiangchuan-platform \
              --timeout 300 --sync --health || true
          else
            echo "::warning::ARGOCD_AUTH_TOKEN / ARGOCD_SERVER 未設定，Argo CD 自同步約 3 分鐘內會抓到新 commit"
          fi

      - name: Health check
        if: env.skip == 'false'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE_URL/api/status" || true)
              if [ "$code" = "200" ]; then
                echo "health check ok: $code"
                exit 0
              fi
              sleep 15
            done
            echo "::warning::health check timeout（最後狀態 $code）"
          else
            echo "::warning::SITE_URL 未設定，略過 health check"
          fi
