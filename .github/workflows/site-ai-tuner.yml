name: Site AI Tuner

# 每日量測兩站流量 → Groq 分析 → 低風險變更自動 commit + 部署。
# 高風險 / 中風險變更只會出現在報告裡，不會自動套用。
# 手動觸發預設 dry-run（只分析不改站）。

on:
  schedule:
    - cron: "23 8 * * *"   # 08:23 UTC = 16:23 台北
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只分析、不改站（dry-run）"
        type: boolean
        default: true
      since_hours:
        description: "量表回看時數"
        type: string
        default: "168"

concurrency:
  group: site-ai-tuner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    name: 量測與 AI 提案
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 收集量表與網站庫存
        working-directory: xiangchuan/marketing_system/scripts
        run: |
          python ai_tuner.py collect --since "${{ github.event.inputs.since_hours || '168' }}"
          python ai_tuner.py inventory

      - name: 呼叫 Groq 產生提案
        working-directory: xiangchuan/marketing_system/scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ai_tuner.py propose

      - name: 產生 Markdown 報告
        working-directory: xiangchuan/marketing_system/scripts
        run: python ai_tuner.py report --out ../ai-tuner/reports/$(date -u +%F).md

      - name: 上傳提案 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuner-plan
          retention-days: 14
          path: |
            xiangchuan/ai-tuner/metrics/*.json
            xiangchuan/ai-tuner/proposals/*.json
            xiangchuan/ai-tuner/inventory.json
            xiangchuan/ai-tuner/reports/*.md

  apply:
    name: 套用低風險變更並部署
    needs: [analyze]
    if: github.event_name == 'schedule' || github.event.inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xiangchuan/marketing_system/requirements.txt

      - name: 下載提案
        uses: actions/download-artifact@v4
        with:
          name: tuner-plan

      - name: 安裝相依（測試用）
        working-directory: xiangchuan
        run: |
          python -m pip install --upgrade pip
          pip install -r marketing_system/requirements.txt

      - name: 套用 → 測試 → commit → push
        working-directory: xiangchuan/marketing_system/scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          git config user.name "site-ai-tuner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python ai_tuner.py apply \
            --proposals ../ai-tuner/proposals/$(date -u +%F).json \
            --yes --push \
            --message "ai-tuner: $(date -u +%F) 自動調整"

  verify:
    name: 部署後驗證
    needs: [apply]
    if: always() && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 等 Render 上線並驗證
        run: |
          ok=0
          for i in $(seq 1 16); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              https://lewislunora.onrender.com/api/health || true)
            echo "try $i: /api/health -> $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::/api/health 尚未上線（部署可能仍在進行）"
          fi
          curl -s --max-time 60 https://lewislunora.onrender.com/ \
            | grep -q "analytics-beacon.js" \
            && echo "beacon: present" \
            || echo "::warning::首頁尚未看到 analytics-beacon.js"
